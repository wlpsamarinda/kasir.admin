                <button class="btn btn-sm btn-outline-primary" onclick="loadStockData('${unit}')"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadView('stockcard','${unit}')"><i class="fa-solid fa-book-open me-2"></i>Kartu Stok</button>
                <button class="btn btn-sm btn-outline-danger" onclick="exportTable('stock','pdf','${unit}')"><i class="fa-solid fa-file-pdf me-2"></i>PDF</button>
                <button class="btn btn-sm btn-outline-success" onclick="exportTable('stock','xlsx','${unit}')"><i class="fa-solid fa-file-excel me-2"></i>XLSX</button>
                ${(currentUser.role === 'Owner' || currentUser.role === 'Admin') ? `<button class="btn btn-sm btn-primary" onclick="saveAllStock('${unit}')"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Semua</button>` : ''}
              </div>
              <p class="text-muted small">Semua produk yang dijual di outlet ini ditampilkan di sini. Tidak semua produk perlu dilacak stoknya — produk yang belum pernah diisi stok akan tetap tampil dengan status "Belum Dicatat".${(currentUser.role === 'Owner' || currentUser.role === 'Admin') ? ' Kolom <strong>Qty</strong> &amp; <strong>Min. Stok</strong> bisa langsung diedit di tabel - isi semua baris yang perlu diubah lalu klik <strong>Simpan Semua</strong> di atas, atau klik ikon simpan per baris untuk baris tunggal.' : ''}</p>
              <div class="table-responsive"><table class="table table-striped w-100" id="stock-table-${unit}">
                <thead><tr><th>Kode</th><th>Produk</th><th>Kategori</th><th>Qty</th><th>Min. Stok</th><th>Update Terakhir</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="stock-tbody-${unit}"></tbody>
              </table></div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card p-4 shadow-sm mb-3 border-primary">
              <h5 class="mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>Set Stok Manual</h5>
              ${(currentUser.role === 'Owner' || currentUser.role === 'Admin') ? `
              <p class="text-muted small">Input/koreksi stok produk secara langsung untuk outlet ini — bisa dipakai walaupun produk tersebut belum pernah tercatat stok gudangnya sama sekali.</p>
              <div id="manual-stock-form-${unit}"></div>` : `
              <p class="text-muted small mb-0"><i class="fa-solid fa-lock me-1"></i>Fitur ini dikunci untuk role Kasir. Koreksi stok manual hanya bisa dilakukan oleh Owner/Admin.</p>`}
            </div>
            <div class="card p-4 shadow-sm mb-3">
              <h5 class="mb-3">Stok Gudang Pusat</h5>
              <p class="text-muted small">${(currentUser.role === 'Owner' || currentUser.role === 'Admin') ? 'Tambahkan stok masuk ke Gudang Pusat (mis. dari supplier), supaya bisa ditransfer ke outlet lewat panel di bawah.' : 'Kasir hanya bisa melihat (view) stok Gudang Pusat. Pengisian stok gudang pusat hanya bisa dilakukan oleh Owner/Admin.'}</p>
              <div id="central-stock-form-${unit}"></div>
            </div>
            <div class="card p-4 shadow-sm mb-3">
              <h5 class="mb-3">Tambah Stok dari Gudang Pusat</h5>
              <p class="text-muted small">Transfer stok dari Gudang Pusat ke outlet ini (stok gudang berkurang, stok outlet bertambah).</p>
              <div id="stock-form-${unit}"></div>
            </div>
            <div class="card p-4 shadow-sm">
              <h5 class="mb-3">Riwayat Penambahan Stok</h5>
              <div class="table-responsive" style="max-height:300px;overflow-y:auto"><table class="table table-sm">
                <thead><tr><th>Tanggal</th><th>Produk</th><th>Qty</th><th>Oleh</th></tr></thead>
                <tbody id="stock-history-${unit}"></tbody>
              </table></div>
            </div>
          </div>
        </div>`);
      loadStockData(unit);
    }

    let stockCache = {};
    function loadStockData(unit) {
      let canEditGrid = (currentUser.role === 'Owner' || currentUser.role === 'Admin');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        stockCache[unit] = res.stock;
        let tbody = '';
        res.stock.forEach(s => {
          let statusBadge;
          if (!s.HasRecord) statusBadge = '<span class="badge bg-secondary">Belum Dicatat</span>';
          else statusBadge = stockStatusBadge_(s.Quantity, s.MinStock);
          let qtyCell = canEditGrid
            ? `<input type="number" min="0" class="form-control form-control-sm stock-qty-input" value="${esc(s.Quantity)}">`
            : esc(s.Quantity);
          let minCell = canEditGrid
            ? `<input type="number" min="0" class="form-control form-control-sm stock-min-input" value="${esc(s.MinStock)}">`
            : esc(s.MinStock);
          tbody += `<tr data-code="${esc(s.ProductCode)}"><td>${esc(s.ProductCode)}</td><td>${esc(s.ProductName)}</td><td>${esc(s.Category)}</td><td>${qtyCell}</td><td>${minCell}</td><td>${s.LastUpdated?fmtDate(s.LastUpdated):'-'}</td>
            <td>${statusBadge}</td>
            <td>
              <button class="btn btn-sm btn-outline-secondary me-1 sc-open" data-wh="${UNIT_WAREHOUSE_ID_CLIENT[unit]}" data-code="${esc(s.ProductCode)}" title="Kartu Stok"><i class="fa-solid fa-book-open"></i></button>
              ${canEditGrid ? `<button class="btn btn-sm btn-outline-primary me-1" onclick="saveStockRow('${unit}', this)" title="Simpan baris ini"><i class="fa-solid fa-floppy-disk"></i></button>` : ''}
              ${s.HasRecord ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteStockRecord('${unit}','${esc(s.ProductCode)}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>` : ''}
            </td></tr>`;
        });
        $('#stock-tbody-' + unit).html(tbody || '<tr><td colspan="8" class="text-center text-muted">Belum ada produk untuk outlet ini</td></tr>');

        // Set Stok Manual: dikunci untuk role Kasir - form input HANYA
        // diisi kalau role Owner/Admin, kalau Kasir div-nya dibiarkan kosong
        // (pesan "dikunci" sudah ditampilkan lewat renderStockView). Dropdown
        // berisi SEMUA produk outlet ini (termasuk yang belum pernah dicatat
        // stoknya sama sekali).
        let manualOptions = res.stock.map(s => `<option value="${esc(s.ProductCode)}" data-qty="${s.Quantity}" data-min="${s.MinStock}">${esc(s.ProductName)} ${s.HasRecord ? '(saat ini: ' + s.Quantity + ')' : '(belum dicatat)'}</option>`).join('');
        if (currentUser.role === 'Owner' || currentUser.role === 'Admin') {
          $('#manual-stock-form-' + unit).html(`
            <select id="manual-product-${unit}" class="form-select mb-2" onchange="prefillManualStock('${unit}')">${manualOptions || '<option value="">-- Belum ada produk untuk outlet ini --</option>'}</select>
            <input id="manual-qty-${unit}" type="number" min="0" class="form-control mb-2" placeholder="Jumlah Stok Saat Ini">
            <input id="manual-min-${unit}" type="number" min="0" class="form-control mb-2" placeholder="Ambang Batas Stok Menipis (default 10)">
            <button class="btn btn-primary w-100" onclick="saveManualStock('${unit}')"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Stok</button>`);
          prefillManualStock(unit);
        }

        let options = res.centralStock.map(c => `<option value="${esc(c.ProductCode)}" data-max="${c.Quantity}">${esc(c.ProductName)} (Stok Gudang: ${c.Quantity})</option>`).join('');
        $('#stock-form-' + unit).html(`
          <select id="stock-product-${unit}" class="form-select mb-2">${options || '<option value="">-- Belum ada produk untuk outlet ini --</option>'}</select>
          <input id="stock-qty-${unit}" type="number" min="1" class="form-control mb-2" placeholder="Jumlah">
          <button class="btn btn-primary w-100" onclick="addStock('${unit}')"><i class="fa-solid fa-arrow-down me-2"></i>Tambah Stok</button>`);

        // Panel "Stok Gudang Pusat": Owner/Admin dapat form untuk mengisi
        // stok masuk; Kasir hanya dapat tabel view-only (tidak bisa isi
        // stok gudang pusat sama sekali, cuma bisa melihat qty-nya).
        if (currentUser.role === 'Owner' || currentUser.role === 'Admin') {
          $('#central-stock-form-' + unit).html(`
            <select id="central-product-${unit}" class="form-select mb-2">${options || '<option value="">-- Belum ada produk untuk outlet ini --</option>'}</select>
            <input id="central-qty-${unit}" type="number" min="1" class="form-control mb-2" placeholder="Jumlah masuk">
            <button class="btn btn-outline-primary w-100" onclick="topUpCentralStock('${unit}')"><i class="fa-solid fa-plus me-2"></i>Isi Stok Gudang</button>`);
        } else {
          let viewRows = res.centralStock.map(c => `<tr><td>${esc(c.ProductName)}</td><td class="text-end">${esc(c.Quantity)}</td></tr>`).join('');
          $('#central-stock-form-' + unit).html(`
            <div class="table-responsive" style="max-height:220px;overflow-y:auto"><table class="table table-sm mb-0">
              <thead><tr><th>Produk</th><th class="text-end">Qty</th></tr></thead>
              <tbody>${viewRows || '<tr><td colspan="2" class="text-center text-muted">Belum ada data stok gudang pusat</td></tr>'}</tbody>
            </table></div>`);
        }

        let hist = '';
        res.history.forEach(h => {
          hist += `<tr><td>${fmtDate(h.Date)}</td><td>${esc(h.ProductName)}</td><td>${esc(h.QtyRequested)}</td><td>${esc(h.RequestedBy)}</td></tr>`;
        });
        $('#stock-history-' + unit).html(hist || '<tr><td colspan="4" class="text-center text-muted">Belum ada riwayat</td></tr>');
      }).withFailureHandler(errHandler).getStockView(unit, sessionToken);
    }

    function prefillManualStock(unit) {
      let sel = document.getElementById('manual-product-' + unit);
      if (!sel || !sel.options.length) return;
      let opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      $('#manual-qty-' + unit).val(opt.dataset.qty || 0);
      $('#manual-min-' + unit).val(opt.dataset.min || 10);
    }

    function saveManualStock(unit) {
      let productCode = $('#manual-product-' + unit).val();
      let qty = $('#manual-qty-' + unit).val();
      let minStock = $('#manual-min-' + unit).val();
      if (!productCode) return Swal.fire('Perhatian', 'Pilih produk terlebih dahulu.', 'warning');
      if (qty === '' || qty === null || Number(qty) < 0) return Swal.fire('Perhatian', 'Isi jumlah stok dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadStockData(unit);
      }).withFailureHandler(errHandler).setOutletStock(unit, productCode, qty, minStock || 10, sessionToken);
    }

    // Simpan satu baris grid Manajemen Stok (Qty & Min. Stok yang sedang
    // diedit inline di baris tsb) - dipakai tombol ikon simpan per baris,
    // menggantikan modal "Edit Stok" yang lama.
    function saveStockRow(unit, btnEl) {
      let tr = $(btnEl).closest('tr');
      let code = tr.data('code');
      let qty = tr.find('.stock-qty-input').val();
      let minStock = tr.find('.stock-min-input').val();
      if (qty === '' || qty === null || Number(qty) < 0) return Swal.fire('Perhatian', 'Isi jumlah stok dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadStockData(unit);
      }).withFailureHandler(errHandler).setOutletStock(unit, code, qty, minStock || 10, sessionToken);
    }

    // Simpan SEMUA baris grid Manajemen Stok sekaligus (tombol "Simpan
    // Semua") - baris dengan kolom Qty kosong/tidak valid dilewati saja,
    // tidak menggagalkan baris lain.
    function saveAllStock(unit) {
      let rows = [];
      $('#stock-tbody-' + unit + ' tr[data-code]').each(function() {
        let tr = $(this);
        let qtyInput = tr.find('.stock-qty-input');
        if (!qtyInput.length) return; // baris tanpa input editable (bukan Owner/Admin)
        let qty = qtyInput.val();
        let minStock = tr.find('.stock-min-input').val();
        if (qty === '' || qty === null || isNaN(Number(qty)) || Number(qty) < 0) return;
        rows.push({ productCode: tr.data('code'), quantity: Number(qty), minStock: (minStock === '' || isNaN(Number(minStock))) ? 10 : Number(minStock) });
      });
      if (!rows.length) return Swal.fire('Perhatian', 'Tidak ada baris dengan data Qty yang valid untuk disimpan.', 'warning');
      Swal.fire({
        title: 'Simpan semua perubahan stok?',
        text: rows.length + ' produk akan diperbarui sekaligus.',
        icon: 'question', showCancelButton: true, confirmButtonText: 'Simpan'
      }).then(r => {
        if (!r.isConfirmed) return;
        Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        google.script.run.withSuccessHandler(res => {
          Swal.close();
          if (!res) return Swal.fire('Gagal', 'Tidak ada respon dari server. Coba lagi.', 'error');
          if (!res.success) return Swal.fire('Gagal', res.message || 'Gagal menyimpan stok.', 'error');
          Toast.fire({ icon: 'success', title: res.message });
          loadStockData(unit);
        }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).bulkSetOutletStock(unit, rows, sessionToken);
      });
    }

    function topUpCentralStock(unit) {
      let productCode = $('#central-product-' + unit).val();
      let qty = $('#central-qty-' + unit).val();
      if (!productCode || !qty || qty <= 0) return Swal.fire('Perhatian', 'Pilih produk dan isi jumlah dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadStockData(unit);
      }).withFailureHandler(errHandler).addCentralStock(productCode, qty, sessionToken);
    }

    function addStock(unit) {
      let productCode = $('#stock-product-' + unit).val();
      let qty = $('#stock-qty-' + unit).val();
      if (!productCode || !qty || qty <= 0) return Swal.fire('Perhatian', 'Pilih produk dan isi jumlah dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadStockData(unit);
      }).withFailureHandler(errHandler).addStockFromGudang(unit, productCode, qty, sessionToken);
    }

    function deleteStockRecord(unit, productCode) {
      Swal.fire({ title: 'Hapus pencatatan stok produk ini?', text: 'Produk tetap ada di Master Produk, hanya catatan stok di outlet ini yang dihapus.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            loadStockData(unit);
          }).withFailureHandler(errHandler).deleteOutletStock(unit, productCode, sessionToken);
        }
      });
    }

    // ================= CEK STOK FISIK BARANG (STOK OPNAME HARIAN) =================
    // Data grid untuk kasir: sebelum mulai berjualan, kasir menghitung stok
    // fisik barangnya dan membandingkan dengan Stok Awal (= stok akhir hari
    // sebelumnya). Selisih & Nilai Selisih dihitung live di browser setiap
    // kolom "Stok Fisik" diketik, dan baru benar-benar tersimpan ke server
    // setelah tombol "Simpan Semua" diklik.
    let physicalStockCache = [];
    let physicalStockIsToday = true;
    function renderPhysicalStockView(area, unit) {
      let canEditAwal = (currentUser.role === 'Owner' || currentUser.role === 'Admin');
      let today = todayStr();
      area.html(`
        <h2 class="fw-bold mb-1">${UNIT_LABEL[unit]}</h2>
        <p class="text-muted mb-4">Cek Stok Fisik Barang</p>
        <div class="card p-4 shadow-sm">
          <div class="d-flex align-items-center flex-wrap gap-2 mb-3">
            <h5 class="mb-0 me-auto">Cek Stok Fisik (<span id="pstock-date-${unit}"></span>)</h5>
            <input type="date" id="pstock-date-input-${unit}" class="form-control form-control-sm" style="width:auto" max="${today}" value="${today}" onchange="loadPhysicalStockData('${unit}', this.value)">
            <button class="btn btn-sm btn-outline-primary" onclick="loadPhysicalStockData('${unit}')"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
            <button class="btn btn-sm btn-primary" id="pstock-save-btn-${unit}" onclick="saveAllPhysicalStock('${unit}')"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Semua</button>
            <button class="btn btn-sm btn-outline-danger" onclick="exportTable('physicalstock','pdf','${unit}')"><i class="fa-solid fa-file-pdf me-2"></i>PDF</button>
            <button class="btn btn-sm btn-outline-success" onclick="exportTable('physicalstock','xlsx','${unit}')"><i class="fa-solid fa-file-excel me-2"></i>XLSX</button>
          </div>
          <div id="pstock-widget-${unit}" class="alert alert-secondary d-flex align-items-center gap-2 mb-3">
            <i class="fa-solid fa-clipboard-check"></i><span>Memuat hasil cek stok fisik...</span>
          </div>
          <p class="text-muted small" id="pstock-hint-${unit}">Hanya produk aktif yang memakai pelacakan stok fisik yang ditampilkan (total <span id="pstock-count-${unit}">0</span> produk). Isi kolom <strong>Stok Fisik</strong> untuk tiap produk, lalu klik <strong>Simpan Semua</strong> di atas - Selisih &amp; Nilai Selisih di bawah ini masih berupa estimasi sampai benar-benar disimpan.${canEditAwal ? ' Kolom <strong>Stok Awal Hari Ini</strong> bisa Anda koreksi langsung kalau angkanya tidak sesuai catatan fisik.' : ''}</p>
          <div class="table-responsive" style="max-height:65vh;overflow-y:auto">
            <table class="table table-bordered table-hover align-middle w-100" id="pstock-table-${unit}">
              <thead class="table-dark" style="position:sticky;top:0;z-index:1">
                <tr><th>No</th><th>Kode</th><th>Produk</th><th>Kategori</th><th style="min-width:130px">Stok Awal</th><th style="min-width:140px">Stok Fisik</th><th>Selisih</th><th>Nilai Selisih (Rp)</th></tr>
              </thead>
              <tbody id="pstock-tbody-${unit}"></tbody>
              <tfoot>
                <tr class="table-secondary fw-bold">
                  <td colspan="4">TOTAL</td>
                  <td id="pstock-total-awal-${unit}">0</td>
                  <td>-</td>
                  <td id="pstock-total-selisih-${unit}">0</td>
                  <td id="pstock-total-nilai-${unit}">Rp 0</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>`);
      loadPhysicalStockData(unit, today);
    }

    // Baca nilai Stok Awal sebuah baris - bisa berupa <input> (kalau
    // Owner/Admin, kolomnya editable) atau teks biasa (role lain).
    function readPstockAwal_(tr) {
      let inp = tr.find('.pstock-awal-input');
      if (inp.length) return Number(inp.val()) || 0;
      return Number(tr.find('.pstock-awal').text()) || 0;
    }

    function loadPhysicalStockData(unit, dateStr, isRetry) {
      let canEditAwal = (currentUser.role === 'Owner' || currentUser.role === 'Admin');
      let targetDate = dateStr || $('#pstock-date-input-' + unit).val() || todayStr();
      google.script.run.withSuccessHandler(function(res) {
        if (!res) {
          // Kadang google.script.run gagal mengirim balik hasil walau eksekusi
          // di server sukses (biasanya karena tab sempat tidak aktif/koneksi
          // sempat putus). Coba sekali lagi otomatis sebelum menampilkan error.
          if (!isRetry) return setTimeout(function() { loadPhysicalStockData(unit, targetDate, true); }, 800);
          return Swal.fire('Gagal', 'Tidak ada respon dari server. Coba klik "Refresh Data" lagi. Kalau terus terjadi, cek Apps Script > Executions untuk melihat detail error.', 'error');
        }
        if (!res.success) return Swal.fire('Gagal', res.message || 'Gagal memuat data stok fisik.', 'error');
        physicalStockCache = res.products;
        physicalStockIsToday = !!res.isToday;
        $('#pstock-date-' + unit).text(fmtDate(res.date));
        $('#pstock-date-input-' + unit).val(res.date);
        $('#pstock-count-' + unit).text(res.products.length);
        // Kalau sedang melihat riwayat (bukan hari ini): kunci semua input
        // (read-only) & sembunyikan tombol Simpan Semua - halaman ini hanya
        // untuk MELIHAT hasil cek stok fisik tanggal tsb, bukan mengedit.
        let readOnly = !physicalStockIsToday;
        $('#pstock-save-btn-' + unit).toggle(!readOnly);
        $('#pstock-hint-' + unit).toggle(!readOnly);
        let tbody = '';
        res.products.forEach((p, idx) => {
          let stokFisikVal = (p.StokFisik === null || p.StokFisik === undefined) ? '' : p.StokFisik;
          let awalCell = (canEditAwal && !readOnly)
            ? `<input type="number" min="0" class="form-control form-control-sm pstock-awal-input" value="${esc(p.StokAwal)}" oninput="recalcPhysicalStockRow('${unit}', $(this).closest('tr').find('.pstock-input')[0])">`
            : `<span class="pstock-awal">${esc(p.StokAwal)}</span>`;
          let fisikCell = readOnly
            ? `<span class="pstock-input-ro">${esc(stokFisikVal)}</span>`
            : `<input type="number" min="0" class="form-control form-control-sm pstock-input" value="${esc(stokFisikVal)}" oninput="recalcPhysicalStockRow('${unit}', this)">`;
          tbody += `<tr data-code="${esc(p.ProductCode)}">
            <td>${idx + 1}</td>
            <td>${esc(p.ProductCode)}</td><td>${esc(p.ProductName)}</td><td>${esc(p.Category)}</td>
            <td>${awalCell}</td>
            <td>${fisikCell}</td>
            <td class="pstock-selisih text-center">-</td>
            <td class="pstock-nilai text-end">-</td>
          </tr>`;
        });
        $('#pstock-tbody-' + unit).html(tbody || '<tr><td colspan="8" class="text-center text-muted">' + (readOnly ? 'Tidak ada catatan cek stok fisik pada tanggal ini' : 'Tidak ada produk dengan pelacakan stok fisik untuk outlet ini') + '</td></tr>');
        if (readOnly) {
          // Mode riwayat: Selisih/Nilai Selisih dihitung langsung dari data
          // tersimpan (StokFisik & StokAwal sudah pasti terisi semua).
          $('#pstock-tbody-' + unit + ' tr[data-code]').each(function() {
            let tr = $(this);
            let code = tr.data('code');
            let product = physicalStockCache.find(p => p.ProductCode === code);
            if (!product) return;
            let selisih = Number(product.StokFisik) - Number(product.StokAwal);
            let nilai = selisih * (Number(product.SellPrice) || 0);
            tr.find('.pstock-selisih').text((selisih > 0 ? '+' : '') + selisih).toggleClass('text-danger', selisih < 0).toggleClass('text-success', selisih > 0);
            tr.find('.pstock-nilai').text((nilai > 0 ? '+' : '') + fmtRp(nilai)).toggleClass('text-danger', nilai < 0).toggleClass('text-success', nilai > 0);
          });
          recalcPhysicalStockTotals(unit);
        } else {
          $('#pstock-tbody-' + unit + ' tr[data-code]').each(function() {
            recalcPhysicalStockRow(unit, $(this).find('.pstock-input')[0]);
          });
        }
      }).withFailureHandler(errHandler).getPhysicalStockCheckView(unit, targetDate, sessionToken);
    }

    function recalcPhysicalStockRow(unit, inputEl) {
      let tr = $(inputEl).closest('tr');
      let stokAwal = readPstockAwal_(tr);
      let code = tr.data('code');
      let product = physicalStockCache.find(p => p.ProductCode === code);
      let sellPrice = product ? Number(product.SellPrice) || 0 : 0;
      let val = $(inputEl).val();
      if (val === '') {
        tr.find('.pstock-selisih').text('-');
        tr.find('.pstock-nilai').text('-');
      } else {
        let stokFisik = Number(val) || 0;
        let selisih = stokFisik - stokAwal;
        let nilai = selisih * sellPrice;
        tr.find('.pstock-selisih').text((selisih > 0 ? '+' : '') + selisih).toggleClass('text-danger', selisih < 0).toggleClass('text-success', selisih > 0);
        tr.find('.pstock-nilai').text((nilai > 0 ? '+' : '') + fmtRp(nilai)).toggleClass('text-danger', nilai < 0).toggleClass('text-success', nilai > 0);
      }
      recalcPhysicalStockTotals(unit);
    }

    // Widget "Hasil Cek Stok Fisik" di atas tabel: menjumlahkan SEMUA baris
    // yang selisihnya minus (stok fisik < stok awal) - qty total minus &
    // nilai kerugiannya dalam rupiah. Kalau tidak ada satupun yang minus
    // (dan sudah ada data yang diisi/tersimpan), tampilkan "Stok Fisik Anda
    // Sesuai". Dipanggil ulang setiap kali kolom Stok Fisik berubah ATAU
    // setelah data riwayat/simpanan dimuat, supaya selalu real-time.
    function recalcPhysicalStockWidget(unit) {
      let totalMinusQty = 0, totalMinusNilai = 0, filledCount = 0;
      $('#pstock-tbody-' + unit + ' tr[data-code]').each(function() {
        let tr = $(this);
        let val = tr.find('.pstock-input').length ? tr.find('.pstock-input').val() : tr.find('.pstock-input-ro').text();
        if (val === '' || val === null || val === undefined) return;
        filledCount++;
        let stokAwal = readPstockAwal_(tr);
        let code = tr.data('code');
        let product = physicalStockCache.find(p => p.ProductCode === code);
        let sellPrice = product ? Number(product.SellPrice) || 0 : 0;
        let stokFisik = Number(val) || 0;
        let selisih = stokFisik - stokAwal;
        if (selisih < 0) {
          totalMinusQty += Math.abs(selisih);
          totalMinusNilai += Math.abs(selisih * sellPrice);
        }
      });
      let widget = $('#pstock-widget-' + unit);
      if (filledCount === 0) {
        widget.removeClass('alert-danger alert-success').addClass('alert-secondary');
        widget.html('<i class="fa-solid fa-clipboard-check"></i><span>Belum ada data Stok Fisik yang diisi/tersimpan untuk tanggal ini.</span>');
      } else if (totalMinusQty > 0) {
        widget.removeClass('alert-secondary alert-success').addClass('alert-danger');
        widget.html('<i class="fa-solid fa-triangle-exclamation"></i><span><strong>Hasil Cek Stok Fisik:</strong> Ditemukan stok minus - Qty Minus Total: <strong>' + totalMinusQty + '</strong>, Nilai Selisih: <strong>' + fmtRp(-totalMinusNilai) + '</strong></span>');
      } else {
        widget.removeClass('alert-secondary alert-danger').addClass('alert-success');
        widget.html('<i class="fa-solid fa-circle-check"></i><span><strong>Hasil Cek Stok Fisik:</strong> Stok Fisik Anda Sesuai</span>');
      }
    }

    function recalcPhysicalStockTotals(unit) {
      let totalAwal = 0, totalSelisih = 0, totalNilai = 0;
      $('#pstock-tbody-' + unit + ' tr[data-code]').each(function() {
        let tr = $(this);
        let stokAwal = readPstockAwal_(tr);
        totalAwal += stokAwal;
        let val = tr.find('.pstock-input').length ? tr.find('.pstock-input').val() : tr.find('.pstock-input-ro').text();
        if (val !== '') {
          let code = tr.data('code');
          let product = physicalStockCache.find(p => p.ProductCode === code);
          let sellPrice = product ? Number(product.SellPrice) || 0 : 0;
          let stokFisik = Number(val) || 0;
          let selisih = stokFisik - stokAwal;
          totalSelisih += selisih;
          totalNilai += selisih * sellPrice;
        }
      });
      $('#pstock-total-awal-' + unit).text(totalAwal);
      $('#pstock-total-selisih-' + unit).text((totalSelisih > 0 ? '+' : '') + totalSelisih);
      $('#pstock-total-nilai-' + unit).text((totalNilai > 0 ? '+' : '') + fmtRp(totalNilai)).toggleClass('text-danger', totalNilai < 0);
      recalcPhysicalStockWidget(unit);
    }

    function saveAllPhysicalStock(unit) {
      let canEditAwal = (currentUser.role === 'Owner' || currentUser.role === 'Admin');
      let rows = [];
      $('#pstock-tbody-' + unit + ' tr[data-code]').each(function() {
        let tr = $(this);
        let val = tr.find('.pstock-input').val();
        if (val !== '' && val !== null) {
          let row = { productCode: tr.data('code'), stokFisik: Number(val) };
          if (canEditAwal) row.stokAwal = readPstockAwal_(tr);
          rows.push(row);
        }
      });
      if (!rows.length) return Swal.fire('Perhatian', 'Isi minimal satu kolom Stok Fisik sebelum menyimpan.', 'warning');
      Swal.fire({
        title: 'Simpan semua data stok fisik?',
        text: 'Stok outlet ini akan disesuaikan mengikuti hasil stok fisik yang diinput (' + rows.length + ' produk).',
        icon: 'question', showCancelButton: true, confirmButtonText: 'Simpan'
      }).then(r => {
        if (!r.isConfirmed) return;
        Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        google.script.run.withSuccessHandler(res => {
          Swal.close();
          if (!res) return Swal.fire('Gagal', 'Tidak ada respon dari server. Coba lagi, atau cek Apps Script > Executions untuk melihat detail error.', 'error');
          if (!res.success) return Swal.fire('Gagal', res.message || 'Gagal menyimpan stok fisik.', 'error');
          Toast.fire({ icon: 'success', title: res.message });
          loadPhysicalStockData(unit, todayStr());
        }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).savePhysicalStockCheck(unit, rows, sessionToken);
      });
    }

    // ================= WAREHOUSE (manajemen multi-gudang & monitoring) =================
    // Menggantikan menu "Dapur" (placeholder). Modul ini punya 4 tab:
    // Ringkasan Gudang (kartu per gudang), Detail & Stok Gudang (per
    // gudang, termasuk set stok manual & catat stok keluar untuk gudang
    // internal), Transfer Stok Antar Gudang (gudang manapun ke gudang
    // manapun), dan Monitor Stok Semua Lokasi (matrix produk x gudang,
    // termasuk stok kasir - real-time sesuai data spreadsheet).
    let warehouseListCache = [];
    let currentWarehouseDetail = null;
    let warehouseStockCache = [];

    function renderWarehouseView(area, warehouseId) {
      area.html(`
        <h2 class="fw-bold mb-1">Warehouse</h2>
        <p class="text-muted mb-4">Manajemen Stok Gudang &amp; Monitoring Real-time Stok Kasir</p>
        <ul class="nav nav-tabs mb-3" id="wh-tabs">
          <li class="nav-item"><a class="nav-link active" data-wh-tab="overview" onclick="switchWarehouseTab('overview')" href="javascript:void(0)">Ringkasan Gudang</a></li>
          <li class="nav-item"><a class="nav-link" data-wh-tab="detail" onclick="switchWarehouseTab('detail')" href="javascript:void(0)">Detail &amp; Stok Gudang</a></li>
          <li class="nav-item"><a class="nav-link" data-wh-tab="transfer" onclick="switchWarehouseTab('transfer')" href="javascript:void(0)">Transfer Stok Antar Gudang</a></li>
          <li class="nav-item"><a class="nav-link" data-wh-tab="monitor" onclick="switchWarehouseTab('monitor')" href="javascript:void(0)">Monitor Stok Semua Lokasi</a></li>
        </ul>
        <div id="wh-tab-content"></div>`);
      // Dibuka lewat submenu sidebar (mis. "Gudang Kasir Resto") -> langsung
      // lompat ke tab Detail & Stok Gudang dengan gudang itu terpilih.
      // Dibuka lewat menu "Warehouse" biasa (tanpa param) -> tab Ringkasan.
      loadProductTypeNames_(() => {
        loadWarehouseList(() => {
          if (warehouseId) {
            switchWarehouseTab('detail');
            setTimeout(() => { $('#wh-detail-select').val(warehouseId).trigger('change'); }, 60);
          } else {
            switchWarehouseTab('overview');
          }
        });
      });
    }

    // Muat ulang daftar Tipe Produk aktif dari sheet Product_Types, dipakai
    // sebagai tab kategori di tab "Detail & Stok Gudang" modul Warehouse.
    // "Lainnya" selalu disertakan sebagai fallback kalau belum ada di daftar.
    function loadProductTypeNames_(cb) {
      google.script.run.withSuccessHandler(function(types) {
        let names = (types || []).filter(t => t.Status === 'Active').map(t => t.TypeName);
        if (names.indexOf('Lainnya') === -1) names.push('Lainnya');
        WAREHOUSE_ITEM_TYPES_CLIENT = names;
        if (cb) cb();
      }).withFailureHandler(errHandler).getProductTypes();
    }

    function loadWarehouseList(cb) {
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        warehouseListCache = res.warehouses;
        if (cb) cb();
      }).withFailureHandler(errHandler).getWarehouseList(sessionToken);
    }

    function switchWarehouseTab(tab) {
      $('#wh-tabs .nav-link').removeClass('active');
      $('#wh-tabs .nav-link[data-wh-tab="' + tab + '"]').addClass('active');
      if (tab === 'overview') renderWarehouseOverviewTab();
      else if (tab === 'detail') renderWarehouseDetailTab();
      else if (tab === 'transfer') renderWarehouseTransferTab();
      else if (tab === 'monitor') renderWarehouseMonitorTab();
    }

    function warehouseNameById_(id) {
      let w = warehouseListCache.find(x => x.WarehouseID === id);
      return w ? w.WarehouseName : (id || '-');
    }

    // ---------- TAB: Ringkasan Gudang ----------
    function renderWarehouseOverviewTab() {
      $('#wh-tab-content').html(`<div class="row g-3" id="wh-overview-cards"><div class="col-12 text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat data...</div></div>`);
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        let html = '';
        res.warehouses.forEach(w => {
          let icon = WAREHOUSE_ICON[w.WarehouseID] || 'fa-warehouse';
          html += `
            <div class="col-md-6 col-lg-4">
              <div class="card p-3 shadow-sm h-100" style="cursor:pointer" onclick="openWarehouseDetail('${w.WarehouseID}')">
                <div class="d-flex align-items-center mb-2">
                  <i class="fa-solid ${icon} fa-lg text-primary me-2"></i>
                  <h6 class="mb-0 fw-bold">${esc(w.WarehouseName)}</h6>
                  ${w.lowStock > 0 ? `<span class="badge bg-danger ms-auto">${w.lowStock} Menipis</span>` : ''}
                </div>
                <p class="text-muted small mb-2">${esc(w.Location)}${w.isInternal ? ' &middot; <span class="badge bg-secondary">Gudang Internal</span>' : ''}</p>
                <div class="d-flex justify-content-between small mb-1"><span>Total SKU</span><span class="fw-semibold">${w.totalSKU}</span></div>
                <div class="d-flex justify-content-between small mb-2"><span>Total Qty</span><span class="fw-semibold">${w.totalQty}</span></div>
                <div class="small text-muted">Konsumsi: ${w.byType.Konsumsi} &middot; Peralatan: ${w.byType.Peralatan} &middot; Bahan: ${w.byType.Bahan} &middot; Lainnya: ${w.byType.Lainnya}</div>
              </div>
            </div>`;
        });
        $('#wh-overview-cards').html(html || '<div class="col-12 text-muted text-center">Belum ada gudang.</div>');
      }).withFailureHandler(errHandler).getWarehouseOverview(sessionToken);
    }

    function openWarehouseDetail(warehouseId) {
      switchWarehouseTab('detail');
      setTimeout(() => { $('#wh-detail-select').val(warehouseId).trigger('change'); }, 60);
    }

    // ---------- TAB: Detail & Stok Gudang ----------
    function renderWarehouseDetailTab() {
      let options = warehouseListCache.map(w => `<option value="${w.WarehouseID}">${esc(w.WarehouseName)}</option>`).join('');
      $('#wh-tab-content').html(`
        <div class="card p-3 shadow-sm mb-3">
          <label class="form-label fw-semibold mb-1">Pilih Gudang</label>
          <select id="wh-detail-select" class="form-select" onchange="loadWarehouseDetail(this.value)">
            <option value="">-- Pilih Gudang --</option>${options}
          </select>
        </div>
        <div id="wh-detail-body"></div>`);
    }

    function loadWarehouseDetail(warehouseId) {
      if (!warehouseId) { $('#wh-detail-body').html(''); return; }
      currentWarehouseDetail = warehouseId;
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        warehouseStockCache = res.stock;
        let isInternal = INTERNAL_WAREHOUSE_IDS_CLIENT.indexOf(warehouseId) !== -1;
        let categoryTabs = ['Semua'].concat(WAREHOUSE_ITEM_TYPES_CLIENT).map(c =>
          `<button class="btn btn-sm ${c === 'Semua' ? 'btn-primary' : 'btn-outline-primary'} me-1 mb-1 wh-cat-btn" data-cat="${c}" onclick="filterWarehouseStock('${c}')">${c}</button>`).join('');

        $('#wh-detail-body').html(`
          <div class="row g-3">
            <div class="col-lg-7">
              <div class="card p-4 shadow-sm">
                <h5 class="mb-2">${esc(res.warehouse.WarehouseName)}</h5>
                <p class="text-muted small mb-2">${esc(res.warehouse.Location)}</p>
                <div class="mb-3">${categoryTabs}</div>
                <div class="table-responsive"><table class="table table-striped w-100" id="wh-detail-table">
                  <thead><tr><th>Kode</th><th>Produk</th><th>Tipe</th><th>Qty</th><th>Min. Stok</th><th>Status</th><th>Aksi</th></tr></thead>
                  <tbody id="wh-stock-tbody"></tbody>
                </table></div>
              </div>
            </div>
            <div class="col-lg-5">
              <div class="card p-4 shadow-sm mb-3 border-primary">
                <h5 class="mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>Set Stok Manual</h5>
                <p class="text-muted small">Input/koreksi stok produk secara langsung di gudang ini (mis. hasil stok opname).</p>
                <div id="wh-manual-form"></div>
              </div>
              ${isInternal ? `
              <div class="card p-4 shadow-sm mb-3">
                <h5 class="mb-3">Catat Stok Keluar / Terpakai</h5>
                <p class="text-muted small">Gudang ini tidak punya kasir/POS, jadi pemakaian barang dicatat manual di sini (stok otomatis berkurang).</p>
                <div id="wh-usage-form"></div>
              </div>` : ''}
              <div class="card p-4 shadow-sm">
                <h5 class="mb-3">Riwayat Mutasi Stok</h5>
                <div class="table-responsive" style="max-height:300px;overflow-y:auto"><table class="table table-sm">
                  <thead><tr><th>Tanggal</th><th>Produk</th><th>Dari</th><th>Ke</th><th>Qty</th><th>Oleh</th></tr></thead>
                  <tbody id="wh-history-tbody"></tbody>
                </table></div>
              </div>
            </div>
          </div>`);

        renderWarehouseStockTable('Semua');

        let manualOptions = res.stock.map(s => `<option value="${esc(s.ProductCode)}" data-qty="${s.Quantity}" data-min="${s.MinStock}">${esc(s.ProductName)} ${s.HasRecord ? '(saat ini: ' + s.Quantity + ')' : '(belum dicatat)'}</option>`).join('');
        $('#wh-manual-form').html(`
          <select id="wh-manual-product" class="form-select mb-2" onchange="prefillWarehouseManual()">${manualOptions || '<option value="">-- Tidak ada produk --</option>'}</select>
          <input id="wh-manual-qty" type="number" min="0" class="form-control mb-2" placeholder="Jumlah Stok Saat Ini">
          <input id="wh-manual-min" type="number" min="0" class="form-control mb-2" placeholder="Ambang Batas Stok Menipis (default 10)">
          <button class="btn btn-primary w-100" onclick="saveWarehouseManualStock()"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Stok</button>`);
        prefillWarehouseManual();

        if (isInternal) {
          $('#wh-usage-form').html(`
            <select id="wh-usage-product" class="form-select mb-2">${manualOptions || '<option value="">-- Tidak ada produk --</option>'}</select>
            <input id="wh-usage-qty" type="number" min="1" class="form-control mb-2" placeholder="Jumlah Terpakai">
            <input id="wh-usage-notes" type="text" class="form-control mb-2" placeholder="Catatan (opsional)">
            <button class="btn btn-outline-danger w-100" onclick="saveWarehouseUsage()"><i class="fa-solid fa-arrow-up me-2"></i>Catat Stok Keluar</button>`);
        }

        let hist = '';

          hist += `<tr><td>${fmtDate(h.Timestamp)}</td><td>${esc(h.ProductCode)}</td><td>${esc(warehouseNameById_(h.FromLocation))}</td><td>${esc(warehouseNameById_(h.ToLocation))}</td><td>${esc(h.Qty)}</td><td>${esc(h.User)}</td></tr>`;

    function renderWarehouseStockTable(cat) {
      let rows = warehouseStockCache.filter(s => cat === 'Semua' || s.ItemType === cat);
      let tbody = '';
      rows.forEach(s => {
        let statusBadge;
        if (!s.HasRecord) statusBadge = '<span class="badge bg-secondary">Belum Dicatat</span>';
        else statusBadge = stockStatusBadge_(s.Quantity, s.MinStock);
        tbody += `<tr><td>${esc(s.ProductCode)}</td><td>${esc(s.ProductName)}</td><td>${esc(s.ItemType)}</td><td>${esc(s.Quantity)}</td><td>${esc(s.MinStock)}</td>

            <button class="btn btn-sm btn-outline-secondary me-1 sc-open" data-wh="${esc(currentWarehouseDetail)}" data-code="${esc(s.ProductCode)}" title="Kartu Stok"><i class="fa-solid fa-book-open"></i></button>

      if ($.fn.DataTable.isDataTable('#wh-detail-table')) $('#wh-detail-table').DataTable().destroy();
      $('#wh-detail-table').DataTable({ pageLength: 10, columnDefs: [{ orderable: false, targets: -1 }] });

    function filterWarehouseStock(cat) {

      let sel = document.getElementById('wh-manual-product');

      let opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      $('#wh-manual-qty').val(opt.dataset.qty || 0);
      $('#wh-manual-min').val(opt.dataset.min || 10);

    function saveWarehouseManualStock() {
      let productCode = $('#wh-manual-product').val();
      let qty = $('#wh-manual-qty').val();
      let minStock = $('#wh-manual-min').val();
      if (!productCode) return Swal.fire('Perhatian', 'Pilih produk terlebih dahulu.', 'warning');
      if (qty === '' || qty === null || Number(qty) < 0) return Swal.fire('Perhatian', 'Isi jumlah stok dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadWarehouseDetail(currentWarehouseDetail);
      }).withFailureHandler(errHandler).setWarehouseStock(currentWarehouseDetail, productCode, qty, minStock || 10, sessionToken);

    function editWarehouseStockRow(code) {
      let s = warehouseStockCache.find(x => x.ProductCode === code);
      if (!s) return Swal.fire('Gagal', 'Data stok tidak ditemukan, coba pilih ulang gudangnya.', 'error');
      Swal.fire({
        title: 'Edit Stok: ' + s.ProductName,
        html: `
          <input id="swal-wh-qty" type="number" class="swal2-input" placeholder="Jumlah Stok Saat Ini" value="${s.Quantity}">
          <input id="swal-wh-min" type="number" class="swal2-input" placeholder="Ambang Batas Stok Menipis" value="${s.MinStock}">
          <p class="text-muted small mt-2">Gunakan ini untuk koreksi manual (mis. hasil stok opname), bukan untuk transfer/pemakaian rutin.</p>`,
        confirmButtonText: 'Simpan', showCancelButton: true, focusConfirm: false,
        preConfirm: () => ({ quantity: document.getElementById('swal-wh-qty').value, minStock: document.getElementById('swal-wh-min').value })
      }).then(result => {
        if (result.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            loadWarehouseDetail(currentWarehouseDetail);
          }).withFailureHandler(errHandler).setWarehouseStock(currentWarehouseDetail, s.ProductCode, result.value.quantity, result.value.minStock, sessionToken);
        }

    function deleteWarehouseStockRow(productCode) {
      Swal.fire({ title: 'Hapus pencatatan stok produk ini?', text: 'Produk tetap ada di Master Produk, hanya catatan stok di gudang ini yang dihapus.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            loadWarehouseDetail(currentWarehouseDetail);
          }).withFailureHandler(errHandler).deleteWarehouseStockRecord(currentWarehouseDetail, productCode, sessionToken);

      });

    function saveWarehouseUsage() {
      let productCode = $('#wh-usage-product').val();
      let qty = $('#wh-usage-qty').val();

      if (!productCode || !qty || qty <= 0) return Swal.fire('Perhatian', 'Pilih produk dan isi jumlah dengan benar.', 'warning');

    // Preset cepat panel Riwayat Transfer: 'today'/'month'/'year' mengisi
    // ulang input Dari/Sampai Tanggal lalu langsung memuat; 'all' mengosongkan
    // filter tanggal (tampilkan semua riwayat, maksimal 500 baris terbaru);
    // null dipakai tombol "Tampilkan" untuk memuat sesuai input yang sudah
    // diisi manual (dukung tanggal tunggal maupun rentang tanggal bebas).
    function setWarehouseTransferHistoryQuickRange(quick) {
      let today = todayStr();
      if (quick === 'today') {
        $('#wh-th-start').val(today); $('#wh-th-end').val(today);
      } else if (quick === 'month') {
        let d = new Date();
        let first = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
        $('#wh-th-start').val(first); $('#wh-th-end').val(today);
      } else if (quick === 'year') {
        let d = new Date();
        let first = new Date(d.getFullYear(), 0, 1).toISOString().slice(0, 10);
        $('#wh-th-start').val(first); $('#wh-th-end').val(today);
      } else if (quick === 'all') {
        $('#wh-th-start').val(''); $('#wh-th-end').val('');
      }
      $('.wh-th-quick').removeClass('active btn-primary').addClass('btn-outline-secondary');
      if (quick) $('.wh-th-quick[data-quick="' + quick + '"]').removeClass('btn-outline-secondary').addClass('active btn-primary');
      loadWarehouseTransferHistory();
    }

    function loadWarehouseTransferHistory() {
      let startDate = $('#wh-th-start').val() || '';
      let endDate = $('#wh-th-end').val() || '';
      $('#wh-th-table-wrap').html('<div class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat riwayat...</div>');
      google.script.run.withSuccessHandler(res => {
        if (!res) return $('#wh-th-table-wrap').html('<p class="text-danger small text-center mb-0">Tidak ada respon dari server, coba klik Refresh lagi.</p>');
        if (!res.success) return $('#wh-th-table-wrap').html('<p class="text-danger small text-center mb-0">Gagal memuat: ' + esc(res.message) + '</p>');
        let rows = res.history.map(h => `<tr>
            <td class="text-nowrap">${fmtDateTime(h.Timestamp)}</td>
            <td>${esc(h.FromWarehouseName)}</td>
            <td class="text-center"><i class="fa-solid fa-arrow-right text-muted"></i></td>
            <td>${esc(h.ToWarehouseName)}</td>
            <td>${esc(h.ProductName)}</td>
            <td class="text-center">${h.Qty}</td>
            <td>${esc(h.User)}</td>
          </tr>`).join('');
        let note = (res.totalMatching > res.history.length)
          ? `<p class="text-muted small mt-2 mb-0">Menampilkan ${res.history.length} dari ${res.totalMatching} transfer pada rentang ini (terbaru dulu) - persempit rentang tanggal untuk melihat semuanya.</p>` : '';
        $('#wh-th-table-wrap').html(`<table class="table table-striped table-sm w-100 mb-0">
            <thead><tr><th>Tanggal</th><th>Dari Gudang</th><th></th><th>Ke Gudang</th><th>Produk</th><th class="text-center">Qty</th><th>Oleh</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" class="text-center text-muted">Tidak ada riwayat transfer pada rentang tanggal ini</td></tr>'}</tbody>
          </table>${note}`);
      }).withFailureHandler(errHandler).getWarehouseTransferHistory(startDate, endDate, sessionToken);
    }

    function loadTransferProductOptions() {
      let fromId = $('#wh-transfer-from').val();
      if (!fromId) { $('#wh-transfer-product').html('<option value="">-- Pilih gudang asal dulu --</option>'); return; }
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        let options = res.stock.filter(s => Number(s.Quantity) > 0).map(s => `<option value="${esc(s.ProductCode)}" data-max="${s.Quantity}">${esc(s.ProductName)} (Stok: ${s.Quantity})</option>`).join('');
        $('#wh-transfer-product').html(options || '<option value="">-- Tidak ada stok tersedia di gudang ini --</option>');
      }).withFailureHandler(errHandler).getWarehouseStockDetail(fromId, sessionToken);
    }

    function submitWarehouseTransfer() {
      let fromId = $('#wh-transfer-from').val();
      let toId = $('#wh-transfer-to').val();
      let productCode = $('#wh-transfer-product').val();
      let qty = $('#wh-transfer-qty').val();
      if (!fromId || !toId) return Swal.fire('Perhatian', 'Pilih gudang asal dan tujuan.', 'warning');
      if (fromId === toId) return Swal.fire('Perhatian', 'Gudang asal dan tujuan tidak boleh sama.', 'warning');
      if (!productCode || !qty || qty <= 0) return Swal.fire('Perhatian', 'Pilih produk dan isi jumlah dengan benar.', 'warning');
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        $('#wh-transfer-qty').val('');
        loadTransferProductOptions();
        loadWarehouseTransferHistory();
      }).withFailureHandler(errHandler).transferStock(fromId, toId, productCode, qty, sessionToken);
    }

    // Ukuran kertas PDF Report Kasir per outlet - default 'landscape' (sama
    // seperti perilaku sebelumnya, karena Laporan Penjualan Kasir Loket
    // Masuk/Wahana punya banyak kolom mis. No. Seri Awal/Akhir). Bisa
    // diganti ke 'portrait' langsung dari halaman Report tiap outlet supaya
    // hemat kertas kalau kolomnya tidak terlalu banyak.
    let reportPdfOrientation = { Entrance: 'landscape', Ride: 'landscape', Resto: 'landscape' };



    // Cache & instance grafik pratinjau report kasir, per-unit (Entrance/
    // Ride/Resto) supaya tidak saling menimpa kalau user pindah-pindah menu.
    let reportPreviewData = {};
    let reportChartSales = {};
    let reportChartPayment = {};

    function buildSimpleTableHtml_(headers, rows, totalLabel, totalValue) {
      let thead = '<tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
      let tbody = rows.length
        ? rows.map(r => '<tr>' + r.map(c => `<td>${esc(c === null || c === undefined ? '' : String(c))}</td>`).join('') + '</tr>').join('')
        : `<tr><td colspan="${headers.length}" class="text-muted text-center">Tidak ada data</td></tr>`;
      let tfoot = (totalLabel && rows.length)
        ? `<tfoot><tr class="fw-bold border-top"><td colspan="${headers.length - 1}">${esc(totalLabel)}</td><td class="text-end">${totalValue}</td></tr></tfoot>` : '';
      return `<div class="table-responsive"><table class="table table-sm table-striped mb-1">
        <thead>${thead}</thead><tbody>${tbody}</tbody>${tfoot}
      </table></div>`;
    }

    // Ambil data report (sama seperti downloadReport) lalu tampilkan sebagai
    // pratinjau di layar (tabel Penjualan + Penerimaan Uang) beserta grafik
    // Penjualan (per Produk) & grafik Penerimaan Uang (per Metode Pembayaran)
    // - supaya Kasir bisa lihat dulu isinya SEBELUM export PDF/XLSX. cb
    // (opsional) dipanggil dengan hasil data-nya, dipakai downloadReport()
    // supaya export selalu memakai data & grafik yang sama dengan pratinjau.
    function loadReportPreview(unit, cb) {
      let date = $('#report-date-' + unit).val();
      let area = $('#report-preview-' + unit);
      if (!date) { if (area.length) area.html(''); if (cb) cb(null); return; }
      if (area.length) area.html('<div class="text-muted small py-3"><i class="fa-solid fa-spinner fa-spin me-1"></i>Memuat pratinjau laporan...</div>');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) { if (area.length) area.html('<div class="alert alert-danger small mb-0">' + esc(res.message) + '</div>'); if (cb) cb(res); return; }
        reportPreviewData[unit] = res;
        renderReportPreviewContent_(unit, res);
        if (cb) cb(res);
      }).withFailureHandler(function(err) {
        if (area.length) area.html('<div class="alert alert-danger small mb-0">Gagal memuat pratinjau laporan.</div>');
        errHandler(err);
        if (cb) cb({ success: false, message: 'Gagal memuat laporan' });
      }).getDailyReportData(unit, date, sessionToken);
    }

    function renderReportPreviewContent_(unit, res) {
      const salesHeaders = res.hasSerial

    // PERBAIKAN: Format teks WA khusus per outlet (Kasir Loket Masuk/Wahana/
    // Resto) - tombol "Salin Format WA" di submenu Report tiap outlet.
    // Bentuknya ringkas (beda dari buildFinanceWaText() yang isinya laporan
    // gabungan Admin Keuangan): cuma "Penjualan Per Kategori" (dari sheet
    // Sales, dikelompokkan per kolom Category) & "Penerimaan Kasir" per
    // metode pembayaran (dari sheet Payments). Logika pencocokan metode
    // pembayaran (Tunai/QRIS/Transfer/Debit/Credit) meniru
    // buildUnitPaymentMethodBreakdown_() di Code.gs supaya angkanya
    // konsisten dengan Report Admin Keuangan.
    function buildUnitReportWaText_(unit, res) {
      let catMap = {};
      (res.sales || []).forEach(r => {
        let k = r.Category || '-';
        catMap[k] = (catMap[k] || 0) + (Number(r.TotalPrice) || 0);
      });
      let catKeys = Object.keys(catMap);
      let catLines = catKeys.length
        ? catKeys.map(k => `● ${k} = ${catMap[k] ? Number(catMap[k]).toLocaleString('id-ID') : ''}`).join('\n')
        : '●';

      let pay = { tunai: 0, qris: 0, transfer: 0, debit: 0, credit: 0 };
      (res.payments || []).forEach(p => {
        let amt = Number(p.Amount) || 0;
        let method = (p.PaymentMethod || '').toLowerCase();
        if (method.includes('debit')) pay.debit += amt;
        else if (method.includes('kredit') || method.includes('credit')) pay.credit += amt;
        else if (method.includes('cash') || method.includes('tunai')) pay.tunai += amt;
        else if (method.includes('qris')) pay.qris += amt;
        else if (method.includes('transfer')) pay.transfer += amt;
      });
      let fmtN = v => v ? Number(v).toLocaleString('id-ID') : '';
      let total = pay.tunai + pay.qris + pay.transfer + pay.debit + pay.credit;

      // res.dateStr sudah dalam format "yyyy-MM-dd" (nilai <input type=date>),
      // diubah ke dd/mm/yyyy supaya sesuai format laporan WA yang biasa dipakai.
      let dParts = (res.dateStr || '').split('-');
      let tgl = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}/${dParts[0]}` : fmtDate(res.dateStr);

      let txt = '';
      txt += `*Laporan Penjualan : ${res.unitLabel}*\n`;
      txt += `*Tanggal : ${tgl}*\n`;
      txt += `*Nama Kasir : ${res.cashierName}*\n\n`;
      txt += `📊*Penjualan Per Kategori*\n`;
      txt += `${catLines}\n\n`;
      txt += `💰*Penerimaan Kasir*\n`;
      txt += `Tunai : ${fmtN(pay.tunai)}\n`;
      txt += `QRIS : ${fmtN(pay.qris)}\n`;
      txt += `Transfer : ${fmtN(pay.transfer)}\n`;
      txt += `Debit : ${fmtN(pay.debit)}\n`;
      txt += `Credit : ${fmtN(pay.credit)}\n`;
      txt += `*Total = ${Number(total).toLocaleString('id-ID')}*`;
      return txt;
    }

    function copyUnitReportWaText(unit) {
      let res = reportPreviewData[unit];
      if (!res || !res.success) return Swal.fire('Perhatian', 'Pratinjau laporan belum dimuat. Pilih tanggal terlebih dahulu.', 'warning');
      let txt = buildUnitReportWaText_(unit, res);
      navigator.clipboard.writeText(txt).then(function() {
        Toast.fire({ icon: 'success', title: 'Format WA disalin ke clipboard' });
      }).catch(function() {
        Swal.fire({ title: 'Salin Manual', html: '<textarea class="form-control" rows="14" onclick="this.select()">' + esc(txt) + '</textarea>', width: 600 });
      });
    }

    // PERBAIKAN: Versi "Per Item" dari Format WA - sama persis strukturnya
    // dengan buildUnitReportWaText_() (per Kategori), hanya saja baris
    // "📊 Penjualan Per Kategori" diganti rincian per Produk (ProductName),
    // dan hanya produk yang Qty penjualannya > 0 yang dimasukkan ke list
    // (produk tanpa transaksi hari itu tidak ditampilkan).
    function buildUnitReportWaTextPerItem_(unit, res) {
      let itemMap = {};
      (res.sales || []).forEach(r => {
        let k = r.ProductName || '-';
        if (!itemMap[k]) itemMap[k] = { qty: 0, total: 0 };
        itemMap[k].qty += (Number(r.Qty) || 0);
        itemMap[k].total += (Number(r.TotalPrice) || 0);
      });
      let itemKeys = Object.keys(itemMap).filter(k => itemMap[k].qty > 0);
      let itemLines = itemKeys.length
        ? itemKeys.map(k => `● ${k} = ${itemMap[k].total ? Number(itemMap[k].total).toLocaleString('id-ID') : ''}`).join('\n')
        : '●';

      let pay = { tunai: 0, qris: 0, transfer: 0, debit: 0, credit: 0 };
      (res.payments || []).forEach(p => {
        let amt = Number(p.Amount) || 0;
        let method = (p.PaymentMethod || '').toLowerCase();
        if (method.includes('debit')) pay.debit += amt;
        else if (method.includes('kredit') || method.includes('credit')) pay.credit += amt;
        else if (method.includes('cash') || method.includes('tunai')) pay.tunai += amt;
        else if (method.includes('qris')) pay.qris += amt;
        else if (method.includes('transfer')) pay.transfer += amt;
      });
      let fmtN = v => v ? Number(v).toLocaleString('id-ID') : '';
      let total = pay.tunai + pay.qris + pay.transfer + pay.debit + pay.credit;

      let dParts = (res.dateStr || '').split('-');
      let tgl = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}/${dParts[0]}` : fmtDate(res.dateStr);

      let txt = '';
      txt += `*Laporan Penjualan : ${res.unitLabel}*\n`;
      txt += `*Tanggal : ${tgl}*\n`;
      txt += `*Nama Kasir : ${res.cashierName}*\n\n`;
      txt += `📊*Penjualan Per Item*\n`;
      txt += `${itemLines}\n\n`;
      txt += `💰*Penerimaan Kasir*\n`;
      txt += `Tunai : ${fmtN(pay.tunai)}\n`;
      txt += `QRIS : ${fmtN(pay.qris)}\n`;
      txt += `Transfer : ${fmtN(pay.transfer)}\n`;
      txt += `Debit : ${fmtN(pay.debit)}\n`;
      txt += `Credit : ${fmtN(pay.credit)}\n`;
      txt += `*Total = ${Number(total).toLocaleString('id-ID')}*`;
      return txt;
    }

    function copyUnitReportWaTextPerItem(unit) {
      let res = reportPreviewData[unit];
      if (!res || !res.success) return Swal.fire('Perhatian', 'Pratinjau laporan belum dimuat. Pilih tanggal terlebih dahulu.', 'warning');
      let txt = buildUnitReportWaTextPerItem_(unit, res);

    function collectReportChartImages_(unit) {
      let defs = [
        { id: 'rep-chart-sales-' + unit, title: 'Grafik Penjualan (per Produk)' },
        { id: 'rep-chart-payment-' + unit, title: 'Grafik Penerimaan Uang (per Metode)' }

        let canvas = document.getElementById(d.id);

    function downloadReport(unit, format) {
      let date = $('#report-date-' + unit).val();
      if (!date) return Swal.fire('Perhatian', 'Pilih tanggal terlebih dahulu.', 'warning');
      Swal.fire({ title: 'Membuat laporan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      loadCompanySettings(function() {
        // Muat ulang pratinjau (memastikan tabel & grafik yang ada di layar
        // sesuai tanggal yang dipilih) sebelum grafik-nya "difoto" untuk
        // disisipkan ke PDF/XLSX.
        loadReportPreview(unit, async function(res) {
          if (!res || !res.success) { Swal.close(); return Swal.fire('Gagal', (res && res.message) || 'Gagal memuat data laporan', 'error'); }
          try {
            const salesHeaders = res.hasSerial
              ? ['Tanggal','Kode','Produk','Varian','Kategori','Qty','Satuan','No.Seri Awal','No.Seri Akhir','Total Tiket','Stok Awal','Stok Masuk','Stok Keluar','Stok Akhir','Harga Satuan','Total Harga','Nama Kasir']
              : ['Tanggal','Kode','Produk','Varian','Kategori','Qty','Satuan','Stok Awal','Stok Masuk','Stok Keluar','Stok Akhir','Harga Satuan','Total Harga','Nama Kasir'];
            // Harga satuan & total harga ditulis dalam format Rupiah (Rp) yang
            // jelas (mis. "Rp 60.000") sesuai permintaan, bukan angka mentah.
            const salesRows = (res.sales || []).map(r => res.hasSerial
              ? [r.Date, r.ProductCode, r.ProductName, r.Variant, r.Category, r.Qty, r.Unit, r.SerialStart, r.SerialEnd, r.TotalSerial, r.StockStart, r.StockIn, r.StockOut, r.StockEnd, fmtRp(r.UnitPrice), fmtRp(r.TotalPrice), r.Cashier]
              : [r.Date, r.ProductCode, r.ProductName, r.Variant, r.Category, r.Qty, r.Unit, r.StockStart, r.StockIn, r.StockOut, r.StockEnd, fmtRp(r.UnitPrice), fmtRp(r.TotalPrice), r.Cashier]);
            const payHeaders = ['Tanggal','Waktu','Metode Pembayaran','Jumlah Penerimaan','Referensi','Nama Kasir'];
            const payRows = (res.payments || []).map(p => [p.Date, p.Time, p.PaymentMethod, fmtRp(p.Amount), p.Reference, p.Cashier]);

            // Header report: logo, nama perusahaan, alamat, nama & posisi
            // kasir, tanggal laporan, serta tanggal/jam dicetak.
            const headerInfo = {
              cashierName: res.cashierName, cashierPosition: res.cashierPosition,
              reportDate: date, logoUrl: res.logoUrl
            };
            const chartImages = collectReportChartImages_(unit);

            if (format === 'pdf') {
              exportToPdf('Laporan_' + unit + '_' + date + '.pdf', res.unitLabel + ' - Laporan Harian', 'Tanggal Laporan: ' + fmtDate(date), [
                { heading: 'Laporan Penjualan', headers: salesHeaders, rows: salesRows, totalLabel: 'TOTAL PENJUALAN', totalValue: fmtRp(res.salesTotal) },
                { heading: 'Penerimaan Uang', headers: payHeaders, rows: payRows, totalLabel: 'TOTAL PENERIMAAN', totalValue: fmtRp(res.paymentTotal) }
              ], headerInfo, chartImages, reportPdfOrientation[unit]);
              Swal.close();
            } else {
              let salesTotalRow = new Array(salesHeaders.length).fill('');
              salesTotalRow[0] = 'TOTAL PENJUALAN'; salesTotalRow[salesHeaders.length - 2] = fmtRp(res.salesTotal);
              let payTotalRow = new Array(payHeaders.length).fill('');
              payTotalRow[0] = 'TOTAL PENERIMAAN'; payTotalRow[3] = fmtRp(res.paymentTotal);
              await exportMultiSheetXlsxWithCharts_('Laporan_' + unit + '_' + date + '.xlsx', [
                { name: 'Laporan Penjualan', headers: salesHeaders, rows: salesRows.concat([salesTotalRow]) },
                { name: 'Penerimaan Uang', headers: payHeaders, rows: payRows.concat([payTotalRow]) }
              ], chartImages);
              Swal.close();
            }
            Toast.fire({ icon: 'success', title: 'Laporan berhasil diunduh' });
          } catch (err) {
            Swal.close();
            Swal.fire('Gagal Membuat Laporan', 'Terjadi kesalahan: ' + err.message, 'error');
          }
        });
      });
    }
