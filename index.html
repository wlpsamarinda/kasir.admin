    function mapOutletLabelToKey(label) {
      // Mendukung banyak outlet sekaligus, dipisah koma di kolom Excel.
      // Contoh isi kolom: "Kasir Resto, Kasir Loket Wahana". Dicocokkan ke
      // master Applicable_Units (nama tampilan ATAU kode unit boleh
      // dipakai di file Excel), supaya unit baru (mis. "Gudang Teknisi")
      // juga bisa diimport, bukan cuma 4 unit lama yang dulu hardcode.
      if (!label) return 'General';
      let rev = {};
      applicableUnitsCache.forEach(u => {
        rev[String(u.UnitLabel || '').trim()] = u.UnitKey;
        rev[String(u.UnitKey || '').trim()] = u.UnitKey;
      });
      // Fallback kalau applicableUnitsCache belum sempat dimuat.
      if (!applicableUnitsCache.length) {
        rev = { 'Kasir Loket Masuk': 'Entrance', 'Kasir Loket Wahana': 'Ride', 'Kasir Resto': 'Resto', 'Semua Outlet': 'General',
          'Entrance': 'Entrance', 'Ride': 'Ride', 'Resto': 'Resto', 'General': 'General' };
      }
      let parts = String(label).split(',').map(s => s.trim()).filter(Boolean);
      let keys = parts.map(p => rev[p] || 'General');
      keys = [...new Set(keys)];
      return keys.length ? keys.join(',') : 'General';
    }

    function downloadProductTemplate() {
      let wsData = [
        ["Kode Barang", "Nama Produk", "Varian", "Kategori", "Satuan", "Harga Beli", "Harga Jual", "Outlet Penjualan", "Status", "Pakai Stok", "Pakai Nomor Seri", "Stok Awal", "Kode Barang Acuan Stok"],
        ["PRD100", "Contoh Tiket Masuk VIP", "-", "Tiket Masuk", "Tiket", 30000, 50000, "Kasir Loket Masuk", "Active", "Ya", "Ya", 100, ""],
        ["PRD101", "Contoh Es Teh (dijual di Resto & Loket Wahana)", "-", "Makanan & Minuman", "Cup", 4000, 10000, "Kasir Resto, Kasir Loket Wahana", "Active", "Ya", "Tidak", 100, ""],
        ["PRD102", "Contoh Jasa Sewa Loker (tanpa stok fisik)", "-", "Lainnya", "Pcs", 0, 5000, "Kasir Loket Masuk", "Active", "Tidak", "Tidak", 0, ""],
        ["PRD103", "Contoh Tiket Masuk VIP Diskon 20% (stok ikut PRD100)", "-", "Tiket Masuk", "Tiket", 30000, 40000, "Kasir Loket Masuk", "Active", "Ya", "Ya", 0, "PRD100"]
      ];
      let ws = XLSX.utils.aoa_to_sheet(wsData);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template Produk");
      XLSX.writeFile(wb, "Template_Import_Produk.xlsx");
    }

    function handleProductImport(event) {
      let file = event.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(e) {
        try {
          let data = new Uint8Array(e.target.result);
          let workbook = XLSX.read(data, { type: 'array' });
          let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          let rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          if (!rows.length) { Swal.fire('Perhatian', 'File kosong atau format tidak sesuai template.', 'warning'); return; }

          let mapped = rows.map(r => ({
            productCode: String(r['Kode Barang'] || '').trim(),
            productName: String(r['Nama Produk'] || '').trim(),
            variant: String(r['Varian'] || '-').trim(),
            category: String(r['Kategori'] || '-').trim(),
            unit: String(r['Satuan'] || 'Pcs').trim(),
            buyPrice: r['Harga Beli'] || 0,
            sellPrice: r['Harga Jual'] || 0,
            applicableUnit: mapOutletLabelToKey(r['Outlet Penjualan']),
            status: String(r['Status'] || 'Active').trim(),
            usesStock: String(r['Pakai Stok'] || 'Ya').trim() === 'Tidak' ? 'Tidak' : 'Ya',
            usesSerial: String(r['Pakai Nomor Seri'] || 'Ya').trim() === 'Tidak' ? 'Tidak' : 'Ya',
            initialStock: r['Stok Awal'] || 0,
            stockRefCode: String(r['Kode Barang Acuan Stok'] || '').trim()
          })).filter(p => p.productCode && p.productName);

          if (!mapped.length) { Swal.fire('Perhatian', 'Tidak ada baris valid (pastikan kolom Kode Barang & Nama Produk terisi).', 'warning'); return; }

          Swal.fire({
            title: 'Konfirmasi Import',
            text: `Ditemukan ${mapped.length} baris produk. Lanjutkan import ke sistem?`,
            icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Import'
          }).then(r => {
            if (!r.isConfirmed) return;
            Swal.fire({ title: 'Mengimpor data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run.withSuccessHandler(res => {
              Swal.close();
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              let msg = `Berhasil: ${res.inserted} produk baru, ${res.updated} produk diperbarui.`;
              if (res.errors.length) msg += ` ${res.errors.length} baris dilewati.`;
              Swal.fire('Import Selesai', msg, 'success');
              fetchProductsTable();
            }).withFailureHandler(errHandler).bulkImportProducts(mapped, sessionToken);
          });
        } catch (err) {
          Swal.fire('Gagal', 'File tidak dapat dibaca: ' + err.message, 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

        $('#ptype-tbody').html(tbody || '<tr><td colspan="3" class="text-center text-muted">Belum ada tipe produk</td></tr>');
        if ($.fn.DataTable.isDataTable('#ptype-table')) $('#ptype-table').DataTable().destroy();
        $('#ptype-table').DataTable({ pageLength: 8 });
      }).withFailureHandler(errHandler).getProductTypes();
    }

    function editProductTypeRow(id) {
      let t = productTypesCache.find(x => x.TypeID === id);
      if (!t) return Swal.fire('Gagal', 'Data tipe produk tidak ditemukan, coba Refresh Data.', 'error');

          <input id="swal-ptname" class="swal2-input" placeholder="Nama Tipe (mis. Konsumsi)" value="${isEdit?t.TypeName:''}">
          <select id="swal-ptstatus" class="swal2-select">

          status: document.getElementById('swal-ptstatus').value
        })

    function deleteProductType(id) {

    // ---------- Unit / Outlet Berlaku (ApplicableUnit) - master data untuk
    // checkbox "Outlet Penjualan" di Master Produk & dropdown "Outlet
    // Berlaku" di Kategori Produk. Menambah unit baru di sini (mis.
    // Teknisi/Kolam/Dapur/Cleaning) membuatnya langsung tersedia sebagai
    // pilihan Outlet Penjualan, dan Gudang unit tsb otomatis hanya
    // menampilkan produk yang ditugaskan ke unit itu (lihat backend
    // getWarehouseStockDetail/WAREHOUSE_APPLICABLE_UNIT_). ----------
    function fetchApplicableUnitTable() {
      google.script.run.withSuccessHandler(function(units) {
        applicableUnitsCache = units;
        let tbody = '';
        units.forEach(u => {
          let isGeneral = u.UnitKey === 'General';
          tbody += `<tr><td>${esc(u.UnitKey)}</td><td>${esc(u.UnitLabel)}</td>
            <td><span class="badge ${u.Status==='Active'?'bg-success':'bg-secondary'}">${esc(u.Status)}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editApplicableUnitRow('${esc(u.UnitID)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" ${isGeneral?'disabled title="Unit General tidak boleh dihapus"':''} onclick="deleteApplicableUnit('${esc(u.UnitID)}')"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        });
        $('#apunit-tbody').html(tbody || '<tr><td colspan="4" class="text-center text-muted">Belum ada unit</td></tr>');
        if ($.fn.DataTable.isDataTable('#apunit-table')) $('#apunit-table').DataTable().destroy();
        $('#apunit-table').DataTable({ pageLength: 8 });
      }).withFailureHandler(errHandler).getApplicableUnits();
    }

    function editApplicableUnitRow(id) {
      let u = applicableUnitsCache.find(x => x.UnitID === id);
      if (!u) return Swal.fire('Gagal', 'Data unit tidak ditemukan, coba Refresh Data.', 'error');
      openApplicableUnitModal(u);

    function openApplicableUnitModal(u) {

      Swal.fire({
        title: isEdit ? 'Edit Unit' : 'Tambah Unit Baru',
        html: `
          <input id="swal-apukey" class="swal2-input" placeholder="Kode Unit (mis. Teknisi, tanpa spasi/koma)" value="${isEdit?u.UnitKey:''}" ${isGeneral?'disabled':''}>
          <input id="swal-apulabel" class="swal2-input" placeholder="Nama Tampilan (mis. Gudang Teknisi)" value="${isEdit?u.UnitLabel:''}">
          <select id="swal-apustatus" class="swal2-select">
            <option value="Active" ${!isEdit||u.Status==='Active'?'selected':''}>Active</option>
            <option value="Inactive" ${isEdit&&u.Status==='Inactive'?'selected':''}>Inactive</option>
          </select>
          <div class="form-text text-start">Kode Unit dipakai sebagai nilai internal (harus unik, tanpa spasi/koma) - inilah yang akan tampil sebagai pilihan checkbox "Outlet Penjualan" di Master Produk.</div>`,
        confirmButtonText: 'Simpan', showCancelButton: true, focusConfirm: false,
        preConfirm: () => ({
          isEdit: isEdit, unitId: isEdit ? u.UnitID : null,
          unitKey: isGeneral ? 'General' : document.getElementById('swal-apukey').value.trim(),
          unitLabel: document.getElementById('swal-apulabel').value.trim(),
          status: document.getElementById('swal-apustatus').value
        })
      }).then((result) => {
        if (result.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            fetchApplicableUnitTable();
          }).withFailureHandler(errHandler).saveApplicableUnit(result.value, sessionToken);
        }
      });
    }

    function deleteApplicableUnit(id) {
      Swal.fire({ title: 'Hapus unit ini?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            fetchApplicableUnitTable();
          }).withFailureHandler(errHandler).deleteApplicableUnit(id, sessionToken);
        }
      });
    }

    // ================= LAPORAN PENJUALAN (per unit) =================
    // Sub-tab "Kasir" menampilkan grid produk ala mesin POS + keranjang,
    // supaya kasir tinggal tap produk (bukan cari lewat modal) untuk input
    // penjualan lebih cepat. Sub-tab "Riwayat & Laporan" tetap tabel lama
    // (edit/hapus transaksi & export) - lihat fetchSalesTable/openSalesModal.
    function renderSalesView(area, unit) {
      const hasSerial = HAS_SERIAL[unit];
      area.html(`
        <h2 class="fw-bold mb-1">${UNIT_LABEL[unit]}</h2>
        <p class="text-muted mb-3">Laporan Penjualan</p>
        <ul class="nav nav-pills mb-3" id="sales-subtab-${unit}">
          <li class="nav-item"><a class="nav-link active" id="sales-tab-pos-${unit}" onclick="switchSalesSubtab('${unit}','pos')"><i class="fa-solid fa-cash-register me-2"></i>Kasir</a></li>
          <li class="nav-item"><a class="nav-link" id="sales-tab-history-${unit}" onclick="switchSalesSubtab('${unit}','history')"><i class="fa-solid fa-clock-rotate-left me-2"></i>Riwayat &amp; Laporan</a></li>
        </ul>

        <div id="sales-pos-panel-${unit}">
          <div class="row g-3">
            <div class="col-lg-8">
              <div class="card p-3 shadow-sm h-100">
                <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                  <div class="input-group" style="max-width:320px;">
                    <span class="input-group-text bg-transparent"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control" id="pos-search-${unit}" placeholder="Cari produk...">
                  </div>
                  <button class="btn btn-outline-primary btn-sm ms-auto" onclick="loadPosData('${unit}')"><i class="fa-solid fa-rotate me-1"></i>Refresh Produk</button>
                </div>
                <div class="d-flex flex-wrap gap-2 mb-3" id="pos-category-tabs-${unit}"></div>
                <div id="pos-product-grid-${unit}" class="pos-product-grid"><div class="text-muted small">Memuat produk...</div></div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card p-3 shadow-sm pos-cart-card">
                <h5 class="mb-3"><i class="fa-solid fa-cart-shopping me-2"></i>Keranjang</h5>
                <div id="pos-cart-list-${unit}" class="pos-cart-list"></div>
                <div id="pos-cart-empty-${unit}" class="text-muted small text-center py-4">Keranjang kosong. Tap produk di sebelah kiri untuk mulai input.</div>
                <hr>
                <div id="pos-cart-payment-wrap-${unit}"></div>
                <input id="pos-cart-notes-${unit}" class="form-control form-control-sm mb-2" placeholder="Catatan (opsional, berlaku untuk semua item)">
                <div class="d-flex justify-content-between align-items-center fw-bold mb-3">
                  <span>Total</span><span id="pos-cart-total-${unit}">Rp 0</span>
                </div>
                <button class="btn btn-success w-100 mb-2" id="pos-checkout-btn-${unit}" onclick="checkoutPosCart('${unit}')" disabled><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Semua Transaksi</button>
                <button class="btn btn-outline-danger w-100 btn-sm" onclick="clearPosCart('${unit}')"><i class="fa-solid fa-trash me-2"></i>Kosongkan Keranjang</button>
              </div>
            </div>
          </div>
        </div>

        <div id="sales-history-panel-${unit}" style="display:none;">
          <div class="card p-4 shadow-sm">
            <div class="d-flex flex-wrap gap-2 mb-3">
              <button class="btn btn-primary" onclick="openSalesModal('${unit}')"><i class="fa-solid fa-plus me-2"></i>Input Manual</button>
              <button class="btn btn-outline-primary" onclick="fetchSalesTable('${unit}')"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
              <button class="btn btn-outline-danger ms-auto" onclick="exportTable('sales','pdf','${unit}')"><i class="fa-solid fa-file-pdf me-2"></i>Export PDF</button>
              <button class="btn btn-outline-success" onclick="exportTable('sales','xlsx','${unit}')"><i class="fa-solid fa-file-excel me-2"></i>Export XLSX</button>
            </div>
            <div class="table-responsive"><table class="table table-striped w-100" id="sales-table-${unit}">
              <thead><tr>
                <th>ID</th><th>Tanggal</th><th>Kode</th><th>Produk</th><th>Varian</th><th>Kategori</th><th>Qty</th><th>Satuan</th>
                ${hasSerial ? '<th>No.Seri Awal</th><th>No.Seri Akhir</th><th>Total Tiket</th>' : ''}
                <th>Stok Awal</th><th>Stok Masuk</th><th>Stok Keluar</th><th>Stok Akhir</th><th>Harga Satuan</th><th>Total Harga</th><th>Kasir</th><th>Aksi</th>
              </tr></thead><tbody id="sales-tbody-${unit}"></tbody>
            </table></div>
          </div>
        </div>`);
      fetchSalesTable(unit);
      loadPosData(unit);
    }

    function switchSalesSubtab(unit, tab) {
      let tabPos = document.getElementById('sales-tab-pos-' + unit);
      let tabHist = document.getElementById('sales-tab-history-' + unit);
      let panelPos = document.getElementById('sales-pos-panel-' + unit);
      let panelHist = document.getElementById('sales-history-panel-' + unit);
      if (!tabPos || !tabHist || !panelPos || !panelHist) return;
      tabPos.classList.toggle('active', tab === 'pos');
      tabHist.classList.toggle('active', tab === 'history');
      panelPos.style.display = tab === 'pos' ? '' : 'none';
      panelHist.style.display = tab === 'history' ? '' : 'none';
    }

    // Promise wrapper tipis untuk google.script.run, dipakai checkoutPosCart
    // supaya bisa menyimpan tiap item keranjang satu-per-satu secara
    // berurutan (await) - penting karena tiap saveSalesTransaction membaca
    // stok TERKINI dari server, jadi urutan simpan berpengaruh kalau ada
    // produk yang sama muncul lebih dari satu baris di keranjang.
    function gsRun(fnName) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName].apply(null, args);
      });
    }

    // state per unit: { products, sfCfg, showPayment, methods, activeCategory, searchTerm }
    let posState = {};
    // keranjang per unit (belum tersimpan ke server sampai "Simpan Semua Transaksi")
    let posCart = {};

    function loadPosData(unit) {
      google.script.run.withSuccessHandler(function(products) {
        loadCompanySettings(function() {
          const showPayment = companySettings.SHOW_PAYMENT_METHOD_IN_SALES === 'Yes';
          google.script.run.withSuccessHandler(function(cfgRes) {
            if (!cfgRes.success) return Swal.fire('Gagal', cfgRes.message, 'error');
            function afterMethods(methods) {
              posState[unit] = {
                products: products, sfCfg: cfgRes.config, showPayment: showPayment,
                methods: methods || [],
                activeCategory: (posState[unit] && posState[unit].activeCategory) || 'Semua',
                searchTerm: (posState[unit] && posState[unit].searchTerm) || ''
              };
              if (!posCart[unit]) posCart[unit] = [];
              renderPosCategoryTabs(unit);
              renderPosProductGrid(unit);
              renderPosCartPanel(unit);
              let searchEl = document.getElementById('pos-search-' + unit);
              if (searchEl) {
                searchEl.value = posState[unit].searchTerm;
                searchEl.oninput = function() {
                  posState[unit].searchTerm = this.value.trim().toLowerCase();
                  renderPosProductGrid(unit);
                };
              }
            }
            if (showPayment) {
              google.script.run.withSuccessHandler(function(methods) {
                afterMethods(methods.filter(m => m.Status === 'Active'));
              }).withFailureHandler(errHandler).getPaymentMethods();
            } else {
              afterMethods([]);
            }
          }).withFailureHandler(errHandler).getSalesFormConfig(unit);
        });
      }).withFailureHandler(errHandler).getProducts(unit);
    }

    function renderPosCategoryTabs(unit) {
      const st = posState[unit]; if (!st) return;
      const wrap = document.getElementById('pos-category-tabs-' + unit);
      if (!wrap) return;
      let cats = Array.from(new Set(st.products.map(p => p.Category || 'Lainnya'))).sort();
      let all = ['Semua'].concat(cats);
      wrap.innerHTML = all.map(function(c) {
        return `<button type="button" class="btn btn-sm pos-cat-btn ${st.activeCategory === c ? 'btn-primary' : 'btn-outline-secondary'}" data-cat="${esc(c)}">${esc(c)}</button>`;
      }).join('');
      wrap.querySelectorAll('.pos-cat-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          posState[unit].activeCategory = btn.dataset.cat;
          renderPosCategoryTabs(unit);
          renderPosProductGrid(unit);
        });
      });
    }

    function renderPosProductGrid(unit) {
      const st = posState[unit]; if (!st) return;
      const grid = document.getElementById('pos-product-grid-' + unit);
      if (!grid) return;
      let list = st.products;
      if (st.activeCategory !== 'Semua') list = list.filter(p => (p.Category || 'Lainnya') === st.activeCategory);
      if (st.searchTerm) {
        let q = st.searchTerm;
        list = list.filter(p => (p.ProductName + ' ' + p.Variant + ' ' + p.Category).toLowerCase().includes(q));
      }
      if (!list.length) { grid.innerHTML = '<div class="text-muted small py-4 text-center w-100">Tidak ada produk ditemukan.</div>'; return; }
      grid.innerHTML = list.map(function(p) {
        return `<div class="pos-product-card" data-code="${esc(p.ProductCode)}">
          <div class="pos-product-name">${esc(p.ProductName)}</div>
          ${p.Variant && p.Variant !== '-' ? `<div class="pos-product-variant">${esc(p.Variant)}</div>` : ''}
          <div class="pos-product-category">${esc(p.Category || '')}</div>
          <div class="pos-product-price">${fmtRp(p.SellPrice)}</div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.pos-product-card').forEach(function(card) {
        card.addEventListener('click', function() { handlePosProductTap(unit, card.dataset.code); });
      });
    }

    // Produk yang butuh Nomor Seri (tiket Loket Masuk/Wahana) atau punya
    // field Stok yang ditampilkan/bisa-diedit lewat Pengaturan Form Input
    // Penjualan tetap dibukakan modal ringkas (Qty + field terkait) karena
    // nilainya perlu diisi manual per baris. Produk lain (kebanyakan F&B)
    // langsung nambah ke keranjang begitu di-tap - persis seperti mesin
    // kasir POS pada umumnya, tap lagi produk yang sama tinggal menambah qty.
    function handlePosProductTap(unit, code) {
      const st = posState[unit]; if (!st) return;
      const p = st.products.find(pp => pp.ProductCode === code);
      if (!p) return;
      const usesStock = String(p.UsesStock || 'Ya').trim() !== 'Tidak';
      const usesSerial = usesStock && HAS_SERIAL[unit] && String(p.UsesSerial || 'Ya').trim() !== 'Tidak';
      const stockFieldsShown = usesStock && SALES_FORM_STOCK_KEYS.some(k => st.sfCfg[k] && st.sfCfg[k].show);
      if (usesSerial || stockFieldsShown) {
        openPosDetailModal(unit, p);
      } else {
        quickAddToCart(unit, p, 1);
      }
    }

    function quickAddToCart(unit, p, qtyToAdd) {
      if (!posCart[unit]) posCart[unit] = [];
      const cart = posCart[unit];
      const hargaFleksibel = String(p.HargaFleksibel || 'Tidak').trim() === 'Ya';
      let existing = cart.find(function(l) { return l.productCode === p.ProductCode && !l.hasCustomDetail; });
      if (existing) {
        existing.qty = Number(existing.qty) + qtyToAdd;
        existing.totalPrice = existing.qty * existing.unitPrice;
      } else {
        cart.push({
          tempId: 'c' + Date.now() + Math.random().toString(36).slice(2, 7),
          productCode: p.ProductCode, productName: p.ProductName, variant: p.Variant, category: p.Category,
          unit: p.Unit, unitPrice: Number(p.SellPrice), qty: qtyToAdd, totalPrice: qtyToAdd * Number(p.SellPrice),
          hargaFleksibel: hargaFleksibel, serialStart: null, serialEnd: null,
          stockStartManual: null, stockInManual: null, stockOutManual: null, stockEndManual: null,
          hasCustomDetail: false
        });
      }
      renderPosCartPanel(unit);
    }

    // Modal ringkas untuk produk yang butuh Nomor Seri/Stok manual - dipakai
    // dari grid POS. Beda dengan openSalesModal (dipakai untuk Edit baris
    // Riwayat): modal ini TIDAK langsung simpan ke server, hasilnya cuma
    // ditambahkan sebagai satu baris baru ke keranjang (posCart).
    function openPosDetailModal(unit, p) {
      const st = posState[unit];
      const sfCfg = st.sfCfg;
      const usesStock = String(p.UsesStock || 'Ya').trim() !== 'Tidak';
      const usesSerial = usesStock && HAS_SERIAL[unit] && String(p.UsesSerial || 'Ya').trim() !== 'Tidak';
      const hargaFleksibel = String(p.HargaFleksibel || 'Tidak').trim() === 'Ya';

      function stockFieldHtml(key) {
        let f = sfCfg[key];
        if (!f || !f.show || !usesStock) return '';
        let locked = !f.editable;
        return `<div class="text-start mb-2">
          <label class="form-label small fw-bold mb-1">${SALES_FORM_FIELD_LABELS[key]} ${locked ? '<i class="fa-solid fa-lock ms-1 text-muted"></i>' : ''}</label>
          <input id="pos-${key.toLowerCase()}" type="number" class="swal2-input m-0" style="width:100%" value="" ${locked ? 'disabled' : ''}>
        </div>`;
      }
      function serialFieldHtml(key, idSuffix) {
        let f = sfCfg[key];
        if (!f || !f.show || !usesSerial) return '';
        let locked = !f.editable;
        return `<div class="text-start mb-2">
          <label class="form-label small fw-bold mb-1">${SALES_FORM_FIELD_LABELS[key]} ${locked ? '<i class="fa-solid fa-lock ms-1 text-muted"></i>' : ''}</label>
          <input id="pos-serial-${idSuffix}" class="swal2-input m-0" style="width:100%" ${locked ? 'disabled' : ''}>
        </div>`;
      }

      Swal.fire({
        title: p.ProductName + (p.Variant && p.Variant !== '-' ? ' (' + p.Variant + ')' : ''),
        width: 480,
        html: `
          <div class="text-start mb-2"><span class="badge bg-secondary">${esc(p.Category || '')}</span> <span class="text-muted small">${fmtRp(p.SellPrice)} / ${esc(p.Unit || '')}</span></div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold mb-1">Qty</label>
            <input id="pos-qty" type="number" min="1" class="swal2-input m-0" style="width:100%" value="1">
          </div>
          ${serialFieldHtml('SerialStart', 'start')}
          ${serialFieldHtml('SerialEnd', 'end')}
          ${stockFieldHtml('StockStart')}
          ${stockFieldHtml('StockIn')}
          ${stockFieldHtml('StockOut')}
          ${stockFieldHtml('StockEnd')}
          <div class="text-start mb-2">
            <label class="form-label small fw-bold mb-1">Total Harga</label>
            <input id="pos-total" type="number" min="0" class="swal2-input m-0" style="width:100%" value="${Number(p.SellPrice)}">
          </div>`,
        confirmButtonText: 'Tambah ke Keranjang', showCancelButton: true, focusConfirm: false,
        didOpen: () => {
          const qtyInput = document.getElementById('pos-qty');
          const totalInput = document.getElementById('pos-total');
          totalInput.disabled = !hargaFleksibel;
          totalInput.classList.toggle('bg-light', !hargaFleksibel);

          function recalcTotal() {
            if (hargaFleksibel) return;
            let qty = Number(qtyInput.value) || 0;
            totalInput.value = qty * Number(p.SellPrice);
          }
          function recalcStock() {
            if (!usesStock) return;
            if (!SALES_FORM_STOCK_KEYS.some(k => sfCfg[k] && sfCfg[k].show)) return;
            let qty = Number(qtyInput.value) || 0;
            google.script.run.withSuccessHandler(function(res) {
              if (!res.success) return;
              let stockStartAuto = res.stock, stockInAuto = 0, stockOutAuto = qty;
              let stockEndAuto = stockStartAuto + stockInAuto - stockOutAuto;
              function setVal(id, v) { let el = document.getElementById(id); if (el) el.value = v; }
              setVal('pos-stockstart', stockStartAuto);
              setVal('pos-stockin', stockInAuto);
              setVal('pos-stockout', stockOutAuto);
              setVal('pos-stockend', stockEndAuto);
            }).withFailureHandler(function() {}).getProductStock(unit, p.ProductCode, sessionToken);
          }
          qtyInput.addEventListener('input', () => { recalcTotal(); recalcStock(); });
          recalcStock();
        },
        preConfirm: () => {
          let qty = document.getElementById('pos-qty').value;
          if (!qty || Number(qty) <= 0) { Swal.showValidationMessage('Isi jumlah (qty) dengan benar'); return false; }
          let totalVal = document.getElementById('pos-total').value;
          if (totalVal === '' || isNaN(Number(totalVal)) || Number(totalVal) < 0) { Swal.showValidationMessage('Isi Total Harga dengan benar'); return false; }
          function readVal(id) { let el = document.getElementById(id); return el ? el.value : null; }
          return {
            qty: qty, totalPrice: Number(totalVal),
            stockStartManual: usesStock ? readVal('pos-stockstart') : null,
            stockInManual: usesStock ? readVal('pos-stockin') : null,
            stockOutManual: usesStock ? readVal('pos-stockout') : null,
            stockEndManual: usesStock ? readVal('pos-stockend') : null,
            serialStart: usesSerial ? readVal('pos-serial-start') : null,
            serialEnd: usesSerial ? readVal('pos-serial-end') : null
          };
        }
      }).then((result) => {
        if (!result.isConfirmed) return;
        const v = result.value;
        if (!posCart[unit]) posCart[unit] = [];
        posCart[unit].push({
          tempId: 'c' + Date.now() + Math.random().toString(36).slice(2, 7),
          productCode: p.ProductCode, productName: p.ProductName, variant: p.Variant, category: p.Category,
          unit: p.Unit, unitPrice: Number(p.SellPrice), qty: v.qty, totalPrice: v.totalPrice,
          hargaFleksibel: hargaFleksibel, serialStart: v.serialStart, serialEnd: v.serialEnd,
          stockStartManual: v.stockStartManual, stockInManual: v.stockInManual,
          stockOutManual: v.stockOutManual, stockEndManual: v.stockEndManual,
          hasCustomDetail: true
        });
        renderPosCartPanel(unit);
      });
    }

    function renderPosCartPanel(unit) {
      const st = posState[unit]; if (!st) return;
      const cart = posCart[unit] || [];
      const listEl = document.getElementById('pos-cart-list-' + unit);
      const emptyEl = document.getElementById('pos-cart-empty-' + unit);
      const totalEl = document.getElementById('pos-cart-total-' + unit);
      const payWrap = document.getElementById('pos-cart-payment-wrap-' + unit);
      const checkoutBtn = document.getElementById('pos-checkout-btn-' + unit);
      if (!listEl || !emptyEl || !totalEl || !checkoutBtn) return;

      if (payWrap) {
        if (st.showPayment && !payWrap.dataset.rendered) {
          let opts = st.methods.map(m => `<option value="${esc(m.MethodName)}">${esc(m.MethodName)}</option>`).join('');
          payWrap.innerHTML = `<label class="form-label small fw-bold mb-1">Metode Pembayaran</label>
            <select id="pos-cart-payment-${unit}" class="form-select form-select-sm mb-2">${opts}</select>`;
          payWrap.dataset.rendered = '1';
        } else if (!st.showPayment) {
          payWrap.innerHTML = ''; payWrap.dataset.rendered = '';
        }
      }

      if (!cart.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = '';
        totalEl.textContent = fmtRp(0);
        checkoutBtn.disabled = true;
        return;
      }
      emptyEl.style.display = 'none';
      checkoutBtn.disabled = false;

      let total = 0;
      listEl.innerHTML = cart.map(function(l) {
        total += Number(l.totalPrice) || 0;
        let detail = l.qty + ' x ' + fmtRp(l.unitPrice);
        if (l.serialStart) detail += ' &middot; Seri ' + esc(l.serialStart) + (l.serialEnd ? '-' + esc(l.serialEnd) : '');
        return `<div class="pos-cart-item" data-tempid="${l.tempId}">
          <div class="pos-cart-item-main">
            <div class="fw-bold small">${esc(l.productName)}${l.variant && l.variant !== '-' ? ' (' + esc(l.variant) + ')' : ''}</div>
            <div class="text-muted small">${detail}</div>
          </div>
          <div class="text-end flex-shrink-0">
            <div class="fw-bold small">${fmtRp(l.totalPrice)}</div>
            <button type="button" class="btn btn-sm btn-link text-danger p-0 pos-cart-remove" data-tempid="${l.tempId}"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;
      }).join('');
      totalEl.textContent = fmtRp(total);

      listEl.querySelectorAll('.pos-cart-remove').forEach(function(btn) {
        btn.addEventListener('click', function() { removeFromPosCart(unit, btn.dataset.tempid); });
      });
    }

    function removeFromPosCart(unit, tempId) {
      posCart[unit] = (posCart[unit] || []).filter(l => l.tempId !== tempId);
      renderPosCartPanel(unit);
    }

    function clearPosCart(unit) {
      if (!(posCart[unit] || []).length) return;
      Swal.fire({ title: 'Kosongkan keranjang?', text: 'Semua item yang belum disimpan akan hilang.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Kosongkan' }).then(r => {
        if (r.isConfirmed) { posCart[unit] = []; renderPosCartPanel(unit); }
      });
    }

    // Simpan seluruh baris keranjang satu-per-satu ke saveSalesTransaction
    // (backend TIDAK diubah - tiap panggilan tetap 1 transaksi/1 baris,
    // sama seperti alur lama). Kalau ada yang gagal di tengah jalan, baris
    // yang sudah berhasil dihapus dari keranjang & sisanya tetap ada supaya
    // kasir tinggal menekan Simpan lagi untuk mencoba ulang sisanya.
    async function checkoutPosCart(unit) {
      const cart = posCart[unit] || [];
      if (!cart.length) return;
      const st = posState[unit];
      const payEl = document.getElementById('pos-cart-payment-' + unit);
      const paymentMethod = st.showPayment && payEl ? payEl.value : null;
      if (st.showPayment && !paymentMethod) { return Swal.fire('Gagal', 'Pilih metode pembayaran terlebih dahulu.', 'error'); }
      const notesEl = document.getElementById('pos-cart-notes-' + unit);
      const notes = notesEl ? notesEl.value : '';

      const btn = document.getElementById('pos-checkout-btn-' + unit);
      const originalBtnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';

      let savedCount = 0;
      const remaining = cart.slice();
      try {
        while (remaining.length) {
          const line = remaining[0];
          const payload = {
            isEdit: false, saleId: null,
            productCode: line.productCode, productName: line.productName, variant: line.variant,
            category: line.category, unit: line.unit, unitPrice: line.unitPrice,
            totalPrice: line.totalPrice, qty: line.qty,
            serialStart: line.serialStart, serialEnd: line.serialEnd,
            stockStartManual: line.stockStartManual, stockInManual: line.stockInManual,
            stockOutManual: line.stockOutManual, stockEndManual: line.stockEndManual,
            paymentMethod: paymentMethod, notes: notes
          };
          const res = await gsRun('saveSalesTransaction', unit, payload, sessionToken);
          if (!res.success) {
            posCart[unit] = remaining;
            renderPosCartPanel(unit);
            fetchSalesTable(unit);
            btn.disabled = false; btn.innerHTML = originalBtnHtml;
            return Swal.fire('Sebagian Gagal Disimpan', (savedCount ? savedCount + ' transaksi berhasil disimpan sebelumnya. ' : '') + 'Gagal menyimpan "' + line.productName + '": ' + res.message, 'error');
          }
          savedCount++;
          remaining.shift();
        }
        posCart[unit] = [];
        renderPosCartPanel(unit);
        Toast.fire({ icon: 'success', title: savedCount + ' transaksi berhasil disimpan.' });
        fetchSalesTable(unit);
      } catch (e) {
        posCart[unit] = remaining;
        renderPosCartPanel(unit);
        Swal.fire('Gagal', 'Terjadi kesalahan: ' + (e && e.message ? e.message : e), 'error');
      } finally {
        btn.disabled = (posCart[unit] || []).length === 0;
        btn.innerHTML = originalBtnHtml;
      }
    }

    let salesCache = {};
    function fetchSalesTable(unit) {
      const hasSerial = HAS_SERIAL[unit];
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        salesCache[unit] = res.data;
        let tbody = '';
        res.data.forEach(r => {
          tbody += `<tr>
            <td>${esc(r.SaleID)}</td><td>${fmtDate(r.Date)}</td><td>${esc(r.ProductCode)}</td><td>${esc(r.ProductName)}</td><td>${esc(r.Variant)}</td><td>${esc(r.Category)}</td><td>${esc(r.Qty)}</td><td>${esc(r.Unit)}</td>
            ${hasSerial ? `<td>${esc(r.SerialStart)}</td><td>${esc(r.SerialEnd)}</td><td>${esc(r.TotalSerial)}</td>` : ''}
            <td>${esc(r.StockStart)}</td><td>${esc(r.StockIn)}</td><td>${esc(r.StockOut)}</td><td>${esc(r.StockEnd)}</td><td>${fmtRp(r.UnitPrice)}</td><td>${fmtRp(r.TotalPrice)}</td><td>${esc(r.Cashier)}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editSalesRow('${unit}','${esc(r.SaleID)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteSales('${unit}','${esc(r.SaleID)}')"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        });
        $('#sales-tbody-' + unit).html(tbody);
        let sel = '#sales-table-' + unit;
        if ($.fn.DataTable.isDataTable(sel)) $(sel).DataTable().destroy();
        $(sel).DataTable({ pageLength: 10, order: [[1, 'desc']] });
      }).withFailureHandler(errHandler).getSalesData(unit, sessionToken);
    }

    function editSalesRow(unit, saleId) {
      let r = (salesCache[unit] || []).find(x => x.SaleID === saleId);
      if (!r) return Swal.fire('Gagal', 'Data transaksi tidak ditemukan, coba Refresh Data.', 'error');
      openSalesModal(unit, r);
    }

    // Label & tipe input field Stok/Seri yang bisa diatur tampil/kunci oleh
    // Owner lewat Pengaturan > Pengaturan Form Input Penjualan.
    const SALES_FORM_FIELD_LABELS = {
      StockStart: 'Stok Awal', StockIn: 'Stok Masuk', StockOut: 'Stok Keluar (mengikuti Qty)',
      StockEnd: 'Stok Akhir', SerialStart: 'Nomor Seri Awal', SerialEnd: 'Nomor Seri Akhir'
    };
    const SALES_FORM_STOCK_KEYS = ['StockStart', 'StockIn', 'StockOut', 'StockEnd'];

    function openSalesModal(unit, r) {
      const isEdit = !!r;
      google.script.run.withSuccessHandler(function(products) {
        loadCompanySettings(function() {
          const showPayment = companySettings.SHOW_PAYMENT_METHOD_IN_SALES === 'Yes';

          google.script.run.withSuccessHandler(function(cfgRes) {
            if (!cfgRes.success) return Swal.fire('Gagal', cfgRes.message, 'error');
            const sfCfg = cfgRes.config;

            // Field field text (Nomor Seri) - id: swal-serial-start / swal-serial-end
            function serialFieldHtml(key, idSuffix) {
              let f = sfCfg[key];
              if (!f || !f.show) return '';
              let val = isEdit ? (r[key] || '') : '';
              let locked = !f.editable;
              return `<div class="text-start mb-2" id="wrap-serial-${idSuffix}">
                <label class="form-label small fw-bold mb-1">${SALES_FORM_FIELD_LABELS[key]} ${locked ? '<i class="fa-solid fa-lock ms-1 text-muted" title="Dikunci Owner"></i>' : ''}</label>
                <input id="swal-serial-${idSuffix}" class="swal2-input m-0" style="width:100%" placeholder="${SALES_FORM_FIELD_LABELS[key]}" value="${esc(val)}" ${locked ? 'disabled' : ''}>
              </div>`;
            }
            // Field angka (Stok Awal/Masuk/Keluar/Akhir) - id: swal-stockstart dst.
            function stockFieldHtml(key) {
              let f = sfCfg[key];
              if (!f || !f.show) return '';
              let val = isEdit ? (r[key] !== undefined ? r[key] : '') : '';
              let locked = !f.editable;
              return `<div class="text-start mb-2" id="wrap-stock-${key.toLowerCase()}">
                <label class="form-label small fw-bold mb-1">${SALES_FORM_FIELD_LABELS[key]} ${locked ? '<i class="fa-solid fa-lock ms-1 text-muted" title="Dikunci Owner - otomatis"></i>' : ''}</label>
                <input id="swal-${key.toLowerCase()}" type="number" class="swal2-input m-0" style="width:100%" placeholder="${SALES_FORM_FIELD_LABELS[key]}" value="${val}" ${locked ? 'disabled' : ''}>
              </div>`;
            }

            function buildModalHtml(methodOptions) {
              let selectedLabel = isEdit ? (r.ProductName + (r.Variant && r.Variant !== '-' ? ' (' + r.Variant + ')' : '')) : '';
              return `
                <div class="text-start position-relative mb-2">
                  <label class="form-label small fw-bold mb-1">Cari Produk</label>
                  <input id="swal-product-search" class="swal2-input m-0" style="width:100%" placeholder="Ketik nama produk untuk mencari..." autocomplete="off" value="${selectedLabel}">
                  <input type="hidden" id="swal-product-code" value="${isEdit ? r.ProductCode : ''}">
                  <div id="swal-product-results" class="list-group position-absolute w-100" style="z-index:2000; max-height:200px; overflow-y:auto; display:none;"></div>
                </div>
                <input id="swal-qty" type="number" min="1" class="swal2-input" placeholder="Qty" value="${isEdit?r.Qty:''}">
                ${serialFieldHtml('SerialStart', 'start')}
                ${serialFieldHtml('SerialEnd', 'end')}
                ${stockFieldHtml('StockStart')}
                ${stockFieldHtml('StockIn')}
                ${stockFieldHtml('StockOut')}
                ${stockFieldHtml('StockEnd')}
                <div class="text-start mb-2">
                  <label class="form-label small fw-bold mb-1">Total Harga <i id="swal-total-lock-icon" class="fa-solid fa-lock ms-1 text-muted" style="display:none;" title="Harga tetap - tidak bisa diedit manual"></i></label>
                  <input id="swal-total-price" type="number" min="0" class="swal2-input m-0" style="width:100%" placeholder="Total Harga" value="${isEdit ? Number(r.TotalPrice) : 0}">
                  <div id="swal-total-hint" class="form-text small text-muted mt-1">Otomatis dihitung dari Qty x Harga Satuan. Silakan edit manual jika tidak sesuai, lalu Simpan.</div>
                </div>
                ${showPayment ? `<select id="swal-payment" class="swal2-select" style="width:100%">${methodOptions}</select>` : ''}
                <input id="swal-notes" class="swal2-input" placeholder="Catatan (opsional)" value="${isEdit?r.Notes:''}">`;
            }

            function openWithMethods(methodOptions) {
              Swal.fire({
                title: isEdit ? 'Edit Transaksi Penjualan' : 'Input Penjualan Baru',
                width: 520,
                html: buildModalHtml(methodOptions),
                confirmButtonText: 'Simpan', showCancelButton: true, focusConfirm: false,
                didOpen: () => {
                  const searchInput = document.getElementById('swal-product-search');
                  const codeInput = document.getElementById('swal-product-code');
                  const resultsBox = document.getElementById('swal-product-results');
                  const qtyInput = document.getElementById('swal-qty');
                  const totalInput = document.getElementById('swal-total-price');

                  // Total Harga dihitung ulang otomatis (Qty x Harga Satuan produk
                  // terpilih) setiap kali Qty berubah atau produk diganti. Kasir
                  // tetap bebas mengetik ulang nilainya secara manual di kolom Total
                  // Harga sebelum menekan Simpan - nilai manual itulah yang dipakai.
                  function recalcTotal() {
                    let code = codeInput.value;
                    let p = products.find(pp => pp.ProductCode === code);
                    let unitPrice = p ? Number(p.SellPrice) : 0;
                    let qty = Number(qtyInput.value) || 0;
                    totalInput.value = qty * unitPrice;
                  }

                  // Stok Awal/Masuk/Keluar/Akhir dihitung ulang otomatis dari stok
                  // gudang outlet saat ini setiap kali produk atau Qty berubah -
                  // sama seperti Total Harga. Kalau field-nya "Bisa Diedit Kasir"
                  // (tidak disabled), kasir tetap bebas mengetik ulang nilainya
                  // secara manual sebelum menekan Simpan.
                  function setFieldVal(idSuffix, val) {
                    let el = document.getElementById(idSuffix);
                    if (el) el.value = val;
                  }
                  function recalcStockFields() {
                    let anyShown = SALES_FORM_STOCK_KEYS.some(k => sfCfg[k] && sfCfg[k].show);
                    if (!anyShown) return;
                    let code = codeInput.value;
                    let qty = Number(qtyInput.value) || 0;
                    if (!code) return;
                    let p = products.find(pp => pp.ProductCode === code);
                    // Produk "Tidak Pakai Stok" tidak pernah menghitung/menampilkan
                    // Stok Awal/Masuk/Keluar/Akhir - field-nya sudah disembunyikan
                    // oleh applyProductFieldVisibility(), jadi tidak perlu query.
                    if (p && String(p.UsesStock || 'Ya').trim() === 'Tidak') return;
                    google.script.run.withSuccessHandler(function(res) {
                      if (!res.success) return;
                      let stockStartAuto = res.stock;
                      let stockInAuto = 0;
                      let stockOutAuto = qty;
                      let stockEndAuto = stockStartAuto + stockInAuto - stockOutAuto;
                      setFieldVal('swal-stockstart', stockStartAuto);
                      setFieldVal('swal-stockin', stockInAuto);
                      setFieldVal('swal-stockout', stockOutAuto);
                      setFieldVal('swal-stockend', stockEndAuto);
                    }).withFailureHandler(function() {}).getProductStock(unit, code, sessionToken);
                  }

                  // Field Stok Awal/Masuk/Keluar/Akhir dan Nomor Seri Awal/Akhir
                  // hanya relevan untuk produk yang memang memakai stok (UsesStock
                  // di Master Produk). Kalau produk yang dipilih "Tidak Pakai
                  // Stok", semua field itu disembunyikan total dan Form Input
                  // Penjualan hanya menyisakan Qty + Total Harga. Nomor Seri di
                  // dalamnya juga tunduk pada UsesSerial per produk (mis. produk
                  // F&B di outlet yang punya kolom seri tapi tidak butuh nomor seri).
                  // Fungsi ini SEKALIGUS mengunci/membuka field Total Harga sesuai
                  // "Harga Fleksibel" produk (lihat blok di bawah).
                  function applyProductFieldVisibility() {
                    let p = products.find(pp => pp.ProductCode === codeInput.value);
                    let usesStock = p ? String(p.UsesStock || 'Ya').trim() !== 'Tidak' : true;
                    let usesSerial = p ? String(p.UsesSerial || 'Ya').trim() !== 'Tidak' : true;
                    SALES_FORM_STOCK_KEYS.forEach(function(k) {
                      let wrap = document.getElementById('wrap-stock-' + k.toLowerCase());
                      if (!wrap) return;
                      let cfgShow = sfCfg[k] && sfCfg[k].show;
                      wrap.style.display = (usesStock && cfgShow) ? '' : 'none';
                    });
                    [['SerialStart', 'start'], ['SerialEnd', 'end']].forEach(function(pair) {
                      let wrap = document.getElementById('wrap-serial-' + pair[1]);
                      if (!wrap) return;
                      let cfgShow = sfCfg[pair[0]] && sfCfg[pair[0]].show;
                      wrap.style.display = (usesStock && usesSerial && cfgShow) ? '' : 'none';
                    });

                    // Total Harga: TERKUNCI (tidak bisa diedit manual oleh kasir,
                    // selalu ikut Qty x Harga Satuan) kalau produk yang dipilih
                    // punya "Harga Fleksibel" = "Tidak" di Master Produk (atau
                    // belum ada produk yang dipilih sama sekali). Hanya produk
                    // yang eksplisit ditandai "Harga Fleksibel" = "Ya" yang
                    // field Total Harga-nya bisa diketik ulang manual.
                    let hargaFleksibel = p ? String(p.HargaFleksibel || 'Tidak').trim() === 'Ya' : false;
                    totalInput.disabled = !hargaFleksibel;
                    totalInput.classList.toggle('bg-light', !hargaFleksibel);
                    document.getElementById('swal-total-lock-icon').style.display = hargaFleksibel ? 'none' : '';
                    document.getElementById('swal-total-hint').textContent = hargaFleksibel
                      ? 'Otomatis dihitung dari Qty x Harga Satuan. Produk ini "Harga Fleksibel", boleh diedit manual jika perlu, lalu Simpan.'
                      : 'Harga tetap (otomatis Qty x Harga Satuan) - tidak bisa diedit manual untuk produk ini. Aktifkan "Harga Fleksibel" di Master Produk kalau memang perlu diubah manual.';
                  }
                  applyProductFieldVisibility();

                  qtyInput.addEventListener('input', () => { recalcTotal(); recalcStockFields(); });

                  function renderResults(list) {
                    if (!list.length) { resultsBox.style.display = 'none'; resultsBox.innerHTML = ''; return; }
                    resultsBox.innerHTML = list.map(p => `
                      <button type="button" class="list-group-item list-group-item-action text-start" data-code="${p.ProductCode}">
                        <strong>${p.ProductName}</strong> ${p.Variant!=='-'?'('+p.Variant+')':''}
                        <div class="small text-muted">${p.Category} &middot; ${fmtRp(p.SellPrice)}</div>
                      </button>`).join('');
                    resultsBox.style.display = 'block';
                    resultsBox.querySelectorAll('button').forEach(btn => {
                      btn.addEventListener('click', () => {
                        let p = products.find(pp => pp.ProductCode === btn.dataset.code);
                        if (!p) return;
                        codeInput.value = p.ProductCode;
                        searchInput.value = p.ProductName + (p.Variant !== '-' ? ' (' + p.Variant + ')' : '');
                        resultsBox.style.display = 'none';
                        applyProductFieldVisibility();
                        recalcTotal();
                        recalcStockFields();
                      });
                    });
                  }

                  searchInput.addEventListener('input', () => {
                    codeInput.value = '';
                    let q = searchInput.value.trim().toLowerCase();
                    if (!q) { resultsBox.style.display = 'none'; return; }
                    let filtered = products.filter(p => (p.ProductName + ' ' + p.Variant + ' ' + p.Category).toLowerCase().includes(q));
                    renderResults(filtered.slice(0, 30));
                  });
                  searchInput.addEventListener('focus', () => {
                    if (!codeInput.value) renderResults(products.slice(0, 30));
                  });
                  document.addEventListener('click', function outsideClick(ev) {
                    if (!resultsBox.contains(ev.target) && ev.target !== searchInput) resultsBox.style.display = 'none';
                  });
                },
                preConfirm: () => {
                  let code = document.getElementById('swal-product-code').value;
                  let selected = products.find(p => p.ProductCode === code);
                  if (!selected) { Swal.showValidationMessage('Pilih produk dari daftar pencarian terlebih dahulu'); return false; }
                  let qty = document.getElementById('swal-qty').value;
                  if (!qty || Number(qty) <= 0) { Swal.showValidationMessage('Isi jumlah (qty) dengan benar'); return false; }
                  let totalPriceVal = document.getElementById('swal-total-price').value;
                  if (totalPriceVal === '' || isNaN(Number(totalPriceVal)) || Number(totalPriceVal) < 0) {
                    Swal.showValidationMessage('Isi Total Harga dengan benar');
                    return false;
                  }
                  let usesStockSel = String(selected.UsesStock || 'Ya').trim() !== 'Tidak';
                  let usesSerialSel = String(selected.UsesSerial || 'Ya').trim() !== 'Tidak';
                  function readField(key, idSuffix, isSerial) {
                    // Produk "Tidak Pakai Stok" tidak pernah mengirim nilai
                    // Stok/Seri walau field-nya sempat terisi dari produk lain
                    // sebelumnya - field ini memang disembunyikan di form-nya.
                    if (!usesStockSel) return null;
                    if ((key === 'SerialStart' || key === 'SerialEnd') && !usesSerialSel) return null;
                    let f = sfCfg[key];
                    if (!f || !f.show) return null;
                    let el = document.getElementById(idSuffix);
                    return el ? el.value : null;
                  }
                  return {
                    isEdit: isEdit, saleId: isEdit ? r.SaleID : null,
                    productCode: selected.ProductCode, productName: selected.ProductName, variant: selected.Variant,
                    category: selected.Category, unit: selected.Unit, unitPrice: selected.SellPrice,
                    totalPrice: Number(totalPriceVal),
                    qty: qty,
                    serialStart: readField('SerialStart', 'swal-serial-start'),
                    serialEnd: readField('SerialEnd', 'swal-serial-end'),
                    stockStartManual: readField('StockStart', 'swal-stockstart'),
                    stockInManual: readField('StockIn', 'swal-stockin'),
                    stockOutManual: readField('StockOut', 'swal-stockout'),
                    stockEndManual: readField('StockEnd', 'swal-stockend'),
                    paymentMethod: showPayment ? document.getElementById('swal-payment').value : null,
                    notes: document.getElementById('swal-notes').value
                  };
                }
              }).then((result) => {
                if (result.isConfirmed) {
                  google.script.run.withSuccessHandler(res => {
                    if (!res.success) return Swal.fire('Gagal', res.message, 'error');
                    Toast.fire({ icon: 'success', title: res.message });
                    fetchSalesTable(unit);
                  }).withFailureHandler(errHandler).saveSalesTransaction(unit, result.value, sessionToken);
                }
              });
            }

            if (showPayment) {
              google.script.run.withSuccessHandler(function(methods) {
                let activeMethods = methods.filter(m => m.Status === 'Active');
                let methodOptions = activeMethods.map(m => `<option value="${m.MethodName}" ${isEdit && r.PaymentMethod===m.MethodName?'selected':''}>${m.MethodName}</option>`).join('');
                openWithMethods(methodOptions);
              }).withFailureHandler(errHandler).getPaymentMethods();
            } else {
              openWithMethods('');
            }
          }).withFailureHandler(errHandler).getSalesFormConfig(unit);
        });
      }).withFailureHandler(errHandler).getProducts(unit);
    }

    function deleteSales(unit, saleId) {
      Swal.fire({ title: 'Hapus transaksi ini?', text: 'Stok akan dikembalikan otomatis.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            fetchSalesTable(unit);
          }).withFailureHandler(errHandler).deleteSalesTransaction(unit, saleId, sessionToken);
        }
      });
    }

    // ================= PENERIMAAN UANG (per unit) =================
    function renderPaymentView(area, unit) {
      area.html(`
        <h2 class="fw-bold mb-1">${UNIT_LABEL[unit]}</h2>
        <p class="text-muted mb-4">Penerimaan Uang</p>
        <div class="card p-4 shadow-sm">
          <div class="d-flex flex-wrap gap-2 mb-3">
            <button class="btn btn-primary" onclick="openPaymentModal('${unit}')"><i class="fa-solid fa-plus me-2"></i>Input Penerimaan</button>
            <button class="btn btn-outline-primary" onclick="fetchPaymentTable('${unit}')"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
            <button class="btn btn-outline-danger ms-auto" onclick="exportTable('payment','pdf','${unit}')"><i class="fa-solid fa-file-pdf me-2"></i>Export PDF</button>
            <button class="btn btn-outline-success" onclick="exportTable('payment','xlsx','${unit}')"><i class="fa-solid fa-file-excel me-2"></i>Export XLSX</button>
          </div>
          <div class="table-responsive"><table class="table table-striped w-100" id="payment-table-${unit}">
            <thead><tr><th>ID</th><th>Tanggal</th><th>Waktu</th><th>Metode</th><th>Jumlah</th><th>Referensi</th><th>Kasir</th><th>Aksi</th></tr></thead>
            <tbody id="payment-tbody-${unit}"></tbody>
          </table></div>
        </div>`);
      fetchPaymentTable(unit);

    let paymentCache = {};
    function fetchPaymentTable(unit) {
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        paymentCache[unit] = res.data;
        let tbody = '';
        res.data.forEach(p => {
          tbody += `<tr><td>${esc(p.PaymentID)}</td><td>${fmtDate(p.Date)}</td><td>${esc(p.Time)}</td><td>${esc(p.PaymentMethod)}</td><td>${fmtRp(p.Amount)}</td><td>${esc(p.Reference)}</td><td>${esc(p.Cashier)}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editPaymentRow('${unit}','${esc(p.PaymentID)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deletePayment('${unit}','${esc(p.PaymentID)}')"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        });
        $('#payment-tbody-' + unit).html(tbody);
        let sel = '#payment-table-' + unit;
        if ($.fn.DataTable.isDataTable(sel)) $(sel).DataTable().destroy();
        $(sel).DataTable({ pageLength: 10, order: [[1, 'desc']] });
      }).withFailureHandler(errHandler).getPaymentData(unit, sessionToken);
    }

    function editPaymentRow(unit, paymentId) {
      let p = (paymentCache[unit] || []).find(x => x.PaymentID === paymentId);
      if (!p) return Swal.fire('Gagal', 'Data penerimaan tidak ditemukan, coba Refresh Data.', 'error');
      openPaymentModal(unit, p);
    }

    function openPaymentModal(unit, p) {
      const isEdit = !!p;
      google.script.run.withSuccessHandler(function(methods) {
        let activeMethods = methods.filter(m => m.Status === 'Active');
        let methodOptions = activeMethods.map(m => `<option value="${m.MethodName}" ${isEdit && p.PaymentMethod===m.MethodName?'selected':''}>${m.MethodName}</option>`).join('');
        Swal.fire({
          title: isEdit ? 'Edit Penerimaan' : 'Input Penerimaan Uang',
          html: `
            <input id="swal-date" type="date" class="swal2-input" value="${isEdit ? new Date(p.Date).toISOString().slice(0,10) : todayStr()}">
            <select id="swal-method" class="swal2-select" style="width:100%">${methodOptions}</select>
            <input id="swal-amount" type="number" class="swal2-input" placeholder="Jumlah Penerimaan (Rp)" value="${isEdit?p.Amount:''}" oninput="updateRpPreview(this,'preview-amount')">
            <div id="preview-amount" class="text-muted small text-start mb-2" style="margin-left:1.8em;">${fmtRp(isEdit?p.Amount:0)}</div>
            <input id="swal-notes" class="swal2-input" placeholder="Catatan (opsional)" value="${isEdit?p.Notes:''}">`,
          confirmButtonText: 'Simpan', showCancelButton: true, focusConfirm: false,
          preConfirm: () => ({
            isEdit: isEdit, paymentId: isEdit ? p.PaymentID : null,
            date: document.getElementById('swal-date').value,
            paymentMethod: document.getElementById('swal-method').value,
            amount: document.getElementById('swal-amount').value,
            notes: document.getElementById('swal-notes').value
          })
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler(res => {
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              Toast.fire({ icon: 'success', title: res.message });
              fetchPaymentTable(unit);
            }).withFailureHandler(errHandler).savePaymentTransaction(unit, result.value, sessionToken);
          }
        });
      }).withFailureHandler(errHandler).getPaymentMethods();
    }

    function deletePayment(unit, id) {
      Swal.fire({ title: 'Hapus data penerimaan ini?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            fetchPaymentTable(unit);
          }).withFailureHandler(errHandler).deletePaymentTransaction(unit, id, sessionToken);
        }
      });
    }

    // ================= MANAJEMEN STOK (per unit) =================
    function renderStockView(area, unit) {
      area.html(`
        <h2 class="fw-bold mb-1">${UNIT_LABEL[unit]}</h2>
        <p class="text-muted mb-4">Manajemen Stok</p>
