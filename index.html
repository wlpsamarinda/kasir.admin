    // Format teks WA - meniru format laporan harian yang biasa dikirim ke
    // grup WA (emoji header, per-produk, dsb).
    function buildFinanceWaText(r) {
      function line(label, val) { return label + ' = ' + fmtRp(val).replace('Rp ', 'Rp '); }
      function prodLines(items) {
        let lines = finFilterZeroQtyWa_(items.lines);
        if (!lines.length) return '●';
        return lines.map(l => `● ${l.productName}${l.variant ? ' ' + l.variant : ''} : x ${Number(l.unitPrice).toLocaleString('id-ID')} = ${Number(l.total).toLocaleString('id-ID')}`).join('\n');
      }
      let expLines = (items, cat) => items.length ? items.map(e => `● ${e.Description} = ${Number(e.Amount).toLocaleString('id-ID')}`).join('\n') : '●';

      let txt = '';
      txt += `🌴 *LAPORAN HARIAN ${(r.companyName || '').toUpperCase()}*\n`;
      txt += `🗓️ Tanggal : ${fmtDate(r.dateStr)}\n\n`;
      txt += `🔰 *SALDO AWAL* = ${Number(r.saldoAwalTotal).toLocaleString('id-ID')}\n`;
      txt += `💰 Brangkas : ${Number(r.saldoAwalBrangkas).toLocaleString('id-ID')}\n`;
      txt += `💳 Rekening : ${Number(r.saldoAwalRekening).toLocaleString('id-ID')}\n`;
      txt += `Saldo THR di Rekening : Rp ${Number(r.saldoTHR).toLocaleString('id-ID')}\n\n`;
      txt += `📈 *PENDAPATAN*\n`;
      txt += `✅ *Pendapatan Kasir Loket Masuk*\n${prodLines(r.entrance)}\n\n`;
      txt += `✅ *Pendapatan Kasir Loket Wahana*\n${prodLines(r.ride)}\n\n`;
      txt += `✅ *Pendapatan Kasir Resto*\n${prodLines(r.resto)}\n\n`;
      if (r.categoryBreakdown && r.categoryBreakdown.lines && r.categoryBreakdown.lines.length) {
        txt += `📊 *Rekapan Pendapatan Per Kategori (Semua Outlet)*\n`;
        txt += r.categoryBreakdown.lines.map(l => `● ${l.category} : Qty ${l.qty} = ${Number(l.total).toLocaleString('id-ID')}`).join('\n');
        txt += `\n\n`;
      }
      if (r.kasirPenerimaan && r.kasirPenerimaan.lines && r.kasirPenerimaan.lines.length) {
        txt += `👤 *TOTAL PENERIMAAN DARI KASIR*\n`;
        txt += r.kasirPenerimaan.lines.map(l => `● ${l.cashierName} (${l.posisi}) : Tunai ${Number(l.tunai).toLocaleString('id-ID')} + Non Tunai ${Number(l.nonTunai).toLocaleString('id-ID')} = ${Number(l.jumlah).toLocaleString('id-ID')}`).join('\n');
        txt += `\nTotal : Tunai ${Number(r.kasirPenerimaan.totalTunai).toLocaleString('id-ID')} + Non Tunai ${Number(r.kasirPenerimaan.totalNonTunai).toLocaleString('id-ID')} = ${Number(r.kasirPenerimaan.totalJumlah).toLocaleString('id-ID')}\n\n`;
      }
      txt += `🟠 *Total Pendapatan Kotor* = ${Number(r.totalPendapatanKotor).toLocaleString('id-ID')}\n\n`;
      txt += `🟢 *Total Pendapatan Bersih*  = ${Number(r.totalPendapatanBersih).toLocaleString('id-ID')}\n`;
      txt += `💰 Total Penerimaan Uang Tunai Semua Kasir = ${Number(r.totalCash).toLocaleString('id-ID')}\n`;
      txt += `💳 Total Penerimaan QRIS+Transfer+Debit+Kredit Semua Kasir = ${Number(r.totalNonCash).toLocaleString('id-ID')}\n\n`;
      txt += `🟨 Pengeluaran dari Brankas\n${expLines(r.expBrangkas)}\n`;
      txt += `🟨 *Total Pengeluaran Brankas* = Rp ${Number(r.totalExpBrangkas).toLocaleString('id-ID')}\n\n`;
      txt += `🟦 Pengeluaran dari Rekening PT\n${expLines(r.expRekening)}\n`;
      txt += `🟦 *Total Pengeluaran Rekening PT* = Rp ${Number(r.totalExpRekening).toLocaleString('id-ID')}\n\n`;
      txt += `🟫 *Total Pengeluaran Seluruhnya* = Rp ${Number(r.totalExpSeluruhnya).toLocaleString('id-ID')}\n\n`;
      txt += `🟢 *Saldo Bersih* = Rp ${Number(r.saldoBersih).toLocaleString('id-ID')}\n\n`;
      txt += `🔰 *SALDO AKHIR* = ${Number(r.saldoAkhirTotal).toLocaleString('id-ID')}\n`;
      txt += `💰 Brangkas : ${Number(r.saldoAkhirBrangkas).toLocaleString('id-ID')}\n`;
      txt += `💳 Rekening : ${Number(r.saldoAkhirRekening).toLocaleString('id-ID')}\n`;
      txt += `Saldo THR di Rekening : Rp ${Number(r.saldoTHR).toLocaleString('id-ID')}\n\n`;
      if (r.hutang && r.hutang.length) txt += `📌 *HUTANG*\n${r.hutang.map(h => '● ' + h.name + ' = ' + Number(h.amount).toLocaleString('id-ID')).join('\n')}\n\n`;
      if (r.piutang && r.piutang.length) txt += `📌 *PIUTANG*\n${r.piutang.map(h => '● ' + h.name + ' = ' + Number(h.amount).toLocaleString('id-ID')).join('\n')}\n\n`;
      if (r.catatanTambahan) txt += `📝 *CATATAN*\n${r.catatanTambahan}\n\n`;
      txt += `📌  *NOTE*\n`;
      txt += `Total Pendapatan Bulan Ini = ${Number(r.omsetBulanIni).toLocaleString('id-ID')}\n`;
      txt += `Total Pengeluaran Bulan Ini = ${Number(r.pengeluaranBulanIni).toLocaleString('id-ID')}`;
      return txt;
    }

    function copyFinanceReportWaText() {
      if (!financeReportData) return;
      let txt = buildFinanceWaText(financeReportData);
      navigator.clipboard.writeText(txt).then(function() {
        Toast.fire({ icon: 'success', title: 'Format WA disalin ke clipboard' });
      }).catch(function() {
        Swal.fire({ title: 'Salin Manual', html: '<textarea class="form-control" rows="14" onclick="this.select()">' + esc(txt) + '</textarea>', width: 600 });
      });
    }

    function collectFinanceReportChartImages_() {
      let defs = [
        { id: 'fin-rep-chart-outlet', title: 'Pendapatan per Outlet' },
        { id: 'fin-rep-chart-payment', title: 'Tunai vs Non Tunai' },
        { id: 'fin-rep-chart-expense', title: 'Pengeluaran Brangkas vs Rekening' },
        { id: 'fin-rep-chart-category', title: 'Pendapatan per Kategori (Semua Outlet)' }
      ];
      let out = [];
      defs.forEach(d => {
        let canvas = document.getElementById(d.id);
        if (canvas) {
          try { out.push({ title: d.title, dataUrl: canvas.toDataURL('image/png') }); } catch (e) {}
        }
      });
      return out;
    }

    // PERBAIKAN: sections sekarang dirakit sesuai pilihan Admin Keuangan di
    // "Atur Isi Laporan" (financeReportSections) - tiap bagian hanya
    // dimasukkan kalau checkbox-nya aktif. Kalau semua checkbox aktif
    // (default), hasilnya identik seperti sebelumnya (semua bagian tampil).
    function buildFinanceReportPdfSections_(r) {
      let fs = financeReportSections || {};
      let sections = [];
      if (fs.saldo) sections.push({ heading: 'Saldo', headers: ['Keterangan', 'Awal', 'Akhir'], rows: [
        ['Brangkas', fmtRp(r.saldoAwalBrangkas), fmtRp(r.saldoAkhirBrangkas)],
        ['Rekening', fmtRp(r.saldoAwalRekening), fmtRp(r.saldoAkhirRekening)],
        ['Total', fmtRp(r.saldoAwalTotal), fmtRp(r.saldoAkhirTotal)],
        ['Saldo THR di Rekening', fmtRp(r.saldoTHR), fmtRp(r.saldoTHR)]
      ] });
      // Catatan: baris SUBTOTAL untuk tabel Produk (Loket Masuk/Wahana/Resto)
      // ditulis manual (bukan lewat totalLabel/totalValue bawaan) supaya
      // kolom "Qty" ikut menampilkan angka Subtotal Qty, bukan hanya teks
      // "SUBTOTAL" (mekanisme totalLabel/totalValue bawaan cuma mendukung 1
      // kolom nilai total di kolom paling kanan).
      if (fs.entrance) sections.push({ heading: 'Pendapatan Kasir Loket Masuk', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.entrance.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', r.totalQtyEntrance, fmtRp(r.entrance.total)]]) });
      if (fs.ride) sections.push({ heading: 'Pendapatan Kasir Loket Wahana', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.ride.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', r.totalQtyRide, fmtRp(r.ride.total)]]) });
      if (fs.resto) sections.push({ heading: 'Pendapatan Kasir Resto', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.resto.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', r.totalQtyResto, fmtRp(r.resto.total)]]) });
      if (fs.category) sections.push({ heading: 'Rekapan Pendapatan Per Kategori (Semua Outlet)', headers: ['Kategori','Qty','Total'], rows: (r.categoryBreakdown ? r.categoryBreakdown.lines : []).map(l => [l.category, l.qty, fmtRp(l.total)]).concat([['TOTAL', r.totalQtyKategori || 0, fmtRp(r.categoryBreakdown ? r.categoryBreakdown.total : 0)]]) });
      // Catatan: baris TOTAL untuk tabel "Total Penerimaan dari Kasir" ditulis
      // manual (bukan lewat totalLabel/totalValue bawaan) supaya kolom
      // "Total Uang Tunai" & "Total QRIS+Transfer+Debit+Kredit" ikut tampil
      // di baris TOTAL, bukan cuma kolom "Jumlah" (mekanisme totalLabel/
      // totalValue bawaan cuma mendukung 1 kolom nilai total di kolom
      // paling kanan).
      if (fs.kasirPenerimaan) sections.push({ heading: 'Total Penerimaan dari Kasir', headers: ['Nama Kasir','Posisi','Total Uang Tunai','Total QRIS+Transfer+Debit+Kredit','Jumlah'], rows: (r.kasirPenerimaan ? r.kasirPenerimaan.lines : []).map(l => [l.cashierName, l.posisi, fmtRp(l.tunai), fmtRp(l.nonTunai), fmtRp(l.jumlah)]).concat([['TOTAL', '', fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalTunai : 0), fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalNonTunai : 0), fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalJumlah : 0)]]) });
      if (fs.expBrangkas) sections.push({ heading: 'Pengeluaran dari Brangkas', headers: ['Keterangan','Jumlah'], rows: r.expBrangkas.map(e => [e.Description, fmtRp(e.Amount)]), totalLabel: 'TOTAL', totalValue: fmtRp(r.totalExpBrangkas) });
      if (fs.expRekening) sections.push({ heading: 'Pengeluaran dari Rekening PT', headers: ['Keterangan','Jumlah'], rows: r.expRekening.map(e => [e.Description, fmtRp(e.Amount)]), totalLabel: 'TOTAL', totalValue: fmtRp(r.totalExpRekening) });
      if (fs.ringkasan) sections.push({ heading: 'Ringkasan', headers: ['Keterangan', 'Nilai'], rows: [
        ['Saldo Awal Brangkas', fmtRp(r.saldoAwalBrangkas)],
        ['Saldo Awal Rekening', fmtRp(r.saldoAwalRekening)],
        ['Total Saldo Awal', fmtRp(r.saldoAwalTotal)],
        ['Total Pendapatan Kotor', fmtRp(r.totalPendapatanKotor)],
        ['Total Pendapatan Bersih', fmtRp(r.totalPendapatanBersih)],
        ['Total Penerimaan Uang Tunai Semua Kasir', fmtRp(r.totalCash)],
        ['Total Penerimaan QRIS+Transfer+Debit+Kredit Semua Kasir', fmtRp(r.totalNonCash)],
        ['Total Pengeluaran Brangkas', fmtRp(r.totalExpBrangkas)],
        ['Total Pengeluaran Rekening', fmtRp(r.totalExpRekening)],
        ['Total Pengeluaran Seluruhnya', fmtRp(r.totalExpSeluruhnya)],
        ['Saldo Bersih', fmtRp(r.saldoBersih)],
        ['Saldo Akhir Brangkas', fmtRp(r.saldoAkhirBrangkas)],
        ['Saldo Akhir Rekening', fmtRp(r.saldoAkhirRekening)],
        ['Total Saldo Akhir', fmtRp(r.saldoAkhirTotal)],
        ['Saldo THR di Rekening', fmtRp(r.saldoTHR)],
        ['Total Pendapatan Bulan Ini', fmtRp(r.omsetBulanIni)],
        ['Total Pengeluaran Bulan Ini', fmtRp(r.pengeluaranBulanIni)]
      ] });
      return sections;
    }

    function downloadFinanceReportPdf() {
      if (!financeReportData) return;
      const r = financeReportData;
      const chartImages = financeReportSections.chart ? collectFinanceReportChartImages_() : [];
      loadCompanySettings(function() {
        const headerInfo = { cashierName: r.cashierName, cashierPosition: r.cashierPosition, reportDate: r.dateStr, logoUrl: r.logoUrl, nameLabel: 'Nama Petugas' };
        let sections = buildFinanceReportPdfSections_(r);
        exportToPdf('Laporan_Keuangan_' + r.dateStr + '.pdf', 'Laporan Harian Admin Keuangan', 'Tanggal Laporan: ' + fmtDate(r.dateStr), sections, headerInfo, chartImages, financeReportSections.orientation);
        Toast.fire({ icon: 'success', title: 'Laporan berhasil diunduh' });
      });
    }

    // PERBAIKAN: sheet "Ringkasan" sekarang berisi daftar LENGKAP & berurutan
    // sesuai permintaan (Saldo Awal -> Pendapatan -> Pengeluaran -> Saldo
    // Bersih -> Saldo Akhir -> Rekap Bulan Ini) setiap kali bagian
    // "Ringkasan Akhir" aktif di "Atur Isi Laporan" - tidak lagi bergantung
    // ke toggle "Saldo" terpisah supaya urutan & isinya selalu lengkap
    // seperti yang diminta. Kalau HANYA "Saldo Awal & Akhir" yang aktif
    // (Ringkasan Akhir dimatikan), tetap ditampilkan sheet Ringkasan versi
    // ringkas (cuma Saldo Awal/Akhir/THR) sebagai fallback.
    function buildFinanceReportXlsxSheets_(r) {
      let fs = financeReportSections || {};
      let cd = r.chartData || { outletLabels: [], outletValues: [], expenseLabels: [], expenseValues: [] };
      let sheets = [];

      let ringkasanRows = [];
      if (fs.ringkasan) {
        ringkasanRows = [
          ['Saldo Awal Brangkas', fmtRp(r.saldoAwalBrangkas)],
          ['Saldo Awal Rekening', fmtRp(r.saldoAwalRekening)],
          ['Total Saldo Awal', fmtRp(r.saldoAwalTotal)],
          ['Subtotal Qty Pendapatan Kasir Loket Masuk', r.totalQtyEntrance || 0],
          ['Subtotal Qty Kasir Loket Wahana', r.totalQtyRide || 0],
          ['Subtotal Qty Kasir Resto', r.totalQtyResto || 0],
          ['Total Qty Rekapan Pendapatan Per Kategori', r.totalQtyKategori || 0],
          ['Total Pendapatan Kotor', fmtRp(r.totalPendapatanKotor)],
          ['Total Pendapatan Bersih', fmtRp(r.totalPendapatanBersih)],
          ['Total Penerimaan Uang Tunai Semua Kasir', fmtRp(r.totalCash)],
          ['Total Penerimaan QRIS+Transfer+Debit+Kredit Semua Kasir', fmtRp(r.totalNonCash)],
          ['Total Pengeluaran Brangkas', fmtRp(r.totalExpBrangkas)],
          ['Total Pengeluaran Rekening', fmtRp(r.totalExpRekening)],
          ['Total Pengeluaran Seluruhnya', fmtRp(r.totalExpSeluruhnya)],
          ['Saldo Bersih', fmtRp(r.saldoBersih)],
          ['Saldo Akhir Brangkas', fmtRp(r.saldoAkhirBrangkas)],
          ['Saldo Akhir Rekening', fmtRp(r.saldoAkhirRekening)],
          ['Total Saldo Akhir', fmtRp(r.saldoAkhirTotal)],
          ['Saldo THR di Rekening', fmtRp(r.saldoTHR)],
          ['Total Pendapatan Bulan Ini', fmtRp(r.omsetBulanIni)],
          ['Total Pengeluaran Bulan Ini', fmtRp(r.pengeluaranBulanIni)]
        ];
      } else if (fs.saldo) {
        ringkasanRows = [
          ['Saldo Awal Brangkas', fmtRp(r.saldoAwalBrangkas)], ['Saldo Awal Rekening', fmtRp(r.saldoAwalRekening)],
          ['Total Saldo Awal', fmtRp(r.saldoAwalTotal)],
          ['Saldo Akhir Brangkas', fmtRp(r.saldoAkhirBrangkas)], ['Saldo Akhir Rekening', fmtRp(r.saldoAkhirRekening)],
          ['Total Saldo Akhir', fmtRp(r.saldoAkhirTotal)], ['Saldo THR di Rekening', fmtRp(r.saldoTHR)]
        ];
      }
      if (ringkasanRows.length) sheets.push({ name: 'Ringkasan', headers: ['Keterangan', 'Nilai'], rows: ringkasanRows });

      if (fs.chart) sheets.push({ name: 'Grafik (Data)', headers: ['Grafik / Kategori', 'Nilai'], rows: [
        ['Pendapatan per Outlet', ''],
        ...cd.outletLabels.map((lbl, i) => [lbl, fmtRp(cd.outletValues[i])]),
        ['', ''],
        ['Tunai vs Non Tunai', ''],
        ['Tunai', fmtRp(r.totalCash)], ['Non Tunai', fmtRp(r.totalNonCash)],
        ['', ''],
        ['Pengeluaran Brangkas vs Rekening', ''],
        ...cd.expenseLabels.map((lbl, i) => [lbl, fmtRp(cd.expenseValues[i])]),
        ['', ''],
        ['Pendapatan per Kategori (Semua Outlet)', ''],
        ...(cd.categoryLabels || []).map((lbl, i) => [lbl, fmtRp((cd.categoryValues || [])[i])])
      ] });

      if (fs.entrance) sheets.push({ name: 'Kasir Loket Masuk', headers: ['Produk','Varian','Harga','Qty','Total'], rows: finFilterZeroQty_(r.entrance.lines).map(l => [l.productName, l.variant, fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['', '', 'SUBTOTAL', r.totalQtyEntrance, fmtRp(r.entrance.total)]]) });
      if (fs.ride) sheets.push({ name: 'Kasir Loket Wahana', headers: ['Produk','Varian','Harga','Qty','Total'], rows: finFilterZeroQty_(r.ride.lines).map(l => [l.productName, l.variant, fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['', '', 'SUBTOTAL', r.totalQtyRide, fmtRp(r.ride.total)]]) });
      if (fs.resto) sheets.push({ name: 'Kasir Resto', headers: ['Produk','Varian','Harga','Qty','Total'], rows: finFilterZeroQty_(r.resto.lines).map(l => [l.productName, l.variant, fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['', '', 'SUBTOTAL', r.totalQtyResto, fmtRp(r.resto.total)]]) });
      if (fs.category) sheets.push({ name: 'Kategori (Semua Outlet)', headers: ['Kategori','Qty','Total'], rows: (r.categoryBreakdown ? r.categoryBreakdown.lines : []).map(l => [l.category, l.qty, fmtRp(l.total)]).concat([['Total', r.totalQtyKategori || 0, fmtRp(r.categoryBreakdown ? r.categoryBreakdown.total : 0)]]) });
      if (fs.kasirPenerimaan) sheets.push({ name: 'Total Penerimaan Kasir', headers: ['Nama Kasir','Posisi','Total Uang Tunai','Total QRIS+Transfer+Debit+Kredit','Jumlah'], rows: (r.kasirPenerimaan ? r.kasirPenerimaan.lines : []).map(l => [l.cashierName, l.posisi, fmtRp(l.tunai), fmtRp(l.nonTunai), fmtRp(l.jumlah)]).concat([['Total', '', fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalTunai : 0), fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalNonTunai : 0), fmtRp(r.kasirPenerimaan ? r.kasirPenerimaan.totalJumlah : 0)]]) });

      if (fs.expBrangkas || fs.expRekening) sheets.push({ name: 'Pengeluaran', headers: ['Kategori','Keterangan','Jumlah'], rows: [].concat(
        fs.expBrangkas ? r.expBrangkas.map(e => ['Brangkas', e.Description, fmtRp(e.Amount)]) : [],
        fs.expRekening ? r.expRekening.map(e => ['Rekening PT', e.Description, fmtRp(e.Amount)]) : []
      ) });

      return sheets;
    }

    async function downloadFinanceReportXlsx() {
      if (!financeReportData) return;
      const r = financeReportData;
      let sheets = buildFinanceReportXlsxSheets_(r);
      let chartImages = financeReportSections.chart ? collectFinanceReportChartImages_() : [];
      await exportMultiSheetXlsxWithCharts_('Laporan_Keuangan_' + r.dateStr + '.xlsx', sheets, chartImages);
      Toast.fire({ icon: 'success', title: 'Laporan berhasil diunduh' });
    }

    // ================= ADMIN KEUANGAN: REPORT SEMUA KASIR =================
    // Gabungan Report Kasir Loket Masuk + Loket Wahana + Resto dalam SATU
    // file, lengkap dengan rekapan Total Penerimaan Seluruh Kasir (per
    // metode pembayaran: Tunai/QRIS/Transfer/Debit/Kredit) & rekapan Total
    // Penjualan per outlet, plus indikator BALANCE antara keduanya. Memakai
    // toggle "Sembunyikan produk Qty 0" & modal "Atur Isi Laporan" yang sama
    // dengan Report Admin Keuangan (financeReportSections.hideZeroQty).
    let allKasirReportDate = todayStr();
    let allKasirReportData = null;

    function renderAllKasirReportView(area) {
      area.html(`
        <h2 class="fw-bold mb-1">Admin Keuangan</h2>
        <p class="text-muted mb-4">Report Semua Kasir (Kasir Loket Masuk + Kasir Loket Wahana + Kasir Resto)</p>
        <div class="card p-3 shadow-sm mb-3">
          <div class="d-flex flex-wrap gap-2 align-items-end">
            <div><label class="form-label small mb-1">Tanggal</label><input type="date" id="akr-date" class="form-control" value="${allKasirReportDate}"></div>
            <button class="btn btn-primary" onclick="loadAllKasirReport()"><i class="fa-solid fa-magnifying-glass me-2"></i>Tampilkan</button>
            <button class="btn btn-outline-dark" onclick="openFinanceReportSectionsModal()"><i class="fa-solid fa-sliders me-2"></i>Atur Isi Laporan</button>
            <button class="btn btn-danger" onclick="downloadAllKasirReportPdf()"><i class="fa-solid fa-file-pdf me-2"></i>PDF</button>
            <button class="btn btn-success" onclick="downloadAllKasirReportXlsx()"><i class="fa-solid fa-file-excel me-2"></i>XLSX</button>
          </div>
        </div>
        <div id="akr-content"><div class="text-center text-muted p-5"><i class="fa-solid fa-spinner fa-spin fa-lg"></i></div></div>`);
      loadAllKasirReport();
    }

    function loadAllKasirReport() {
      allKasirReportDate = $('#akr-date').val() || allKasirReportDate;
      $('#akr-content').html('<div class="text-center text-muted p-5"><i class="fa-solid fa-spinner fa-spin fa-lg"></i></div>');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) { $('#akr-content').html(''); return Swal.fire('Gagal', res.message, 'error'); }
        allKasirReportData = res;
        renderAllKasirReportContent(res);
      }).withFailureHandler(errHandler).getAllKasirReportData(allKasirReportDate, sessionToken);
    }

    function renderAllKasirReportContent(r) {
      let t = r.totals;
      let balanceOk = Math.abs(t.selisih) < 1; // toleransi pembulatan Rp1
      let html = `
        <div class="card p-3 shadow-sm mb-3">
          <h6 class="fw-bold mb-2">Rekapan Total Penerimaan Seluruh Kasir (per Metode Pembayaran)</h6>
          <div class="table-responsive"><table class="table table-sm table-striped mb-1">
            <thead><tr><th>Metode Pembayaran</th><th class="text-end">Jumlah</th></tr></thead>
            <tbody>
              <tr><td>Tunai</td><td class="text-end">${fmtRp(t.totalCash)}</td></tr>
              <tr><td>QRIS</td><td class="text-end">${fmtRp(t.totalQris)}</td></tr>
              <tr><td>Transfer</td><td class="text-end">${fmtRp(t.totalTransfer)}</td></tr>
              <tr><td>Kartu Debit</td><td class="text-end">${fmtRp(t.totalDebit)}</td></tr>
              <tr><td>Kartu Kredit</td><td class="text-end">${fmtRp(t.totalKredit)}</td></tr>
            </tbody>
            <tfoot><tr class="fw-bold border-top"><td>Total Penerimaan Seluruh Kasir</td><td class="text-end">${fmtRp(t.totalPenerimaanSeluruhKasir)}</td></tr></tfoot>
          </table></div>
        </div>
        <div class="card p-3 shadow-sm mb-3">
          <h6 class="fw-bold mb-2">Rekapan Total Penjualan per Kasir</h6>
          <div class="table-responsive"><table class="table table-sm table-striped mb-1">
            <thead><tr><th>Kasir</th><th class="text-end">Total Qty</th><th class="text-end">Total Penjualan</th></tr></thead>
            <tbody>
              <tr><td>Kasir Loket Masuk</td><td class="text-end">${t.totalQtyEntrance}</td><td class="text-end">${fmtRp(t.totalPenjualanEntrance)}</td></tr>
              <tr><td>Kasir Loket Wahana</td><td class="text-end">${t.totalQtyRide}</td><td class="text-end">${fmtRp(t.totalPenjualanRide)}</td></tr>
              <tr><td>Kasir Resto</td><td class="text-end">${t.totalQtyResto}</td><td class="text-end">${fmtRp(t.totalPenjualanResto)}</td></tr>
            </tbody>
            <tfoot><tr class="fw-bold border-top"><td>Total Penjualan Seluruh Kasir</td><td class="text-end">${t.totalQtySeluruhKasir}</td><td class="text-end">${fmtRp(t.totalPenjualanSeluruhKasir)}</td></tr></tfoot>
          </table></div>
          <div class="alert ${balanceOk ? 'alert-success' : 'alert-warning'} small mb-0 mt-2">
            <i class="fa-solid ${balanceOk ? 'fa-circle-check' : 'fa-triangle-exclamation'} me-1"></i>
            ${balanceOk
              ? 'Total Penjualan &amp; Total Penerimaan Seluruh Kasir sudah BALANCE.'
              : 'Total Penjualan &amp; Total Penerimaan BELUM balance. Selisih: ' + fmtRp(Math.abs(t.selisih)) + ' (' + (t.selisih > 0 ? 'Total Penjualan lebih besar dari Total Penerimaan' : 'Total Penerimaan lebih besar dari Total Penjualan') + ') - cek kembali data Penjualan/Penerimaan Uang hari ini.'}
          </div>
        </div>
        ${finUnitTable_('Kasir Loket Masuk', { lines: finFilterZeroQty_(r.entrance.lines), total: r.entrance.total, totalQty: r.entrance.totalQty })}
        ${finUnitTable_('Kasir Loket Wahana', { lines: finFilterZeroQty_(r.ride.lines), total: r.ride.total, totalQty: r.ride.totalQty })}
        ${finUnitTable_('Kasir Resto', { lines: finFilterZeroQty_(r.resto.lines), total: r.resto.total, totalQty: r.resto.totalQty })}`;
      $('#akr-content').html(html);
    }

    function buildAllKasirReportPdfSections_(r) {
      let t = r.totals;
      return [
        { heading: 'Total Penerimaan Seluruh Kasir (per Metode Pembayaran)', headers: ['Metode Pembayaran','Jumlah'], rows: [
          ['Tunai', fmtRp(t.totalCash)], ['QRIS', fmtRp(t.totalQris)], ['Transfer', fmtRp(t.totalTransfer)],
          ['Kartu Debit', fmtRp(t.totalDebit)], ['Kartu Kredit', fmtRp(t.totalKredit)]
        ], totalLabel: 'TOTAL', totalValue: fmtRp(t.totalPenerimaanSeluruhKasir) },
        // Catatan: baris TOTAL ditulis manual (bukan lewat totalLabel/
        // totalValue bawaan) supaya kolom "Total Qty" ikut tampil di baris
        // total (mekanisme totalLabel/totalValue bawaan cuma mendukung 1
        // kolom nilai total di kolom paling kanan).
        { heading: 'Total Penjualan per Kasir', headers: ['Kasir','Total Qty','Total Penjualan'], rows: [
          ['Kasir Loket Masuk', t.totalQtyEntrance, fmtRp(t.totalPenjualanEntrance)],
          ['Kasir Loket Wahana', t.totalQtyRide, fmtRp(t.totalPenjualanRide)],
          ['Kasir Resto', t.totalQtyResto, fmtRp(t.totalPenjualanResto)],
          ['TOTAL', t.totalQtySeluruhKasir, fmtRp(t.totalPenjualanSeluruhKasir)]
        ] },
        { heading: 'Status Balance Penjualan vs Penerimaan', headers: ['Keterangan','Nilai'], rows: [
          ['Total Penjualan Seluruh Kasir', fmtRp(t.totalPenjualanSeluruhKasir)],
          ['Total Penerimaan Seluruh Kasir', fmtRp(t.totalPenerimaanSeluruhKasir)],
          ['Selisih', fmtRp(t.selisih)],
          ['Status', Math.abs(t.selisih) < 1 ? 'BALANCE' : 'TIDAK BALANCE']
        ] },
        { heading: 'Pendapatan Kasir Loket Masuk', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.entrance.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', t.totalQtyEntrance, fmtRp(r.entrance.total)]]) },
        { heading: 'Pendapatan Kasir Loket Wahana', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.ride.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', t.totalQtyRide, fmtRp(r.ride.total)]]) },
        { heading: 'Pendapatan Kasir Resto', headers: ['Produk','Harga','Qty','Total'], rows: finFilterZeroQty_(r.resto.lines).map(l => [l.productName + (l.variant ? ' ('+l.variant+')' : ''), fmtRp(l.unitPrice), l.qty, fmtRp(l.total)]).concat([['SUBTOTAL', '', t.totalQtyResto, fmtRp(r.resto.total)]]) }
      ];
    }

    function downloadAllKasirReportPdf() {
      if (!allKasirReportData) return;
      const r = allKasirReportData;
      let balanceOk = Math.abs(r.totals.selisih) < 1;
      loadCompanySettings(function() {
        const headerInfo = { cashierName: r.cashierName, cashierPosition: r.cashierPosition, reportDate: r.dateStr, logoUrl: r.logoUrl, nameLabel: 'Nama Petugas' };
        let sections = buildAllKasirReportPdfSections_(r);
        let subtitle = 'Tanggal Laporan: ' + fmtDate(r.dateStr) + '   |   Status: ' + (balanceOk ? 'BALANCE' : 'TIDAK BALANCE (selisih ' + fmtRp(Math.abs(r.totals.selisih)) + ')');
        exportToPdf('Laporan_Semua_Kasir_' + r.dateStr + '.pdf', 'Report Semua Kasir', subtitle, sections, headerInfo, null, financeReportSections.orientation);
        Toast.fire({ icon: 'success', title: 'Laporan berhasil diunduh' });
      });
    }

    function buildAllKasirReportXlsxSheets_(r) {
      let t = r.totals;
      return [
        { name: 'Rekapan', headers: ['Keterangan', 'Nilai'], rows: [
          ['-- Total Penerimaan Seluruh Kasir (per Metode) --', ''],
          ['Tunai', fmtRp(t.totalCash)], ['QRIS', fmtRp(t.totalQris)], ['Transfer', fmtRp(t.totalTransfer)],
          ['Kartu Debit', fmtRp(t.totalDebit)], ['Kartu Kredit', fmtRp(t.totalKredit)],
          ['Total Penerimaan Seluruh Kasir', fmtRp(t.totalPenerimaanSeluruhKasir)],
          ['', ''],
          ['-- Total Penjualan per Kasir --', ''],
          ['Kasir Loket Masuk (Qty ' + t.totalQtyEntrance + ')', fmtRp(t.totalPenjualanEntrance)],
          ['Kasir Loket Wahana (Qty ' + t.totalQtyRide + ')', fmtRp(t.totalPenjualanRide)],
          ['Kasir Resto (Qty ' + t.totalQtyResto + ')', fmtRp(t.totalPenjualanResto)],
          ['Total Qty Seluruh Kasir', t.totalQtySeluruhKasir],
          ['Total Penjualan Seluruh Kasir', fmtRp(t.totalPenjualanSeluruhKasir)],
          ['', ''],
          ['-- Status Balance --', ''],
          ['Selisih (Penjualan - Penerimaan)', fmtRp(t.selisih)],

    // Konversi ArrayBuffer (hasil ExcelJS writeBuffer()) ke base64 string -
    // dipakai supaya XLSX yang disisipi gambar grafik bisa dikirim ke
    // server (Apps Script) sebagai lampiran email.
    function arrayBufferToBase64_(buffer) {
      let bytes = new Uint8Array(buffer);
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    async function sendFinanceReportEmailNow_(opts) {
      if (!financeReportData) return;
      const r = financeReportData;
      Swal.fire({ title: 'Menyiapkan & mengirim laporan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      loadCompanySettings(async function() {
        try {
          let payload = { dateStr: r.dateStr, recipients: opts.emails };
          if (opts.attachPdf) {
            const headerInfo = { cashierName: r.cashierName, cashierPosition: r.cashierPosition, reportDate: r.dateStr, logoUrl: r.logoUrl, nameLabel: 'Nama Petugas' };
            const chartImages = financeReportSections.chart ? collectFinanceReportChartImages_() : [];

            let doc = buildPdfDoc_('Laporan Harian Admin Keuangan', 'Tanggal Laporan: ' + fmtDate(r.dateStr), sections, headerInfo, chartImages, financeReportSections.orientation);
            payload.pdfBase64 = doc.output('datauristring').split(',')[1];
            payload.pdfFileName = 'Laporan_Keuangan_' + r.dateStr + '.pdf';
          }
          if (opts.attachXlsx) {
            // PERBAIKAN: sebelumnya pakai buildXlsxWorkbook_ (SheetJS) yang
            // TIDAK bisa menyisipkan gambar grafik sama sekali, jadi XLSX
            // hasil kirim email selalu tanpa grafik (beda dengan tombol
            // Download XLSX biasa yang sudah pakai ExcelJS). Sekarang
            // disamakan supaya XLSX yang dikirim via email juga menyertakan
            // sheet "Grafik" berisi gambar grafik, sama seperti file yang
            // diunduh langsung.
            let sheets = buildFinanceReportXlsxSheets_(r);
            const chartImagesXlsx = financeReportSections.chart ? collectFinanceReportChartImages_() : [];
            const wbEmail = new ExcelJS.Workbook();
            sheets.forEach(s => {
              const ws = wbEmail.addWorksheet((s.name || 'Sheet').substring(0, 31));
              ws.addRow(s.headers || []);
              ws.getRow(1).font = { bold: true };
              (safeRows(s.rows || [])).forEach(row => ws.addRow(row));
              ws.columns.forEach(col => { col.width = 20; });
            });
            if (chartImagesXlsx.length) {
              const chartWs = wbEmail.addWorksheet('Grafik');
              let rowCursor = 1;
              chartImagesXlsx.forEach(img => {
                if (!img.dataUrl) return;
                chartWs.getCell('A' + rowCursor).value = img.title || '';
                chartWs.getCell('A' + rowCursor).font = { bold: true, size: 12 };
                rowCursor += 1;
                try {
                  let base64 = img.dataUrl.split(',')[1];
                  let imgId = wbEmail.addImage({ base64: base64, extension: 'png' });
                  chartWs.addImage(imgId, { tl: { col: 0, row: rowCursor }, ext: { width: 480, height: 280 } });
                } catch (e) { /* kalau 1 grafik gagal disisipkan, lanjut tanpa grafik itu */ }
                rowCursor += 17;
              });
              chartWs.getColumn(1).width = 20;
            }
            const bufferEmail = await wbEmail.xlsx.writeBuffer();
            payload.xlsxBase64 = arrayBufferToBase64_(bufferEmail);
            payload.xlsxFileName = 'Laporan_Keuangan_' + r.dateStr + '.xlsx';
          }
          google.script.run.withSuccessHandler(function(res) {
            Swal.close();
            if (!res.success) return Swal.fire('Gagal Mengirim', res.message, 'error');
            Swal.fire({ icon: 'success', title: 'Terkirim', text: res.message });
          }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).sendFinanceReportEmail(payload, sessionToken);
        } catch (err) {
          Swal.close();
          Swal.fire('Gagal', 'Terjadi kesalahan menyiapkan file laporan: ' + err.message, 'error');
        }
      });
    }

    // ================= KARTU STOK =================
    // Kartu stok = buku besar pergerakan stok (masuk, keluar, saldo) untuk
    // SETIAP produk di SETIAP lokasi (Kasir Loket Masuk, Kasir Loket Wahana,
    // Kasir Resto, Gudang Utama, dst). Data dicatat otomatis oleh server
    // (sheet Stock_Card) tiap kali stok berubah - halaman ini hanya membaca.
    // Dua pintu masuk: submenu "Kartu Stok" di tiap Kasir (lokasi terkunci
    // ke outlet itu) & submenu "Kartu Stok Gudang" di Warehouse (bisa pilih
    // lokasi mana pun). Tombol ikon buku di tabel stok juga membuka kartu
    // produk tsb langsung.
    const SC_TABLE_HEADERS = ['Tanggal / Jam', 'Jenis Transaksi', 'Keterangan', 'Masuk', 'Keluar', 'Saldo', 'Oleh'];
    let SC = { warehouseId: null, fixed: true, title: '', start: '', end: '', mode: 'detail', cards: [], warehouse: null };
    let SCM = { warehouseId: null, code: null, start: '', end: '', mode: 'detail', res: null };

    $(document).on('click', '.sc-open', function() {
      openStockCardModal($(this).attr('data-wh') || SC.warehouseId, $(this).attr('data-code'));
    });

    function fmtQty_(n) { const v = Number(n); return isNaN(v) ? '-' : v.toLocaleString('id-ID', { maximumFractionDigits: 4 }); }
    function scFmtDay_(s) { return (s && s.length >= 10) ? (s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4)) : (s || '-'); }
    function scPeriodLabel_(start, end) {
      if (!start && !end) return 'Semua waktu';
      if (start && end) return scFmtDay_(start) + ' s.d. ' + scFmtDay_(end);
      return start ? ('Mulai ' + scFmtDay_(start)) : ('Sampai ' + scFmtDay_(end));
    }
    function scPresetRange_(preset) {
      const n = new Date();
      if (preset === 'today') return { start: toDateStr_(n), end: toDateStr_(n) };
      if (preset === 'week') { const s = new Date(n); s.setDate(s.getDate() - 6); return { start: toDateStr_(s), end: toDateStr_(n) }; }
      if (preset === 'lastmonth') return { start: toDateStr_(new Date(n.getFullYear(), n.getMonth() - 1, 1)), end: toDateStr_(new Date(n.getFullYear(), n.getMonth(), 0)) };
      if (preset === 'year') return { start: toDateStr_(new Date(n.getFullYear(), 0, 1)), end: toDateStr_(n) };
      if (preset === 'all') return { start: '', end: '' };
      return { start: toDateStr_(new Date(n.getFullYear(), n.getMonth(), 1)), end: toDateStr_(n) }; // month (default)
    }
    function scSafeFile_(s) { return String(s || '').replace(/[^A-Za-z0-9_-]/g, '_'); }

    // Keterangan 1 baris transaksi: lawan transaksi, produk asal (kalau lewat
    // Acuan Stok), nomor referensi, catatan, dan tanda kalau saldo sempat
    // berubah di luar aplikasi sebelum transaksi ini.
    function scNote_(r) {
      const parts = [];
      if (r.Counterpart) {
        if (r.TransactionType === 'Transfer Masuk') parts.push('Dari ' + r.Counterpart);
        else if (r.TransactionType === 'Transfer Keluar') parts.push('Ke ' + r.Counterpart);
        else parts.push(r.Counterpart);
      }
      if (r.ViaProduct) parts.push('via produk ' + r.ViaProduct);
      if (r.RefID) parts.push('Ref: ' + r.RefID);
      if (r.Notes) parts.push(r.Notes);
      if (r.Gap) parts.push('(!) stok berubah di luar aplikasi sebelum transaksi ini: ' + (r.Gap > 0 ? '+' : '') + fmtQty_(r.Gap));
      return parts.join(' | ');
    }

    // Baris tampilan kartu (dipakai tabel di layar DAN file PDF/XLSX supaya
    // isinya selalu sama). mode: 'detail' = 1 baris per transaksi,
    // 'daily' = diringkas per hari (berguna untuk produk yang sering terjual).
    function scBuildDisplayRows_(card, mode) {
      const out = [];
      out.push({ kind: 'open', tgl: 'Saldo Awal Periode', jenis: '', ket: '', masuk: '', keluar: '', saldo: card.Opening, oleh: '', warn: false });
      const rows = card.rows || [];
      if (mode === 'daily') {
        const groups = []; const idx = {};
        rows.forEach(r => {
          if (idx[r.Date] === undefined) { idx[r.Date] = groups.length; groups.push({ date: r.Date, items: [] }); }
          groups[idx[r.Date]].items.push(r);
        });
        groups.forEach(g => {
          let masuk = 0, keluar = 0, gap = 0; const types = {}, users = {}; const typeOrder = [];
          g.items.forEach(r => {
            masuk += r.Masuk; keluar += r.Keluar; gap += r.Gap;
            if (!types[r.TransactionType]) { types[r.TransactionType] = 0; typeOrder.push(r.TransactionType); }
            types[r.TransactionType]++;
            if (r.User) users[r.User] = true;
          });
          const jenis = typeOrder.map(t => t + ' x' + types[t]).join(', ');
          let ket = g.items.length + ' transaksi';
          if (gap) ket += ' | (!) ada perubahan stok di luar aplikasi: ' + (gap > 0 ? '+' : '') + fmtQty_(gap);
          out.push({ kind: 'row', tgl: scFmtDay_(g.date), jenis: jenis, ket: ket, masuk: masuk, keluar: keluar,
            saldo: g.items[g.items.length - 1].After, oleh: Object.keys(users).join(', '), warn: !!gap });
        });
      } else {
        rows.forEach(r => out.push({ kind: 'row', tgl: fmtDateTime(r.Timestamp), jenis: r.TransactionType, ket: scNote_(r),
          masuk: r.Masuk, keluar: r.Keluar, saldo: r.After, oleh: r.User, warn: !!r.Gap }));
      }
      out.push({ kind: 'total', tgl: 'Total Periode', jenis: '', ket: '', masuk: card.Masuk, keluar: card.Keluar, saldo: card.Closing, oleh: '', warn: false });
      return out;
    }
    function scExportRows_(card, mode) {
      return scBuildDisplayRows_(card, mode).map(r => [r.tgl, r.jenis, r.ket, r.masuk, r.keluar, r.saldo, r.oleh]);
    }

    // ---------- Halaman Kartu Stok (daftar semua produk di 1 lokasi) ----------

            <div class="col-6 col-md-2"><label class="form-label small mb-1">Sampai Tanggal</label><input type="date" id="sc-end" class="form-control form-control-sm" value="${esc(SC.end)}"></div>
            <div class="col-md-auto"><button class="btn btn-sm btn-primary" onclick="loadStockCardList()"><i class="fa-solid fa-magnifying-glass me-2"></i>Tampilkan</button></div>

              <label class="form-label small mb-1">Tampilan kartu</label>
              <select id="sc-mode" class="form-select form-select-sm" onchange="SC.mode=this.value">
                <option value="detail" ${SC.mode === 'detail' ? 'selected' : ''}>Rinci per transaksi</option>

            <button class="btn btn-sm btn-outline-secondary" onclick="setStockCardRange('lastmonth')">Bulan Lalu</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="setStockCardRange('year')">Tahun Ini</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="setStockCardRange('all')">Semua Waktu</button>

            <div class="form-check form-switch me-2 mb-0">
              <input class="form-check-input" type="checkbox" id="sc-only-active" checked onchange="renderStockCardTable()">
              <label class="form-check-label small" for="sc-only-active">Hanya produk yang punya catatan stok</label>

            <button class="btn btn-sm btn-outline-danger" onclick="exportStockCardList('pdf')"><i class="fa-solid fa-file-pdf me-2"></i>Rekap PDF</button>
            <button class="btn btn-sm btn-outline-success" onclick="exportStockCardList('xlsx')"><i class="fa-solid fa-file-excel me-2"></i>Rekap XLSX</button>

            <tbody id="sc-tbody"><tr><td colspan="10" class="text-center text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat data...</td></tr></tbody>

      if (!SC.fixed) {

    function setStockCardRange(preset) {
      const r = scPresetRange_(preset);
      $('#sc-start').val(r.start); $('#sc-end').val(r.end);
      loadStockCardList();
    }
    function onStockCardWarehouseChange(id) {
      SC.warehouseId = id; currentViewParam = id;
      loadStockCardList();
    }

    // Kalau Index.html sudah versi baru tapi Code.gs di Apps Script belum
    // diperbarui/di-deploy, fungsi server Kartu Stok tidak ada dan halaman
    // akan loading terus. Cek ini menampilkan penjelasan yang jelas.
    function scBackendReady_() {
      if (typeof google.script.run.getStockCardList === 'function') return true;
      $('#sc-tbody').html('<tr><td colspan="10" class="text-center text-danger">Server belum diperbarui. Lihat pesan di layar.</td></tr>');
      Swal.fire({ icon: 'error', title: 'Code.gs belum diperbarui',
        html: 'Fungsi Kartu Stok belum ada di server Apps Script. Pastikan <b>Code.gs</b> terbaru sudah ditempel &amp; disimpan, lalu buat versi baru: <b>Deploy &gt; Manage deployments &gt; Edit &gt; New version &gt; Deploy</b>. Setelah itu muat ulang halaman ini.' });
      return false;
    }

    function loadStockCardList() {
      if (!scBackendReady_()) return;
      SC.start = $('#sc-start').val() || ''; SC.end = $('#sc-end').val() || '';
      if (SC.start && SC.end && SC.start > SC.end) return Swal.fire('Perhatian', 'Tanggal awal tidak boleh lebih besar dari tanggal akhir.', 'warning');
      const wid = SC.warehouseId;
      $('#sc-tbody').html('<tr><td colspan="10" class="text-center text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat data...</td></tr>');
      google.script.run.withSuccessHandler(function(res) {
        if (wid !== SC.warehouseId) return; // lokasi sudah diganti selagi menunggu
        if (!res || !res.success) { $('#sc-tbody').html('<tr><td colspan="10" class="text-center text-danger">Gagal memuat data.</td></tr>'); return Swal.fire('Gagal', (res && res.message) || 'Tidak ada respon dari server.', 'error'); }
        SC.cards = res.cards; SC.warehouse = res.warehouse;
        $('#sc-subtitle').html('Kartu Stok &mdash; ' + esc(res.warehouse.WarehouseName) + ' &middot; Periode ' + esc(scPeriodLabel_(res.startDate, res.endDate)));
        renderStockCardTable();
      }).withFailureHandler(errHandler).getStockCardList(wid, SC.start, SC.end, sessionToken);
    }

    function scVisibleCards_() {
      const only = $('#sc-only-active').is(':checked');
      return SC.cards.filter(c => !only || c.HasRecord || c.HasHistory);
    }

    function scFlagsHtml_(c) {
      let h = '';
      if (c.Mismatch) h += ` <i class="fa-solid fa-triangle-exclamation text-warning" title="Saldo terakhir di kartu (${fmtQty_(c.LatestBalance)}) berbeda dari stok saat ini (${fmtQty_(c.Quantity)}). Stok kemungkinan diubah langsung di spreadsheet."></i>`;
      else if (c.GapTotal) h += ` <i class="fa-solid fa-circle-info text-info" title="Ada perubahan stok di luar aplikasi pada periode ini (${c.GapTotal > 0 ? '+' : ''}${fmtQty_(c.GapTotal)})."></i>`;
      return h;
    }

    function renderStockCardTable() {
      const cards = scVisibleCards_();
      let tbody = '', withMove = 0, flagged = 0;
      cards.forEach(c => {
        if (c.MovementCount > 0) withMove++;
        if (c.Mismatch || c.GapTotal) flagged++;
        const status = c.HasRecord ? stockStatusBadge_(c.Quantity, c.MinStock) : '<span class="badge bg-secondary">Belum Dicatat</span>';
        tbody += `<tr>
          <td>${esc(c.ProductCode)}</td><td>${esc(c.ProductName)}</td><td>${esc(c.Category)}</td>
          <td class="text-end" data-order="${c.Opening}">${fmtQty_(c.Opening)}</td>
          <td class="text-end text-success" data-order="${c.Masuk}">${c.Masuk ? '+' + fmtQty_(c.Masuk) : '0'}</td>
          <td class="text-end text-danger" data-order="${c.Keluar}">${c.Keluar ? '-' + fmtQty_(c.Keluar) : '0'}</td>
          <td class="text-end fw-semibold" data-order="${c.Closing}">${fmtQty_(c.Closing)}${scFlagsHtml_(c)}</td>
          <td class="text-end" data-order="${c.Quantity}">${fmtQty_(c.Quantity)}</td>
          <td>${status}</td>
          <td><button class="btn btn-sm btn-outline-primary sc-open" data-wh="${esc(SC.warehouseId)}" data-code="${esc(c.ProductCode)}" title="Buka kartu stok"><i class="fa-solid fa-book-open me-1"></i>Kartu</button></td>
        </tr>`;
      });
      if ($.fn.DataTable.isDataTable('#sc-table')) $('#sc-table').DataTable().destroy();
      $('#sc-tbody').html(tbody);
      if (!cards.length) $('#sc-tbody').html('<tr><td colspan="10" class="text-center text-muted">Belum ada produk berstok di lokasi ini.</td></tr>');
      else $('#sc-table').DataTable({ pageLength: 25, order: [[1, 'asc']], columnDefs: [{ orderable: false, targets: -1 }] });
      $('#sc-summary').html(`<strong>${cards.length}</strong> produk &middot; <strong>${withMove}</strong> punya mutasi di periode ini` +
        (flagged ? ` &middot; <span class="text-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i>${flagged} perlu dicek (stok diubah di luar aplikasi)</span>` : ''));
    }

    // ---------- Kartu 1 produk (modal) ----------
    function openStockCardModal(warehouseId, productCode) {
      const sameCtx = (SC.warehouseId === warehouseId) && (SC.start || SC.end);
      const r = sameCtx ? { start: SC.start, end: SC.end } : scPresetRange_('month');
      SCM = { warehouseId: warehouseId, code: productCode, start: r.start, end: r.end, mode: SC.mode || 'detail', res: null };
      Swal.fire({
        title: 'Kartu Stok', width: 'min(1150px, 96vw)', showConfirmButton: false, showCloseButton: true,
        customClass: { htmlContainer: 'text-start' },
        html: `
          <div id="scm-sub" class="text-muted small mb-2">Memuat kartu stok...</div>
          <div class="row g-2 align-items-end mb-3">
            <div class="col-auto"><label class="form-label small mb-1">Dari</label><input type="date" id="scm-start" class="form-control form-control-sm" value="${esc(SCM.start)}"></div>
            <div class="col-auto"><label class="form-label small mb-1">Sampai</label><input type="date" id="scm-end" class="form-control form-control-sm" value="${esc(SCM.end)}"></div>
            <div class="col-auto"><button class="btn btn-sm btn-primary" onclick="reloadStockCardModal()">Terapkan</button></div>
            <div class="col-auto"><label class="form-label small mb-1">Tampilan</label>
              <select id="scm-mode" class="form-select form-select-sm" onchange="onStockCardModeChange(this.value)">
                <option value="detail" ${SCM.mode === 'detail' ? 'selected' : ''}>Rinci per transaksi</option>
                <option value="daily" ${SCM.mode === 'daily' ? 'selected' : ''}>Ringkas per hari</option>
              </select></div>
            <div class="col text-end">
              <button class="btn btn-sm btn-outline-danger" onclick="exportStockCardModal('pdf')"><i class="fa-solid fa-file-pdf me-2"></i>PDF</button>
              <button class="btn btn-sm btn-outline-success" onclick="exportStockCardModal('xlsx')"><i class="fa-solid fa-file-excel me-2"></i>XLSX</button>
            </div>
          </div>
          <div id="scm-body"><div class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat...</div></div>`
      });
      loadStockCardModal();
    }

    function reloadStockCardModal() {
      SCM.start = $('#scm-start').val() || ''; SCM.end = $('#scm-end').val() || '';
      if (SCM.start && SCM.end && SCM.start > SCM.end) return Toast.fire({ icon: 'warning', title: 'Tanggal awal tidak boleh lebih besar dari tanggal akhir.' });
      loadStockCardModal();
    }
    function onStockCardModeChange(mode) { SCM.mode = mode; if (SCM.res) renderStockCardModalBody(); }

    function loadStockCardModal() {
      if (typeof google.script.run.getStockCard !== 'function') { $('#scm-body').html('<div class="text-danger">Code.gs di server belum diperbarui &amp; di-deploy ulang (fungsi getStockCard belum ada).</div>'); return; }
      $('#scm-body').html('<div class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat...</div>');
      const ctx = SCM.warehouseId + '|' + SCM.code;
      google.script.run.withSuccessHandler(function(res) {
        if (ctx !== SCM.warehouseId + '|' + SCM.code) return;
        if (!res || !res.success) { $('#scm-body').html('<div class="text-danger">' + esc((res && res.message) || 'Gagal memuat kartu stok.') + '</div>'); return; }
        SCM.res = res;
        renderStockCardModalBody();
      }).withFailureHandler(function(err) { $('#scm-body').html('<div class="text-danger">' + esc(err && err.message ? err.message : err) + '</div>'); })
        .getStockCard(SCM.warehouseId, SCM.code, SCM.start, SCM.end, sessionToken);
    }

    function renderStockCardModalBody() {
      const res = SCM.res, c = res.card;
      $('#scm-sub').html(`<strong class="fs-5 text-body">${esc(c.ProductName)}</strong> <span class="ms-1">(${esc(c.ProductCode)}${c.Unit ? ' &middot; satuan ' + esc(c.Unit) : ''})</span><br>` +
        `${esc(res.warehouse.WarehouseName)} &middot; Periode ${esc(scPeriodLabel_(res.startDate, res.endDate))}`);
      const chip = (label, val, cls) => `<div class="col-6 col-md"><div class="border rounded p-2 h-100"><div class="small text-muted">${label}</div><div class="fs-5 fw-bold ${cls || ''}">${val}</div></div></div>`;
      let notices = '';
      if (res.viaRef) notices += `<div class="alert alert-info py-2 small mb-2"><i class="fa-solid fa-link me-2"></i>Produk <strong>${esc(res.viaRef)}</strong> memakai stok produk acuan, jadi kartu yang tampil adalah kartu <strong>${esc(c.ProductCode)}</strong>. Penjualan ${esc(res.viaRef)} tercatat di sini dengan keterangan "via produk".</div>`;
      if (c.Mismatch) notices += `<div class="alert alert-warning py-2 small mb-2"><i class="fa-solid fa-triangle-exclamation me-2"></i>Saldo terakhir di kartu (<strong>${fmtQty_(c.LatestBalance)}</strong>) berbeda dari stok saat ini (<strong>${fmtQty_(c.Quantity)}</strong>). Kemungkinan stok diubah langsung di spreadsheet, di luar aplikasi.</div>`;
      if (!c.HasHistory) notices += `<div class="alert alert-secondary py-2 small mb-2"><i class="fa-solid fa-circle-info me-2"></i>Belum ada pergerakan stok yang tercatat untuk produk ini. Kartu stok mulai terisi sejak fitur ini aktif.</div>`;
      const rows = scBuildDisplayRows_(c, SCM.mode);
      let body = '';
      rows.forEach(r => {
        const masuk = r.masuk === '' ? '' : (r.masuk ? '<span class="text-success fw-semibold">+' + fmtQty_(r.masuk) + '</span>' : '0');
        const keluar = r.keluar === '' ? '' : (r.keluar ? '<span class="text-danger fw-semibold">-' + fmtQty_(r.keluar) + '</span>' : '0');
        const cls = r.kind === 'open' ? 'table-light fw-semibold' : (r.kind === 'total' ? 'table-secondary fw-bold' : (r.warn ? 'table-warning' : ''));
        body += `<tr class="${cls}"><td class="text-nowrap">${esc(r.tgl)}</td><td>${esc(r.jenis)}</td><td class="small">${esc(r.ket)}</td>
          <td class="text-end">${masuk}</td><td class="text-end">${keluar}</td><td class="text-end fw-semibold">${fmtQty_(r.saldo)}</td><td class="small">${esc(r.oleh)}</td></tr>`;
      });
      $('#scm-body').html(`
        <div class="row g-2 mb-3">
          ${chip('Saldo Awal', fmtQty_(c.Opening))}
          ${chip('Total Masuk', '+' + fmtQty_(c.Masuk), 'text-success')}
          ${chip('Total Keluar', '-' + fmtQty_(c.Keluar), 'text-danger')}
          ${chip('Saldo Akhir', fmtQty_(c.Closing))}
          ${chip('Stok Saat Ini', fmtQty_(c.Quantity))}
        </div>
        ${notices}
        <div class="table-responsive" style="max-height:52vh;overflow-y:auto">
          <table class="table table-sm table-hover align-middle mb-0">
            <thead class="table-dark" style="position:sticky;top:0"><tr><th>Tanggal / Jam</th><th>Jenis Transaksi</th><th>Keterangan</th><th class="text-end">Masuk</th><th class="text-end">Keluar</th><th class="text-end">Saldo</th><th>Oleh</th></tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>`);
    }

    // ---------- Export ----------
    function scCardTitleInfo_(card, warehouse, start, end) {
      return {
        title: 'Kartu Stok - ' + card.ProductName,
        subtitle: 'Lokasi: ' + warehouse.WarehouseName + ' | Kode: ' + card.ProductCode + (card.Unit ? ' | Satuan: ' + card.Unit : '') + ' | Periode: ' + scPeriodLabel_(start, end)
      };
    }
    function scCardSheet_(card, warehouse, mode, start, end) {
      const info = scCardTitleInfo_(card, warehouse, start, end);
      const aoa = [[info.title], [info.subtitle], [], SC_TABLE_HEADERS].concat(scExportRows_(card, mode));
      const ws = XLSX.utils.aoa_to_sheet(safeRows(aoa));
      ws['!cols'] = [{ wch: 20 }, { wch: 30 }, { wch: 50 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 18 }];
      return ws;
    }
    function scUniqueSheetName_(code, used) {
      const base = (String(code).replace(/[\[\]:*?\/\\]/g, '_').substring(0, 27)) || 'Produk';
      let name = base, i = 2;
      while (used[name.toLowerCase()]) { name = base.substring(0, 24) + '_' + i; i++; }
      used[name.toLowerCase()] = true;
      return name;
    }

    function exportStockCardModal(format) {
      if (!SCM.res) return;
      const c = SCM.res.card, w = SCM.res.warehouse;
      const fileBase = 'KartuStok_' + scSafeFile_(w.WarehouseID) + '_' + scSafeFile_(c.ProductCode);
      try {
        if (format === 'pdf') {
          loadCompanySettings(function() {
            const info = scCardTitleInfo_(c, w, SCM.res.startDate, SCM.res.endDate);
            exportToPdf(fileBase + '.pdf', info.title, info.subtitle, [{ headers: SC_TABLE_HEADERS, rows: scExportRows_(c, SCM.mode) }], null, null, 'portrait');
            Toast.fire({ icon: 'success', title: 'File berhasil diunduh' });
          });
        } else {
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, scCardSheet_(c, w, SCM.mode, SCM.res.startDate, SCM.res.endDate), scUniqueSheetName_(c.ProductCode, {}));
          XLSX.writeFile(wb, fileBase + '.xlsx');
          Toast.fire({ icon: 'success', title: 'File berhasil diunduh' });
        }
      } catch (err) { Swal.fire('Gagal Membuat File', 'Terjadi kesalahan: ' + err.message, 'error'); }
    }

    function exportStockCardList(format) {
      const cards = scVisibleCards_();
      if (!SC.warehouse || !cards.length) return Swal.fire('Perhatian', 'Belum ada data kartu stok untuk diexport.', 'warning');
      const headers = ['Kode', 'Produk', 'Kategori', 'Saldo Awal', 'Masuk', 'Keluar', 'Saldo Akhir', 'Stok Saat Ini'];
      const rows = cards.map(c => [c.ProductCode, c.ProductName, c.Category, c.Opening, c.Masuk, c.Keluar, c.Closing, c.Quantity]);
      const title = 'Rekap Kartu Stok - ' + SC.warehouse.WarehouseName;
      const subtitle = 'Periode: ' + scPeriodLabel_(SC.start, SC.end);
      const fileBase = 'RekapKartuStok_' + scSafeFile_(SC.warehouseId);
      Swal.fire({ title: 'Menyiapkan file...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      loadCompanySettings(function() {
        Swal.close();
        if (format === 'pdf') exportToPdf(fileBase + '.pdf', title, subtitle, [{ headers: headers, rows: rows }], null, null, 'portrait');
        else exportToXlsx(fileBase + '.xlsx', 'Rekap Kartu Stok', headers, rows);
        Toast.fire({ icon: 'success', title: 'File berhasil diunduh' });
      });
    }

    // Semua kartu sekaligus: PDF = 1 bagian per produk, XLSX = 1 sheet per
    // produk (+ sheet Rekap di depan).
    function exportAllStockCards(format) {
      if (typeof google.script.run.getStockCardsBulk !== 'function') return Swal.fire('Code.gs belum diperbarui', 'Fungsi getStockCardsBulk belum ada di server. Deploy ulang Code.gs terbaru.', 'error');
      const wid = SC.warehouseId, mode = SC.mode || 'detail';
      const only = $('#sc-only-active').is(':checked');
      Swal.fire({ title: 'Menyiapkan semua kartu stok...', text: 'Mohon tunggu, ini bisa memakan waktu kalau produknya banyak.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      loadCompanySettings(function() {
        google.script.run.withSuccessHandler(function(res) {
          Swal.close();
          if (!res || !res.success) return Swal.fire('Gagal', (res && res.message) || 'Tidak ada respon dari server.', 'error');
          const cards = res.cards.filter(c => !only || c.HasRecord || c.HasHistory);
          if (!cards.length) return Swal.fire('Perhatian', 'Belum ada kartu stok untuk diexport.', 'warning');
          const w = res.warehouse;
          const fileBase = 'SemuaKartuStok_' + scSafeFile_(w.WarehouseID);
          try {
            if (format === 'pdf') {
              const sections = cards.map(c => ({
                heading: c.ProductCode + ' - ' + c.ProductName + (c.Unit ? ' (' + c.Unit + ')' : ''),
                headers: SC_TABLE_HEADERS, rows: scExportRows_(c, mode)
              }));
              exportToPdf(fileBase + '.pdf', 'Kartu Stok Semua Produk - ' + w.WarehouseName, 'Periode: ' + scPeriodLabel_(res.startDate, res.endDate), sections, null, null, 'portrait');
            } else {
              const wb = XLSX.utils.book_new();
              const recap = [['Rekap Kartu Stok - ' + w.WarehouseName], ['Periode: ' + scPeriodLabel_(res.startDate, res.endDate)], [],
                ['Kode', 'Produk', 'Kategori', 'Saldo Awal', 'Masuk', 'Keluar', 'Saldo Akhir', 'Stok Saat Ini']]
                .concat(cards.map(c => [c.ProductCode, c.ProductName, c.Category, c.Opening, c.Masuk, c.Keluar, c.Closing, c.Quantity]));
              const wsRecap = XLSX.utils.aoa_to_sheet(safeRows(recap));
              wsRecap['!cols'] = [{ wch: 14 }, { wch: 36 }, { wch: 18 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 14 }];
              const used = {};
              XLSX.utils.book_append_sheet(wb, wsRecap, scUniqueSheetName_('Rekap', used));
              cards.forEach(c => XLSX.utils.book_append_sheet(wb, scCardSheet_(c, w, mode, res.startDate, res.endDate), scUniqueSheetName_(c.ProductCode, used)));
              XLSX.writeFile(wb, fileBase + '.xlsx');
            }
            Toast.fire({ icon: 'success', title: 'File berhasil diunduh (' + cards.length + ' kartu)' });
          } catch (err) { Swal.fire('Gagal Membuat File', 'Terjadi kesalahan: ' + err.message, 'error'); }
        }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).getStockCardsBulk(wid, SC.start, SC.end, sessionToken);
      });
    }

    function renderMenuConfigView(area) {
      area.html(`

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
