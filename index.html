<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wonderland Samarinda - Cashier Report System</title>
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wonderland">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <style>
    /* Select2 (dropdown pencarian Pos Biaya/COA & Pos Penggunaan) disesuaikan
       tinggi & tampilannya supaya senada dengan .form-select Bootstrap. */
    .select2-container .select2-selection--single { height: 38px !important; display: flex; align-items: center; border: 1px solid #ced4da !important; border-radius: .375rem !important; }
    .select2-container .select2-selection--single .select2-selection__rendered { line-height: 1.4 !important; padding-left: 12px !important; }
    .select2-container .select2-selection--single .select2-selection__arrow { height: 36px !important; }
    .select2-dropdown { z-index: 20000 !important; }
    body.dark-mode .select2-container .select2-selection--single { background-color: #111827 !important; border-color: #374151 !important; color: #f1f5f9 !important; }
    body.dark-mode .select2-container .select2-selection--single .select2-selection__rendered { color: #f1f5f9 !important; }
    body.dark-mode .select2-dropdown { background-color: #111827 !important; border-color: #374151 !important; color: #f1f5f9 !important; }
    body.dark-mode .select2-search__field { background-color: #1f2937 !important; color: #f1f5f9 !important; }
    body.dark-mode .select2-results__option { color: #f1f5f9 !important; }
    body.dark-mode .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: var(--primary-color) !important; }
    /* Badge "Lunas - Rekening PT" pakai orange supaya beda dengan "Lunas -
       Brangkas" (hijau/bg-success) dan "Belum Lunas" (merah/bg-danger). */
    .badge-orange { background-color: #fd7e14 !important; color: #fff !important; }
    :root {
      --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b;
      --sidebar-bg: #0f172a; --sidebar-color: #cbd5e1; --sidebar-hover: #1e293b; --primary-color: #0284c7;
    }
    body.dark-mode {
      --bg-color: #090d16; --card-bg: #111827; --text-color: #f1f5f9;
      --sidebar-bg: #030712; --sidebar-color: #9ca3af; --sidebar-hover: #1f2937; --primary-color: #38bdf8;
    }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
    .auth-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%); }
    .auth-card { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 12px; border: none; }
    #main-app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 270px; background-color: var(--sidebar-bg); color: var(--sidebar-color); display: flex; flex-direction: column; transition: all .3s ease; z-index: 100; }
    #sidebar.collapsed { width: 70px; }
    #sidebar.collapsed .nav-text, #sidebar.collapsed .sidebar-brand span, #sidebar.collapsed .chevron { display:none; }
    #sidebar .sidebar-brand { padding: 20px; font-size: 1.05rem; font-weight: bold; color: #fff; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
    #sidebar .sidebar-brand img { height: 28px; }
    #sidebar .nav-links { list-style: none; padding: 12px 10px; margin: 0; overflow-y: auto; flex-grow: 1; }
    #sidebar .nav-links a { display: flex; align-items: center; gap: 12px; padding: 11px 15px; color: var(--sidebar-color); text-decoration: none; border-radius: 8px; margin-bottom: 3px; font-weight: 500; transition: all .2s; cursor: pointer; }
    #sidebar .nav-links a:hover, #sidebar .nav-links a.active { background-color: var(--sidebar-hover); color: #fff; }
    #sidebar .submenu { list-style: none; padding-left: 18px; margin: 0; }
    #sidebar .submenu a { padding: 8px 15px; font-size: .9rem; font-weight: 400; }
    #sidebar .menu-group-label { padding: 14px 15px 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
    #content-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .navbar-top { background-color: var(--card-bg); border-bottom: 1px solid rgba(0,0,0,.08); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:10; }
    .card { background-color: var(--card-bg); color: var(--text-color); border: 1px solid rgba(0,0,0,.05); border-radius: 10px; }
    .metric-card h6 { color: #64748b; font-size: .75rem; text-transform: uppercase; }
    .badge-role { font-size: .7rem; }
    .table { color: var(--text-color); }
    .chevron { margin-left: auto; transition: transform .2s; }
    #logo-preview { max-height: 60px; max-width: 180px; }

    /* --- Diagnostic & Perbaikan Database: tabel status bersih ala screenshot --- */
    .btn-db-repair { background-color: #f2994a; border-color: #f2994a; color: #fff; }
    .btn-db-repair:hover, .btn-db-repair:focus { background-color: #e2823a; border-color: #e2823a; color: #fff; }
    .db-diag-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .db-diag-table thead th {
      text-transform: uppercase; font-size: .68rem; letter-spacing: .05em; font-weight: 700;
      color: #94a3b8; text-align: left; padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,.08);
      white-space: nowrap;
    }
    .db-diag-table tbody td { padding: 11px 14px; border-bottom: 1px solid rgba(0,0,0,.05); vertical-align: middle; }
    .db-diag-table tbody tr:last-child td { border-bottom: none; }
    .db-diag-table tbody td:first-child { text-transform: uppercase; letter-spacing: .02em; font-weight: 600; }
    body.dark-mode .db-diag-table thead th { color: #64748b; border-bottom-color: rgba(255,255,255,.08); }
    body.dark-mode .db-diag-table tbody td { border-bottom-color: rgba(255,255,255,.06); }
    .db-pill { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: .7rem; font-weight: 700; line-height: 1.6; }
    .db-pill-ok { background: #dcfce7; color: #16a34a; }
    .db-pill-danger { background: #fee2e2; color: #dc2626; }
    .db-pill-warn { background: #fef9c3; color: #ca8a04; }
    .db-pill-neutral { background: #e2e8f0; color: #475569; }
    body.dark-mode .db-pill-ok { background: rgba(22,163,74,.18); color: #4ade80; }
    body.dark-mode .db-pill-danger { background: rgba(220,38,38,.18); color: #f87171; }
    body.dark-mode .db-pill-warn { background: rgba(202,138,4,.18); color: #facc15; }
    body.dark-mode .db-pill-neutral { background: rgba(148,163,184,.18); color: #cbd5e1; }
    .db-issue-item { border: 1px solid rgba(0,0,0,.07); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    body.dark-mode .db-issue-item { border-color: rgba(255,255,255,.08); }

    /* --- Laporan Penjualan: tampilan Kasir ala mesin POS --- */
    [id^="sales-subtab-"] .nav-link { cursor: pointer; color: var(--text-color); font-weight: 600; }
    [id^="sales-subtab-"] .nav-link.active { background-color: var(--primary-color); color: #fff; }
    .pos-product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
      max-height: 64vh; overflow-y: auto; padding: 2px 4px 2px 2px;
    }
    .pos-product-card {
      border: 1px solid rgba(0,0,0,.08); border-radius: 10px; padding: 12px; cursor: pointer;
      background: var(--card-bg); transition: transform .12s, box-shadow .12s, border-color .12s;
      display: flex; flex-direction: column; gap: 4px; min-height: 88px; user-select: none;
    }
    .pos-product-card:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.1); }
    .pos-product-card:active { transform: translateY(0); box-shadow: none; }
    .pos-product-name { font-weight: 700; font-size: .85rem; line-height: 1.25; }
    .pos-product-variant { font-size: .72rem; color: #64748b; }
    .pos-product-category { font-size: .65rem; text-transform: uppercase; letter-spacing: .03em; color: #94a3b8; }
    .pos-product-price { font-weight: 700; color: var(--primary-color); font-size: .82rem; margin-top: auto; }
    body.dark-mode .pos-product-card { border-color: rgba(255,255,255,.08); }
    .pos-cat-btn { white-space: nowrap; }
    .pos-cart-card { display: flex; flex-direction: column; }
    .pos-cart-list { max-height: 34vh; overflow-y: auto; }
    .pos-cart-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 8px 2px; border-bottom: 1px solid rgba(0,0,0,.06); }
    .pos-cart-item:last-child { border-bottom: none; }
    body.dark-mode .pos-cart-item { border-bottom-color: rgba(255,255,255,.08); }
    .pos-cart-item-main { min-width: 0; }
    .pos-cart-item-main .fw-bold { overflow-wrap: anywhere; }
    .pos-cart-remove { line-height: 1; }
  /* ===== PWA / MOBILE ===== */
    html, body { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
    #main-app, .auth-wrapper { height: 100vh; height: 100dvh; }
    #sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1040; }
    @media (max-width: 991.98px) {
      #sidebar { position: fixed; top:0; left:0; bottom:0; width: 280px !important; max-width: 85vw; transform: translateX(-100%); transition: transform .3s ease; z-index: 1050; padding-top: env(safe-area-inset-top); }
      #sidebar.open { transform: translateX(0); }
      #sidebar.collapsed .nav-text, #sidebar.collapsed .sidebar-brand span, #sidebar.collapsed .chevron { display: initial; }
      #sidebar-backdrop.show { display:block; }
      .navbar-top { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); gap: 8px; }
      #content-wrapper { min-width: 0; }
      #content-wrapper .container-fluid, #content-wrapper main, .content-area { padding-left: 12px !important; padding-right: 12px !important; }
      .modal-dialog { margin: .5rem; max-width: calc(100vw - 1rem); }
      .modal-dialog.modal-xl, .modal-dialog.modal-lg { max-width: calc(100vw - 1rem); }
      .table-responsive, .dataTables_wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .dataTables_wrapper .row > div { width: 100%; text-align: left !important; }
      .dataTables_filter input { width: 100% !important; margin-left: 0 !important; }
      table.dataTable { font-size: .85rem; }
      .btn, .form-control, .form-select { min-height: 40px; }
      .form-control, .form-select, .select2-search__field { font-size: 16px; } /* cegah zoom iOS */
      .card-body { padding: .85rem; }
      h3, .h3 { font-size: 1.3rem; } h4, .h4 { font-size: 1.15rem; }
      .swal2-popup { width: 92vw !important; max-width: 92vw; }
      .select2-container { max-width: 100%; }
    }
    @media (max-width: 575.98px) {
      .auth-card { margin: 0 14px; }
      .btn-toolbar, .d-flex.gap-2 { flex-wrap: wrap; }
    }
    /* --- Grid input Pengeluaran Harian --- */
    #fe-grid-modal .modal-content { background: var(--card-bg); color: var(--text-color); }
    #fe-grid-modal .fe-grid-wrap { border: 1px solid rgba(0,0,0,.1); border-radius: 10px; }
    #fe-grid-modal .fe-grid { min-width: 1500px; }
    #fe-grid-modal .fe-grid thead th { position: sticky; top: 0; z-index: 2; background: var(--card-bg); font-size: .72rem; letter-spacing: .04em; white-space: nowrap; }
    #fe-grid-modal .fe-grid td { padding: 4px; }
    #fe-grid-modal .select2-container .select2-selection--single { height: 38px; display:flex; align-items:center; }
    #fe-grid-modal .select2-container--default .select2-selection--single .select2-selection__arrow { height: 36px; }
    #fe-grid-modal .select2-dropdown { z-index: 1065; }
    .select2-container--open { z-index: 1065; }
    #install-btn { display:none; }

  </style>
</head>
<body class="light-mode">
  <div id="app">
    <!-- LOGIN VIEW -->
    <div id="login-view" class="auth-wrapper">
      <div class="card shadow-lg p-4 auth-card">
        <div class="text-center mb-4">
          <img id="login-logo" src="" style="display:none;max-height:60px;" class="mb-2">
          <i id="login-logo-icon" class="fa-solid fa-water-ladder fa-3x text-primary mb-2"></i>
          <h3 class="fw-bold">Wonderland Samarinda</h3>
          <p class="text-muted">Silakan login untuk masuk ke sistem</p>
        </div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
              <input type="text" id="login-username" class="form-control" required autocomplete="username">

          </div>
          <div class="mb-3">

          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="fa-solid fa-right-to-bracket me-2"></i> LOGIN
          </button>
        </form>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="sidebar-backdrop"></div>
    <div id="main-app" class="d-none">
      <nav id="sidebar">
        <div class="sidebar-brand">
          <img id="sidebar-logo" src="" style="display:none;">
          <i id="sidebar-logo-icon" class="fa-solid fa-water-ladder text-info"></i>
          <span>Wonderland System</span>
        </div>
        <ul class="nav-links" id="nav-links"></ul>
      </nav>
      <div id="content-wrapper">
        <div class="navbar-top">
          <button class="btn btn-sm btn-outline-secondary" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-primary" id="global-refresh-btn" onclick="refreshCurrentView()" title="Sinkronkan data terbaru dari spreadsheet database">
              <i class="fa-solid fa-rotate"></i> <span class="d-none d-md-inline">Refresh Data</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="toggleDarkMode()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
            <span class="fw-bold" id="logged-user-name">-</span>
            <span class="badge bg-primary badge-role" id="logged-user-role">-</span>
          </div>
        </div>
        <div class="container-fluid p-4" id="main-content-area"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="config.js"></script>
  <script src="gas-bridge.js"></script>
  <script>
    // CATATAN v3.0.1: fungsi fmtDate() di bawah sudah kompatibel dengan
    // string tanggal ISO (bukan cuma objek Date), jadi tidak ada perubahan
    // fungsional yang diperlukan di file ini untuk perbaikan bug "data
    // tersimpan tapi tidak tampil" - perbaikannya murni di Code.gs
    // (getSheetDataAsObjects_ sekarang mengirim tanggal sebagai string ISO,
    // bukan objek Date mentah, karena google.script.run tidak bisa
    // mengirim objek Date balik ke client tanpa gagal diam-diam).
    let currentUser = null;
    let sessionToken = null;
    let currentView = 'dashboard';
    let currentViewParam = null;
    const SESSION_STORAGE_KEY = 'wonderland_session_token';

    let UNIT_LABEL = { Entrance: 'Kasir Loket Masuk', Ride: 'Kasir Loket Wahana', Resto: 'Kasir Resto' };
    let UNIT_ICON = { Entrance: 'fa-ticket', Ride: 'fa-ferris-wheel', Resto: 'fa-utensils' };
    // ================= KUSTOMISASI NAMA & IKON MENU/SUBMENU SIDEBAR =================
    // Diisi dari server (getMenuConfig) sesaat setelah login - lihat
    // loadMenuConfig(). mLabel()/mIcon() dipakai di renderSidebar() supaya
    // kalau Owner belum pernah mengubah apapun (menuConfig masih kosong),
    // tampilan tetap sama seperti sebelumnya (pakai `fallback`).
    let menuConfig = {};
    function mLabel(key, fallback) { return (menuConfig[key] && menuConfig[key].label) ? menuConfig[key].label : fallback; }
    function mIcon(key, fallback) { return (menuConfig[key] && menuConfig[key].icon) ? menuConfig[key].icon : fallback; }
    function loadMenuConfig(cb) {
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.success) {
          menuConfig = res.config;
          UNIT_LABEL = { Entrance: mLabel('unit_Entrance', UNIT_LABEL.Entrance), Ride: mLabel('unit_Ride', UNIT_LABEL.Ride), Resto: mLabel('unit_Resto', UNIT_LABEL.Resto) };
          UNIT_ICON = { Entrance: mIcon('unit_Entrance', UNIT_ICON.Entrance), Ride: mIcon('unit_Ride', UNIT_ICON.Ride), Resto: mIcon('unit_Resto', UNIT_ICON.Resto) };
        }
        if (cb) cb();
      }).withFailureHandler(function() { if (cb) cb(); }).getMenuConfig(sessionToken);
    }
    // Modul Warehouse: gudang internal (tanpa kasir/POS) & ikon per gudang.
    const INTERNAL_WAREHOUSE_IDS_CLIENT = ['WH05', 'WH06', 'WH07', 'WH08'];
    const WAREHOUSE_ICON = { WH01: 'fa-warehouse', WH02: 'fa-ticket', WH03: 'fa-ferris-wheel', WH04: 'fa-utensils',
      WH05: 'fa-person-swimming', WH06: 'fa-screwdriver-wrench', WH07: 'fa-broom', WH08: 'fa-kitchen-set' };
    // Daftar untuk submenu sidebar "Warehouse" (harus sinkron dengan
    // CANONICAL_WAREHOUSES_ di Code.gs) - id & label dipakai supaya klik
    // submenu langsung membuka Detail & Stok gudang tsb.
    const WAREHOUSE_SUBMENU_LIST_CLIENT = [
      { id: 'WH01', label: 'Gudang Utama' },
      { id: 'WH02', label: 'Gudang Kasir Loket Masuk' },
      { id: 'WH03', label: 'Gudang Kasir Loket Wahana' },
      { id: 'WH04', label: 'Gudang Kasir Resto' },
      { id: 'WH05', label: 'Gudang Kolam Renang' },
      { id: 'WH06', label: 'Gudang Teknisi' },
      { id: 'WH08', label: 'Gudang Dapur' },
      { id: 'WH07', label: 'Gudang Cleaning Service' }
    ];
    // Tipe Produk sekarang master data yang bisa diatur sendiri (lihat menu
    // Kategori & Metode Pembayaran) - array ini cuma fallback default
    // sebelum berhasil dimuat dari server, isinya di-refresh oleh
    // loadProductTypeNames_() setiap kali modul Warehouse dibuka.
    let WAREHOUSE_ITEM_TYPES_CLIENT = ['Konsumsi', 'Peralatan', 'Bahan', 'Lainnya'];
    const HAS_SERIAL = { Entrance: true, Ride: true, Resto: false };
    // WarehouseID gudang tiap outlet kasir (harus sinkron dengan UNIT_MAP di
    // Code.gs) - dipakai menu Kartu Stok.
    const UNIT_WAREHOUSE_ID_CLIENT = { Entrance: 'WH02', Ride: 'WH03', Resto: 'WH04' };

    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2800, timerProgressBar: true });
    function fmtRp(n) { return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID'); }
    // Escape teks bebas dari user (nama produk, catatan, dsb) sebelum
    // dimasukkan ke HTML, supaya karakter seperti tanda kutip/petik (' " )
    // tidak merusak markup tabel - inilah penyebab data "sudah tersimpan di
    // spreadsheet tapi tidak tampak di web" yang sering terjadi begitu ada
    // input teks bebas yang mengandung tanda kutip.
    function esc(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function updateRpPreview(el, previewId) {
      let n = Number(el.value) || 0;
      let target = document.getElementById(previewId);
      if (target) target.textContent = fmtRp(n);
    }
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString('id-ID') : '-'; }
    // Badge status stok yang konsisten dipakai di seluruh halaman (Manajemen
    // Stok outlet, Detail Gudang, dsb): "Stok Habis" (merah tua) kalau qty
    // benar-benar 0, "Stok Menipis" (merah) kalau qty > 0 tapi <= ambang
    // batas minimum, selain itu "Aman" (hijau). Dicek berurutan: Habis lebih
    // spesifik/prioritas daripada Menipis walau qty 0 juga <= MinStock.
    function stockStatusBadge_(qty, minStock) {
      let q = Number(qty) || 0;
      let min = Number(minStock) || 0;
      if (q === 0) return '<span class="badge bg-dark">Stok Habis</span>';
      if (q <= min) return '<span class="badge bg-danger">Stok Menipis</span>';
      return '<span class="badge bg-success">Aman</span>';
    }
    // Dipakai untuk kolom Tanggal riwayat yang perlu jam-menit juga (mis.
    // Riwayat Transfer Stok Antar Gudang), bukan cuma tanggalnya saja.
    function fmtDateTime(d) { return d ? new Date(d).toLocaleString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; }
    function todayStr() { return new Date().toISOString().slice(0, 10); }

    // ================= EXPORT XLSX/PDF (CLIENT-SIDE) =================
    // Dibuat langsung di browser pakai SheetJS & jsPDF supaya tidak
    // bergantung pada izin Drive/OAuth Google Apps Script yang sering
    // bikin export gagal (blank/hang). Pola sama seperti aplikasi
    // Manajemen Stok Gudang yang sudah terbukti jalan.
    // Semua sel dipaksa jadi teks/angka aman (bukan Date/objek/undefined)
    // sebelum masuk ke jsPDF/SheetJS, supaya export tidak gagal diam-diam
    // begitu ada data asli (khususnya tanggal/nilai kosong).
    function safeCell(v) {
      if (v === null || v === undefined) return '';
      if (v instanceof Date) return v.toLocaleDateString('id-ID');
      return v;
    }
    function safeRows(rows) { return rows.map(r => r.map(safeCell)); }

    function exportToXlsx(fileName, sheetName, headers, rows) {
      try {
        let ws = XLSX.utils.aoa_to_sheet([headers, ...safeRows(rows)]);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, (sheetName || 'Data').substring(0, 31));
        XLSX.writeFile(wb, fileName);
      } catch (err) {
        Swal.fire('Gagal Membuat File', 'Terjadi kesalahan saat membuat XLSX: ' + err.message, 'error');
      }
    }

    function buildXlsxWorkbook_(sheets) {
      // sheets: [{ name, headers, rows }]
      let wb = XLSX.utils.book_new();
      sheets.forEach(s => {
        let ws = XLSX.utils.aoa_to_sheet([s.headers, ...safeRows(s.rows)]);
        XLSX.utils.book_append_sheet(wb, ws, (s.name || 'Sheet').substring(0, 31));
      });
      return wb;
    }

    function exportMultiSheetXlsx(fileName, sheets) {
      try {
        let wb = buildXlsxWorkbook_(sheets);
        XLSX.writeFile(wb, fileName);
      } catch (err) {
        Swal.fire('Gagal Membuat File', 'Terjadi kesalahan saat membuat XLSX: ' + err.message, 'error');
      }
    }

    // Sama seperti exportMultiSheetXlsx, TAPI juga menyisipkan gambar grafik
    // (PNG hasil Chart.js) ke dalam sheet "Grafik" - dipakai untuk Report
    // Admin Keuangan & Report Kasir supaya grafik (bukan cuma angka mentah)
    // ikut masuk ke file XLSX yang diunduh. Pakai ExcelJS (bukan SheetJS)
    // karena SheetJS versi gratis tidak bisa menyisipkan gambar ke sheet.
    async function exportMultiSheetXlsxWithCharts_(fileName, sheets, chartImages) {
      try {
        const wb = new ExcelJS.Workbook();
        (sheets || []).forEach(s => {
          const ws = wb.addWorksheet((s.name || 'Sheet').substring(0, 31));
          ws.addRow(s.headers || []);
          ws.getRow(1).font = { bold: true };
          (safeRows(s.rows || [])).forEach(r => ws.addRow(r));
          ws.columns.forEach(col => { col.width = 20; });
        });
        if (chartImages && chartImages.length) {
          const chartWs = wb.addWorksheet('Grafik');
          let rowCursor = 1;
          chartImages.forEach(img => {
            if (!img.dataUrl) return;
            chartWs.getCell('A' + rowCursor).value = img.title || '';
            chartWs.getCell('A' + rowCursor).font = { bold: true, size: 12 };
            rowCursor += 1;
            try {
              let base64 = img.dataUrl.split(',')[1];
              let imgId = wb.addImage({ base64: base64, extension: 'png' });
              chartWs.addImage(imgId, { tl: { col: 0, row: rowCursor }, ext: { width: 480, height: 280 } });
            } catch (e) { /* kalau 1 grafik gagal disisipkan, lanjut tanpa grafik itu */ }
            rowCursor += 17;
          });
          chartWs.getColumn(1).width = 20;
        }
        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (err) {
        Swal.fire('Gagal Membuat File', 'Terjadi kesalahan saat membuat XLSX: ' + err.message, 'error');
      }
    }

    function buildPdfDoc_(title, subtitle, sections, headerInfo, chartImages, orientation) {
      // sections: [{ heading, headers, rows, totalLabel, totalValue }]
      // headerInfo (opsional): { cashierName, cashierPosition, reportDate, logoUrl }
      // chartImages (opsional): [{ title, dataUrl }] - ditampilkan sebagai gambar
      // sebelum sections (dipakai untuk grafik Report Admin Keuangan).
      // orientation (opsional): 'portrait' atau 'landscape' (default). Dipakai
      // supaya Admin Keuangan/Kasir bisa memilih ukuran kertas A4 Potrait
      // (lebih hemat kertas/halaman lebih sedikit untuk tabel yang tidak
      // terlalu banyak kolom) atau A4 Landscape (lebih lega untuk tabel
      // dengan banyak kolom, mis. Laporan Penjualan Kasir Loket Masuk yang
      // punya kolom No. Seri).
      {
        const { jsPDF } = window.jspdf;
        let doc = new jsPDF({ orientation: orientation === 'portrait' ? 'portrait' : 'landscape', unit: 'pt', format: 'a4' });
        let leftX = 40;
        let y = 34;
        let logoUrl = (headerInfo && headerInfo.logoUrl) || companySettings.LOGO_URL;

        // Logo perusahaan (kalau ada), disimpan sebagai data URL PNG/JPG
        if (logoUrl && logoUrl.indexOf('data:image') === 0) {
          try {
            let logoFormat = logoUrl.indexOf('image/png') !== -1 ? 'PNG' : 'JPEG';
            doc.addImage(logoUrl, logoFormat, leftX, y, 40, 40);
            leftX = 90;
          } catch (e) { /* kalau gagal render logo, lanjut tanpa logo */ }
        }

        doc.setFontSize(13); doc.setFont(undefined, 'bold');
        doc.text(companySettings.COMPANY_NAME || 'Wonderland Samarinda', leftX, y + 12);
        doc.setFontSize(9); doc.setFont(undefined, 'normal');
        doc.text(companySettings.ADDRESS || '-', leftX, y + 26);
        doc.setFontSize(11); doc.setFont(undefined, 'bold');
        doc.text(String(title || ''), leftX, y + 42);
        doc.setFontSize(9); doc.setFont(undefined, 'normal');
        let subY = y + 56;
        if (subtitle) { doc.text(String(subtitle), leftX, subY); subY += 12; }
        // Nama Kasir & Posisi Kasir (Loket Masuk/Kasir Resto/Kasir Loket
        // Wahana), lalu tanggal & jam dicetak - sesuai permintaan header report.
        if (headerInfo && (headerInfo.cashierName || headerInfo.cashierPosition)) {
          let nameLabel = headerInfo.nameLabel || 'Nama Kasir';
          doc.text(nameLabel + ': ' + (headerInfo.cashierName || '-') + '   |   Posisi: ' + (headerInfo.cashierPosition || '-'), leftX, subY);
          subY += 12;
        }
        doc.text('Dicetak: ' + new Date().toLocaleString('id-ID'), leftX, subY);

        y = Math.max(y + 60, subY + 14);

        if (chartImages && chartImages.length) {
          doc.setFontSize(10); doc.setFont(undefined, 'bold');
          doc.text('Grafik', 40, y);
          y += 6;
          // PERBAIKAN: sebelumnya semua gambar grafik disusun berjajar ke
          // kanan dalam SATU baris tanpa pernah "wrap" ke baris baru - kalau
          // jumlah grafik banyak (mis. 4 grafik di Report Admin Keuangan:
          // Outlet, Tunai/Non Tunai, Pengeluaran, & Kategori), grafik yang
          // paling akhir (grafik Kategori) posisi X-nya terdorong sampai
          // KELUAR lebar halaman PDF sehingga tidak pernah terlihat di hasil
          // export. Sekarang dihitung berapa grafik yang muat per baris
          // sesuai lebar halaman, sisanya otomatis lanjut ke baris berikutnya.
          let imgW = 250, imgH = 150, gap = 16, leftMargin = 40, rightMargin = 40;
          let pageW = doc.internal.pageSize.getWidth();
          let pageH = doc.internal.pageSize.getHeight();
          let colsPerRow = Math.max(1, Math.floor((pageW - leftMargin - rightMargin + gap) / (imgW + gap)));
          let x = leftMargin, col = 0;
          chartImages.forEach(img => {
            // Kalau baris saat ini bakal melebihi tinggi halaman, mulai
            // halaman baru supaya grafik tidak terpotong.
            if (y + imgH + 22 > pageH - 30) { doc.addPage(); y = 34; }
            try {
              doc.addImage(img.dataUrl, 'PNG', x, y, imgW, imgH);
              doc.setFontSize(8); doc.setFont(undefined, 'normal');
              doc.text(String(img.title || ''), x, y + imgH + 10);
            } catch (e) { /* kalau gagal render 1 grafik, lanjut tanpa grafik itu */ }
            col++;
            if (col >= colsPerRow) { col = 0; x = leftMargin; y += imgH + 26; }
            else { x += imgW + gap; }
          });
          if (col !== 0) y += imgH + 26; // baris terakhir belum genap sebaris penuh
          y += 6;
        }

        sections.forEach(sec => {
          if (sec.heading) {
            y += 12;
            doc.setFontSize(10); doc.setFont(undefined, 'bold');
            doc.text(String(sec.heading), 40, y);
            y += 4;
          }
          let bodyRows = safeRows(sec.rows || []);
          if (sec.totalLabel) {
            let totalRow = new Array(sec.headers.length).fill('');
            totalRow[sec.headers.length - 2] = sec.totalLabel;
            totalRow[sec.headers.length - 1] = sec.totalValue;
            bodyRows = bodyRows.concat([totalRow]);
          }
          doc.autoTable({
            head: [sec.headers],
            body: bodyRows,
            startY: y + 6,
            margin: { left: 40, right: 40 },
            styles: { fontSize: 7.5, cellPadding: 3, overflow: 'linebreak' },
            headStyles: { fillColor: [15, 23, 42] },
            didParseCell: function(data) {
              if (sec.totalLabel && data.row.section === 'body' && data.row.index === bodyRows.length - 1) {
                data.cell.styles.fontStyle = 'bold';
              }
            }
          });
          y = doc.lastAutoTable.finalY + 10;
        });
        return doc;
      }
    }

    function exportToPdf(fileName, title, subtitle, sections, headerInfo, chartImages, orientation) {
      try {
        let doc = buildPdfDoc_(title, subtitle, sections, headerInfo, chartImages, orientation);
        doc.save(fileName);
      } catch (err) {
        Swal.fire('Gagal Membuat File', 'Terjadi kesalahan saat membuat PDF: ' + err.message, 'error');
      }
    }

      let savedToken = null;
      try { savedToken = localStorage.getItem(SESSION_STORAGE_KEY); } catch (e) {}

      $('#sidebar .nav-links a').removeClass('active');

    function loadView(view, param) {
      currentView = view;

      else if (view === 'master') { setActiveNav('master'); renderMasterProduk(area); }

      else if (view === 'users') { setActiveNav('users'); renderUsers(area); }
      else if (view === 'settings') { setActiveNav('settings'); renderSettings(area); }
      else if (view === 'askai') { setActiveNav('askai'); renderAskAiView(area); }
      else if (view === 'menuconfig') { setActiveNav('menuconfig'); renderMenuConfigView(area); }
      else if (view === 'sales') { setActiveNav('sales-'+param); renderSalesView(area, param); }
      else if (view === 'payment') { setActiveNav('payment-'+param); renderPaymentView(area, param); }
      else if (view === 'stock') { setActiveNav('stock-'+param); renderStockView(area, param); }
      else if (view === 'physicalstock') { setActiveNav('physicalstock-'+param); renderPhysicalStockView(area, param); }
      else if (view === 'stockcard') { setActiveNav('stockcard-'+param); renderStockCardView(area, { warehouseId: UNIT_WAREHOUSE_ID_CLIENT[param], title: UNIT_LABEL[param], fixed: true }); }

      else if (view === 'finance-expenses') { setActiveNav('finance-expenses'); renderFinanceExpensesView(area); }

    // rentang tanggal custom (dari - sampai). Dashboard menghitung ulang

    let dbRangeStart = todayStr();

    function pad2_(n) { return n < 10 ? '0' + n : '' + n; }
    function toDateStr_(d) { return d.getFullYear() + '-' + pad2_(d.getMonth() + 1) + '-' + pad2_(d.getDate()); }

    function applyDbPreset(preset) {
      dbActivePreset = preset;
      let now = new Date();
      if (preset === 'today') { dbRangeStart = dbRangeEnd = toDateStr_(now); }
      else if (preset === 'yesterday') { let y = new Date(now); y.setDate(y.getDate() - 1); dbRangeStart = dbRangeEnd = toDateStr_(y); }
      else if (preset === 'week') { let s = new Date(now); s.setDate(s.getDate() - 6); dbRangeStart = toDateStr_(s); dbRangeEnd = toDateStr_(now); }
      else if (preset === 'month') { let s = new Date(now.getFullYear(), now.getMonth(), 1); dbRangeStart = toDateStr_(s); dbRangeEnd = toDateStr_(now); }
      else if (preset === 'year') { let s = new Date(now.getFullYear(), 0, 1); dbRangeStart = toDateStr_(s); dbRangeEnd = toDateStr_(now); }
      $('#db-range-start').val(dbRangeStart);
      $('#db-range-end').val(dbRangeEnd);
      $('#db-preset-group button').removeClass('active');
      $('#db-preset-' + preset).addClass('active');
      loadDashboardData(dbCurrentScope);

      let s = $('#db-range-start').val(), e = $('#db-range-end').val();

      loadDashboardData(dbCurrentScope);

    function renderDashboard(area) {

        ${!isKasir ? `

            <div class="col-6 col-lg-3"><div class="border rounded p-2 h-100"><div class="small text-muted text-uppercase">Rata-rata / Hari</div><div class="fs-4 fw-bold" id="vs-avg">-</div></div></div>
            <div class="col-6 col-lg-3"><div class="border rounded p-2 h-100"><div class="small text-muted text-uppercase">Hari Tersibuk</div><div class="fs-4 fw-bold" id="vs-peak">-</div><div class="small text-muted" id="vs-peak-label"></div></div></div>

    // ================= TANYA AI (Hermes Agent lokal di PC) =================

    // jadi konteks, lalu dikirim bersama pertanyaan. Kunci API Hermes hanya
    // disimpan di localStorage browser ini, tidak pernah dikirim ke server/GitHub.
    const ASKAI_LS_ = { url: 'wl_hermes_url', key: 'wl_hermes_key', model: 'wl_hermes_model' };
    let askAiHistory = [], askAiCtx = null, askAiAbort = null, askAiBusy = false;

    function askAiLs_(k, v) {
      try { if (v === undefined) return localStorage.getItem(ASKAI_LS_[k]) || ''; localStorage.setItem(ASKAI_LS_[k], v); } catch (e) { return ''; }
    }
    function askAiGas_(fn) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve) {
        try {
          google.script.run.withSuccessHandler(function(r) { resolve({ ok: true, v: r }); })
            .withFailureHandler(function(e) { resolve({ ok: false, msg: (e && e.message) || String(e) }); })[fn].apply(null, args);
        } catch (e) { resolve({ ok: false, msg: e.message }); }
      });
    }

    function renderAskAiView(area) {
      if (currentUser.role !== 'Owner') { area.html('<div class="alert alert-warning">Menu ini khusus Owner.</div>'); return; }

      const t = todayStr();
      area.html(`
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-1">

          <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#askai-settings"><i class="fa-solid fa-plug me-1"></i>Koneksi Hermes</button>

        <p class="text-muted small mb-3">Tanya apa saja tentang data sistem pada periode yang dipilih. Data periode itu dikirim ke Hermes di PC Anda (dan ke penyedia model AI yang Anda pakai di Hermes).</p>

        <div class="collapse mb-3 ${askAiLs_('key') ? '' : 'show'}" id="askai-settings">
          <div class="card p-3 shadow-sm">
            <div class="row g-2 align-items-end">
              <div class="col-md-5"><label class="form-label small mb-1">Alamat API Hermes</label><input id="askai-url" class="form-control form-control-sm" placeholder="http://127.0.0.1:8642" value="${esc(askAiLs_('url') || 'http://127.0.0.1:8642')}"></div>
              <div class="col-md-4"><label class="form-label small mb-1">API Key (API_SERVER_KEY)</label><input id="askai-key" type="password" class="form-control form-control-sm" autocomplete="off" value="${esc(askAiLs_('key'))}"></div>
              <div class="col-md-3"><label class="form-label small mb-1">Nama model</label><input id="askai-model" class="form-control form-control-sm" placeholder="otomatis" value="${esc(askAiLs_('model'))}"></div>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
              <button class="btn btn-sm btn-primary" onclick="askAiSaveSettings(true)"><i class="fa-solid fa-plug-circle-check me-1"></i>Simpan &amp; Tes Koneksi</button>
              <span class="small" id="askai-conn"></span>
            </div>
            <div class="small text-muted mt-2">Di PC: isi <code>~/.hermes/.env</code> dengan <code>API_SERVER_ENABLED=true</code>, <code>API_SERVER_KEY=...</code>, dan <code>API_SERVER_CORS_ORIGINS=${esc(location.origin)}</code>, lalu jalankan <code>hermes gateway</code>. Kunci disimpan hanya di browser ini.</div>
          </div>
        </div>

        <div class="card p-3 shadow-sm mb-3">
          <div class="d-flex flex-wrap align-items-end gap-2">
            <div><label class="form-label small mb-1">Periode data</label>
              <select id="askai-preset" class="form-select form-select-sm" onchange="askAiPresetChange()">
                <option value="today">Hari Ini</option><option value="yesterday">Kemarin</option><option value="week">7 Hari Terakhir</option>
                <option value="month" selected>Bulan Ini</option><option value="year">Tahun Ini</option><option value="custom">Rentang Kustom</option>
              </select></div>
            <div><label class="form-label small mb-1">Dari</label><input type="date" id="askai-start" class="form-control form-control-sm" value="${t}" onchange="$('#askai-preset').val('custom');askAiCtx=null;"></div>
            <div><label class="form-label small mb-1">Sampai</label><input type="date" id="askai-end" class="form-control form-control-sm" value="${t}" onchange="$('#askai-preset').val('custom');askAiCtx=null;"></div>
            <button class="btn btn-sm btn-outline-primary" onclick="askAiLoadContext(true)"><i class="fa-solid fa-rotate me-1"></i>Muat Ulang Data</button>
            <div class="small text-muted ms-auto" id="askai-ctx-info">Data belum dimuat (otomatis dimuat saat bertanya)</div>
          </div>
        </div>

        <div class="card p-3 shadow-sm">
          <div id="askai-chat" style="min-height:260px;max-height:55vh;overflow-y:auto;" class="mb-3">
            <div class="text-muted small" id="askai-empty">Contoh pertanyaan:
              <div class="d-flex flex-wrap gap-2 mt-2">
                ${['Ringkas performa periode ini', 'Bandingkan pengunjung dengan periode sebelumnya', 'Pengeluaran terbesar apa saja?', 'Apakah ada laporan kasir yang tidak balance?', 'Produk apa yang paling laris dan kategori apa yang paling besar?'].map(q => `<button class="btn btn-sm btn-outline-secondary" onclick="askAiSend(this.textContent)">${esc(q)}</button>`).join('')}
              </div>
            </div>
          </div>
          <div class="d-flex gap-2 align-items-end">
            <textarea id="askai-input" class="form-control" rows="2" placeholder="Tulis pertanyaan... (Enter = kirim, Shift+Enter = baris baru)" style="font-size:16px"></textarea>
            <button class="btn btn-primary" id="askai-send" onclick="askAiSend()"><i class="fa-solid fa-paper-plane"></i></button>
            <button class="btn btn-outline-danger d-none" id="askai-stop" onclick="askAiStop()"><i class="fa-solid fa-stop"></i></button>
          </div>
          <div class="d-flex justify-content-between mt-2"><span class="small text-muted">Jawaban AI bisa keliru, cek angka penting di laporan.</span><a href="#" class="small" onclick="askAiClear();return false;">Bersihkan percakapan</a></div>
        </div>`);
      $('#askai-input').on('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askAiSend(); } });
      askAiPresetChange();
    }

    function askAiPresetChange() {
      const p = $('#askai-preset').val(); const now = new Date();
      let s = now, e = now;
      if (p === 'yesterday') { s = new Date(now); s.setDate(s.getDate() - 1); e = s; }
      else if (p === 'week') { s = new Date(now); s.setDate(s.getDate() - 6); }
      else if (p === 'month') s = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (p === 'year') s = new Date(now.getFullYear(), 0, 1);
      if (p !== 'custom') { $('#askai-start').val(toDateStr_(s)); $('#askai-end').val(toDateStr_(e)); }
      askAiCtx = null;
      $('#askai-ctx-info').text('Data belum dimuat (otomatis dimuat saat bertanya)');
    }

    function askAiBase_() { return String($('#askai-url').val() || askAiLs_('url') || 'http://127.0.0.1:8642').trim().replace(/\/+$/, ''); }
    function askAiNetHelp_() {
      return 'Tidak bisa terhubung ke Hermes. Periksa: (1) <code>hermes gateway</code> sedang berjalan di PC ini, (2) <code>API_SERVER_CORS_ORIGINS</code> berisi <code>' + esc(location.origin) + '</code>, (3) jika Chrome menanyakan izin akses ke perangkat/jaringan lokal, pilih Izinkan, (4) halaman ini dibuka dari PC yang sama dengan Hermes (bukan HP).';
    }

    function askAiSaveSettings(test) {
      askAiLs_('url', $('#askai-url').val().trim()); askAiLs_('key', $('#askai-key').val().trim()); askAiLs_('model', $('#askai-model').val().trim());
      if (!test) return;
      const $c = $('#askai-conn').removeClass('text-success text-danger').text('Menguji...');
      fetch(askAiBase_() + '/v1/models', { headers: { 'Authorization': 'Bearer ' + askAiLs_('key') } })
        .then(r => { if (r.status === 401 || r.status === 403) throw new Error('API key ditolak (periksa API_SERVER_KEY).'); if (!r.ok) throw new Error('Server membalas ' + r.status); return r.json(); })
        .then(j => {
          const id = j && j.data && j.data[0] && j.data[0].id;
          if (id && !askAiLs_('model')) { askAiLs_('model', id); $('#askai-model').val(id); }
          $c.addClass('text-success').html('<i class="fa-solid fa-circle-check me-1"></i>Terhubung' + (id ? ' (model: ' + esc(id) + ')' : ''));
        })
        .catch(err => { $c.addClass('text-danger').html(err instanceof TypeError ? askAiNetHelp_() : esc(err.message)); });
    }

    function askAiClear() { askAiHistory = []; $('#askai-chat').html('<div class="text-muted small">Percakapan dibersihkan.</div>'); }
    function askAiStop() { if (askAiAbort) askAiAbort.abort(); }

    // Ambil & ringkas data sistem untuk periode terpilih -> teks JSON ringkas
    async function askAiLoadContext(force) {
      const start = $('#askai-start').val(), end = $('#askai-end').val();
      if (!start || !end) throw new Error('Pilih periode data terlebih dahulu.');
      const key = start + '|' + end;
      if (!force && askAiCtx && askAiCtx.key === key) return askAiCtx;
      $('#askai-ctx-info').html('<span class="spinner-border spinner-border-sm me-1"></span>Memuat data sistem...');
      const [dash, vis, exp, bal] = await Promise.all([
        askAiGas_('getDashboardData', sessionToken, 'All', start, end),
        askAiGas_('getVisitorStats', sessionToken, start, end),
        askAiGas_('getFinanceExpensesRange', start, end, sessionToken),
        askAiGas_('getBalanceCheckReport', sessionToken, start, end)
      ]);
      const ok = r => r.ok && r.v && r.v.success !== false;
      const miss = [];
      const ctx = { periode: { dari: start, sampai: end } };
      if (ok(dash)) {
        const d = dash.v, m = d.metrics || {};
        ctx.penjualan = { total: m.totalSalesToday, loketMasuk: m.totalMasuk, loketWahana: m.totalWahana, resto: m.totalResto };
        ctx.penerimaanKasir = { total: m.totalPenerimaanKasir, tunai: m.totalCash, qris: m.totalQris, transfer: m.totalTransfer, debit: m.totalDebit, kredit: m.totalKredit, perOutlet: d.paymentBreakdown };
        ctx.penjualanPerKategori = d.categoryChart;
        ctx.produkTerlarisBerdasarkanPendapatan = d.topProductsChart;
        ctx.keuangan = d.finance;
        if (d.chart && d.chart.labels && d.chart.labels.length <= 62) ctx.perHari = d.chart.labels.map((l, i) => ({ tanggal: l, penjualan: d.chart.sales[i], pengeluaran: d.chart.expenses[i] }));
        ctx.stokMenipis = { jumlah: d.lowStockCount, contoh: (d.lowStockItems || []).map(s => ({ produk: s.ProductName, qty: s.Quantity, minimum: s.MinStock, gudang: s.WarehouseName })) };
      } else miss.push('penjualan/penerimaan/keuangan');
      if (ok(vis)) {
        const v = vis.v.data;
        ctx.pengunjung = { definisi: 'total Qty penjualan kategori Tiket Masuk', total: v.total, rataRataPerHari: v.avgPerDay, hariTersibuk: v.peak, periodeSebelumnya: { dari: v.prevStart, sampai: v.prevEnd, total: v.prevTotal }, persenPerubahan: v.changePct, perJenisTiket: v.breakdown, tren: v.labels.map((l, i) => [l, v.values[i]]) };
      } else miss.push('pengunjung');
      if (ok(exp)) {
        const rows = exp.v.data || [];
        const grp = f => { const a = {}; rows.forEach(r => { const k = String(f(r) || '-'); a[k] = (a[k] || 0) + (Number(r.Amount) || 0); }); return Object.keys(a).map(k => ({ nama: k, total: a[k] })).sort((x, y) => y.total - x.total).slice(0, 15); };
        ctx.pengeluaranRinci = {
          jumlahBaris: rows.length,
          perPosBiaya: grp(r => r.COAName), perPosPenggunaan: grp(r => r.PosPenggunaan), perSupplier: grp(r => r.Supplier), perStatusPembayaran: grp(r => r.StatusPembayaran),
          terbesar: rows.slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0)).slice(0, 25).map(r => ({ tanggal: String(r.Date).slice(0, 10), supplier: r.Supplier, deskripsi: r.Description, jumlah: r.Amount, status: r.StatusPembayaran, posBiaya: r.COAName, posPenggunaan: r.PosPenggunaan }))
        };
      } else miss.push('pengeluaran rinci');
      if (ok(bal)) ctx.laporanKasirTidakBalance = { jumlah: bal.v.mismatchCount, daftar: (bal.v.mismatches || []).slice(0, 20) };
      else miss.push('cek balance');
      if (miss.length) ctx.dataTidakTersedia = miss;
      let text = JSON.stringify(ctx);
      if (text.length > 60000) text = text.slice(0, 60000);
      askAiCtx = { key: key, text: text };
      $('#askai-ctx-info').html('<i class="fa-solid fa-circle-check text-success me-1"></i>Data siap: ' + esc(fmtDate(start)) + ' - ' + esc(fmtDate(end)) + (miss.length ? ' <span class="text-warning">(sebagian tidak tersedia)</span>' : ''));
      return askAiCtx;
    }

    function askAiMd_(text) {
      const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
      const lines = String(text).split('\n'); const out = []; let i = 0, ul = false;
      const closeUl = () => { if (ul) { out.push('</ul>'); ul = false; } };
      while (i < lines.length) {
        const ln = lines[i];
        if (/^\s*\|/.test(ln)) {
          closeUl(); const blk = [];
          while (i < lines.length && /^\s*\|/.test(lines[i])) blk.push(lines[i++]);
          const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          const rowsB = blk.filter(l => !/^\s*\|?\s*:?-{2,}/.test(l));
          if (rowsB.length) {
            out.push('<div class="table-responsive"><table class="table table-sm table-bordered mb-2"><thead><tr>' + cells(rowsB[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
              rowsB.slice(1).map(r => '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
          }
          continue;
        }
        if (/^\s*[-*]\s+/.test(ln)) { if (!ul) { out.push('<ul class="mb-2">'); ul = true; } out.push('<li>' + inline(ln.replace(/^\s*[-*]\s+/, '')) + '</li>'); }
        else if (/^#{1,4}\s+/.test(ln)) { closeUl(); out.push('<div class="fw-bold mt-2">' + inline(ln.replace(/^#{1,4}\s+/, '')) + '</div>'); }
        else if (!ln.trim()) { closeUl(); }
        else { closeUl(); out.push('<div>' + inline(ln) + '</div>'); }
        i++;
      }
      closeUl(); return out.join('');
    }

    function askAiBubble_(role, html) {
      const mine = role === 'user';
      const $b = $(`<div class="d-flex mb-2 ${mine ? 'justify-content-end' : ''}"><div class="rounded-3 px-3 py-2 ${mine ? 'bg-primary text-white' : 'border'}" style="max-width:92%;overflow-wrap:anywhere;">${html}</div></div>`);
      $('#askai-empty').remove(); $('#askai-chat').append($b);
      const el = document.getElementById('askai-chat'); el.scrollTop = el.scrollHeight;
      return $b.find('> div');
    }

    async function askAiSend(preset) {
      if (askAiBusy) return;
      const q = String(preset || $('#askai-input').val() || '').trim();
      if (!q) return;
      if (!askAiLs_('key') && !$('#askai-key').val()) { $('#askai-settings').collapse('show'); return Swal.fire('Koneksi belum diatur', 'Isi API Key Hermes di bagian Koneksi Hermes terlebih dahulu.', 'info'); }
      askAiSaveSettings(false);
      $('#askai-input').val('');
      askAiBubble_('user', esc(q).replace(/\n/g, '<br>'));
      const $ans = askAiBubble_('assistant', '<span class="spinner-border spinner-border-sm me-1"></span><span class="text-muted">Menyiapkan data...</span>');
      askAiBusy = true; $('#askai-send').addClass('d-none'); $('#askai-stop').removeClass('d-none');
      askAiAbort = new AbortController();
      let acc = '';
      try {
        const ctx = await askAiLoadContext(false);
        $ans.html('<span class="spinner-border spinner-border-sm me-1"></span><span class="text-muted">Hermes sedang berpikir...</span>');
        const sys = 'Kamu adalah asisten analis data untuk Wonderland Samarinda (taman rekreasi: loket masuk, wahana, resto). Jawab dalam Bahasa Indonesia, singkat dan jelas, HANYA berdasarkan DATA di bawah. ' +
          'JANGAN menjalankan perintah, memakai tool/terminal, membuka file, atau mengakses internet; cukup jawab dari data. Jika data tidak ada atau tidak cukup, katakan terus terang dan jangan mengarang angka. ' +
          'Tulis rupiah dengan pemisah titik (mis. Rp 1.250.000). Boleh pakai tabel markdown atau poin-poin. "Pengunjung" = total Qty penjualan kategori Tiket Masuk.\n\nDATA (JSON):\n' + ctx.text;
        const msgs = [{ role: 'system', content: sys }].concat(askAiHistory.slice(-10), [{ role: 'user', content: q }]);
        const model = askAiLs_('model') || 'hermes-agent';
        const resp = await fetch(askAiBase_() + '/v1/chat/completions', {
          method: 'POST', signal: askAiAbort.signal,
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + askAiLs_('key') },
          body: JSON.stringify({ model: model, messages: msgs, stream: true })
        });
        if (resp.status === 401 || resp.status === 403) throw new Error('API key ditolak oleh Hermes (periksa API_SERVER_KEY).');
        if (!resp.ok) { let t = ''; try { t = (await resp.text()).slice(0, 300); } catch (e) {} throw new Error('Hermes membalas ' + resp.status + (t ? ': ' + t : '')); }
        const ct = resp.headers.get('content-type') || '';
        if (ct.indexOf('text/event-stream') === -1) {
          const j = await resp.json(); acc = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
          $ans.html(askAiMd_(acc || '(jawaban kosong)'));
        } else {
          const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
          for (;;) {
            const { done, value } = await reader.read(); if (done) break;
            buf += dec.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
              if (line.indexOf('data:') !== 0) continue;
              const data = line.slice(5).trim(); if (!data || data === '[DONE]') continue;
              try { const j = JSON.parse(data); const dlt = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if (dlt) { acc += dlt; $ans.html(askAiMd_(acc)); const el = document.getElementById('askai-chat'); el.scrollTop = el.scrollHeight; } } catch (e) {}
            }
          }
          if (!acc) $ans.html('<span class="text-muted">(jawaban kosong)</span>');
        }
        askAiHistory.push({ role: 'user', content: q }, { role: 'assistant', content: acc });
      } catch (err) {
        if (err && err.name === 'AbortError') { $ans.html((acc ? askAiMd_(acc) : '') + '<div class="small text-muted mt-1">(dihentikan)</div>'); if (acc) askAiHistory.push({ role: 'user', content: q }, { role: 'assistant', content: acc }); }
        else $ans.html('<span class="text-danger">' + (err instanceof TypeError ? askAiNetHelp_() : esc(err.message || String(err))) + '</span>');
      } finally {
        askAiBusy = false; askAiAbort = null; $('#askai-send').removeClass('d-none'); $('#askai-stop').addClass('d-none');
      }
    }

    // ===== Kontrol Pengunjung (Dashboard) =====
    // Mengikuti filter tanggal dashboard (dbRangeStart/dbRangeEnd) - dipanggil
    // dari loadDashboardData supaya angka pengunjung, penjualan & penerimaan
    // kasir selalu untuk rentang yang sama.
    let vsChart = null, vsReqSeq = 0;
    function loadVisitorPanel() {
      if (!$('#visitor-panel').length) return;
      const seq = ++vsReqSeq;
      $('#vs-label').text('Memuat...');
      google.script.run.withSuccessHandler(function(res) {
        if (seq !== vsReqSeq || !$('#visitor-panel').length) return;
        if (!res || !res.success) { $('#vs-label').html('<span class="text-danger">Gagal memuat: ' + esc((res && res.message) || '') + '</span>'); return; }
        const d = res.data;
        const rangeTxt = d.rangeStart === d.rangeEnd ? fmtDate(d.rangeStart) : (fmtDate(d.rangeStart) + ' - ' + fmtDate(d.rangeEnd));
        $('#vs-label').text('Periode: ' + rangeTxt + ' (' + d.days + ' hari)');
        const nf = n => Number(n || 0).toLocaleString('id-ID');
        $('#vs-total').text(nf(d.total));
        $('#vs-avg').text(nf(d.avgPerDay));
        $('#vs-prev').text(nf(d.prevTotal));
        $('#vs-prev-label').text(d.prevStart === d.prevEnd ? fmtDate(d.prevStart) : (fmtDate(d.prevStart) + ' - ' + fmtDate(d.prevEnd)));
        if (d.peak) { $('#vs-peak').text(nf(d.peak.qty)); $('#vs-peak-label').text(fmtDate(d.peak.date)); }
        else { $('#vs-peak').text('-'); $('#vs-peak-label').text(''); }
        if (d.changePct === null) $('#vs-change').html('<span class="text-muted">belum ada pembanding</span>');
        else {
          const up = d.changePct >= 0;
          $('#vs-change').html('<span class="' + (up ? 'text-success' : 'text-danger') + ' fw-semibold"><i class="fa-solid fa-arrow-' + (up ? 'up' : 'down') + ' me-1"></i>' + Math.abs(d.changePct).toLocaleString('id-ID') + '%</span> <span class="text-muted">vs periode sebelumnya</span>');
        }
        $('#vs-breakdown').html((d.breakdown || []).map(b => '<tr><td>' + esc(b.name) + '</td><td class="text-end fw-semibold">' + nf(b.qty) + '</td></tr>').join('') || '<tr><td class="text-muted">Belum ada penjualan tiket masuk pada periode ini</td></tr>');
        const datasets = [{ type: 'bar', label: 'Pengunjung', data: d.values, order: 2, borderRadius: 3,
          backgroundColor: d.inRange.map(f => f ? '#0284c7' : 'rgba(2,132,199,.25)') }];
        if (d.prevValues) datasets.push({ type: 'line', label: 'Periode sebelumnya', data: d.prevValues, borderColor: '#94a3b8', backgroundColor: '#94a3b8', borderDash: [5, 4], pointRadius: 2, tension: .25, order: 1 });
        if (vsChart) vsChart.destroy();
        vsChart = new Chart(document.getElementById('vs-chart'), {
          data: { labels: d.labels, datasets: datasets },
          options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: !!d.prevValues } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { maxRotation: 0, autoSkip: true } } } }
        });
      }).withFailureHandler(function(err) {
        if (seq !== vsReqSeq) return;
        $('#vs-label').html('<span class="text-danger">Gagal memuat: ' + esc((err && err.message) || err) + '</span>');
      }).getVisitorStats(sessionToken, dbRangeStart, dbRangeEnd);
    }

    // Scope: "mine" = transaksi outlet sendiri saja (default untuk Kasir),
    // "all" = tombol filter khusus untuk menampilkan transaksi terbaru dari
    // semua outlet (loket masuk, resto, maupun wahana) sekaligus.
    let dbCurrentScope = 'mine';
    function setDashboardScope(scope) {
      dbCurrentScope = scope;
      $('#db-scope-mine').toggleClass('active', scope === 'mine');
      $('#db-scope-all').toggleClass('active', scope === 'all');
      if (currentUser.role === 'Kasir') {
        $('#m-total').closest('.metric-card').find('h6').text(
          scope === 'all' ? 'Total Penjualan - Semua Outlet' : ('Total Penjualan - ' + (UNIT_LABEL[currentUser.assignedUnit] || ''))
        );
      }
      loadDashboardData(scope);
    }

    // Widget Dashboard "Balance Report - Semua Kasir": deteksi tanggal &
    // outlet mana yang Total Penjualan-nya tidak sama dengan Total
    // Penerimaan Kasir, supaya Owner bisa langsung tracking di mana
    // laporan yang tidak balance tanpa harus buka Report Semua Kasir
    // satu-satu per tanggal. Hanya tersedia untuk Owner/Admin/Staff -
    // kalau elemennya tidak ada di DOM (role Kasir), fungsi ini langsung
    // berhenti tanpa memanggil server sama sekali.
    function loadBalanceCheckWidget() {
      if (!$('#balance-check-body').length) return;
      $('#balance-check-badge').removeClass('bg-success bg-danger').addClass('bg-secondary').text('Memeriksa...');
      $('#balance-check-body').html('<p class="text-muted small mb-0">Memeriksa kecocokan Total Penjualan vs Total Penerimaan Kasir...</p>');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) {
          $('#balance-check-badge').removeClass('bg-secondary bg-success').addClass('bg-danger').text('Gagal');
          $('#balance-check-body').html('<p class="text-danger small mb-0">Gagal memeriksa: ' + esc(res.message) + '</p>');
          return;
        }
        if (!res.mismatchCount) {
          $('#balance-check-badge').removeClass('bg-secondary bg-danger').addClass('bg-success').text('Semua Balance');
          $('#balance-check-body').html('<p class="text-success small mb-0"><i class="fa-solid fa-circle-check me-1"></i>Semua laporan kasir pada rentang tanggal ini sudah balance antara Total Penjualan dan Total Penerimaan Kasir.</p>');
          return;
        }
        $('#balance-check-badge').removeClass('bg-secondary bg-success').addClass('bg-danger').text(res.mismatchCount + ' Tidak Balance');
        let rows = res.mismatches.map(function(m) {
          let isSurplusSales = m.selisih > 0;
          let selisihClass = isSurplusSales ? 'text-danger' : 'text-warning';
          let selisihLabel = (isSurplusSales ? 'Penjualan lebih besar ' : 'Penerimaan lebih besar ') + fmtRp(Math.abs(m.selisih));
          return `<tr>
            <td>${fmtDate(m.date)}</td>
            <td>${esc(m.unitLabel)}</td>
            <td class="text-end">${fmtRp(m.totalSales)}</td>
            <td class="text-end">${fmtRp(m.totalPenerimaan)}</td>
            <td class="text-end fw-semibold ${selisihClass}">${selisihLabel}</td>
          </tr>`;
        }).join('');
        $('#balance-check-body').html(`
          <p class="small text-muted mb-2"><i class="fa-solid fa-triangle-exclamation me-1 text-warning"></i>Ditemukan ${res.mismatchCount} laporan kasir yang tidak balance pada rentang tanggal ini. Telusuri lebih detail lewat menu Report Semua Kasir pada tanggal terkait.</p>
          <div class="table-responsive"><table class="table table-sm table-striped mb-0">

    // Diagnostik database - khusus Owner. Penyebab paling umum dari "data
    // sudah tersimpan di spreadsheet tapi tidak muncul di web app" adalah
    // aplikasi ternyata membaca/menulis ke SPREADSHEET YANG BERBEDA dari
    // yang dicek manual oleh Owner. Panel ini menampilkan persis spreadsheet
    // mana yang sedang dipakai + jumlah baris datanya, supaya bisa langsung
    // dicocokkan/diverifikasi.
    function loadDbDiagnostic() {

        if (!res.success) return;
        let c = res.counts || {};
        $('#db-diagnostic-card').html(`
          <div class="alert alert-info d-flex flex-wrap align-items-center gap-3 mb-4" style="border-radius:12px;">

              <div class="small text-muted">Kalau data yang Anda input tidak muncul di sini padahal sudah ada di spreadsheet yang Anda cek manual, kemungkinan besar itu bukan spreadsheet yang sama dengan di atas. Buka link berikut untuk memastikan, lalu bandingkan dengan spreadsheet yang biasa Anda cek.</div>

          </div>`);

    // ================= MASTER PRODUK =================
    // Daftar Unit/Outlet Berlaku (ApplicableUnit) dulu hardcode 4 pilihan
    // (Entrance/Ride/Resto/General) di sini - sekarang dimuat dinamis dari
    // sheet Applicable_Units (bisa ditambah/edit/hapus sendiri lewat menu
    // Kategori & Metode Pembayaran > Unit/Outlet Berlaku), supaya unit baru
    // (mis. Teknisi/Kolam/Dapur/Cleaning) bisa ditambah tanpa ubah kode.
    // applicableUnitsCache diisi oleh fetchApplicableUnitTable() (dipanggil
    // saat halaman "Kategori & Metode Pembayaran" dibuka) dan dipakai ulang
    // di sini supaya tidak perlu round-trip server tiap kali dibutuhkan.
    let applicableUnitsCache = [];
    function getOutletOptions_() {
      let active = applicableUnitsCache.filter(u => u.Status === 'Active');
      if (!active.length) return [{ key: 'General', label: 'Semua Outlet' }]; // fallback sebelum cache terisi
      return active.map(u => ({ key: u.UnitKey, label: u.UnitLabel || u.UnitKey }));
    }

    function formatApplicableUnitLabel(applicableUnit) {
      let units = String(applicableUnit || '').split(',').map(u => u.trim()).filter(Boolean);
      if (!units.length) return '-';
      let labelMap = {};
      applicableUnitsCache.forEach(u => { labelMap[u.UnitKey] = u.UnitLabel; });
      return units.map(u => labelMap[u] || UNIT_LABEL[u] || (u === 'General' ? 'Semua Outlet' : u)).join(', ');
    }

    function renderMasterProduk(area) {
      area.html(`
        <h2 class="fw-bold mb-4">Master Produk & Katalog</h2>
        <div class="card p-4 shadow-sm">
          <div class="d-flex flex-wrap gap-2 mb-3">
            <button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus me-2"></i>Tambah Produk</button>
            <button class="btn btn-outline-primary" onclick="fetchProductsTable()"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
            <button class="btn btn-outline-secondary" onclick="downloadProductTemplate()"><i class="fa-solid fa-download me-2"></i>Download Template</button>
            <label class="btn btn-outline-primary mb-0">
              <i class="fa-solid fa-file-import me-2"></i>Import dari Excel
              <input type="file" id="product-import-input" accept=".xlsx,.xls" style="display:none" onchange="handleProductImport(event)">
            </label>
            <button class="btn btn-outline-danger" id="btn-bulk-delete-product" onclick="bulkDeleteSelectedProducts()" disabled><i class="fa-solid fa-trash me-2"></i>Hapus Terpilih (<span id="bulk-delete-count">0</span>)</button>
            <button class="btn btn-outline-danger ms-auto" onclick="exportTable('products','pdf')"><i class="fa-solid fa-file-pdf me-2"></i>Export PDF</button>
            <button class="btn btn-outline-success" onclick="exportTable('products','xlsx')"><i class="fa-solid fa-file-excel me-2"></i>Export XLSX</button>
          </div>
          <div class="table-responsive"><table class="table table-striped w-100" id="product-table">
            <thead><tr><th><input type="checkbox" id="product-select-all" onclick="toggleAllProductCheckboxes(this)"></th><th>Kode Barang</th><th>Nama Produk</th><th>Varian</th><th>Pakai Stok</th><th>Acuan Stok</th><th>Pakai Seri</th><th>Stok Awal</th><th>Sat</th><th>Harga Beli</th><th>Harga Jual</th><th>Kategori</th><th>Tipe Barang</th><th>Outlet Penjualan</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="product-tbody"></tbody>
          </table></div>
        </div>`);
      fetchProductsTable();
    }

    let productsCache = [];
    function fetchProductsTable() {
      // Pastikan applicableUnitsCache sudah terisi supaya kolom "Outlet
      // Penjualan" di tabel Master Produk menampilkan label yang benar
      // (termasuk unit baru mis. Teknisi/Kolam/Dapur/Cleaning) walau
      // halaman Kategori & Metode Pembayaran belum pernah dibuka.
      if (!applicableUnitsCache.length) {
        google.script.run.withSuccessHandler(function(units) {
          applicableUnitsCache = units;
          $('#product-tbody .app-unit-cell').each(function() {
            $(this).text(formatApplicableUnitLabel($(this).data('raw')));
          });
        }).withFailureHandler(function() {}).getApplicableUnits();
      }
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        productsCache = res.data;
        let tbody = '';
        res.data.forEach(p => {
          let usesStock = String(p.UsesStock || 'Ya').trim() !== 'Tidak';
          let usesSerial = String(p.UsesSerial || 'Ya').trim() !== 'Tidak';
          tbody += `<tr>
            <td><input type="checkbox" class="product-row-check" value="${esc(p.ProductCode)}" onclick="updateBulkDeleteState()"></td>
            <td>${esc(p.ProductCode)}</td><td>${esc(p.ProductName)}</td><td>${esc(p.Variant)}</td>
            <td><span class="badge ${usesStock?'bg-info text-dark':'bg-light text-dark border'}">${usesStock?'Ya':'Tidak'}</span></td>
            <td>${p.StockRefCode ? '<span class="badge bg-warning text-dark" title="Stok ikut produk '+esc(p.StockRefCode)+'">'+esc(p.StockRefCode)+'</span>' : '-'}</td>
            <td><span class="badge ${usesSerial?'bg-info text-dark':'bg-light text-dark border'}">${usesSerial?'Ya':'Tidak'}</span></td>
            <td>${usesStock ? esc(p.StokAwal) : '-'}</td><td>${esc(p.Unit)}</td>
            <td>${fmtRp(p.BuyPrice)}</td><td>${fmtRp(p.SellPrice)}</td><td>${esc(p.Category)}</td>
            <td><span class="badge bg-light text-dark border">${esc(p.ItemType || 'Lainnya')}</span></td>
            <td class="app-unit-cell" data-raw="${esc(p.ApplicableUnit)}">${esc(formatApplicableUnitLabel(p.ApplicableUnit))}</td>
            <td><span class="badge ${p.Status==='Active'?'bg-success':'bg-secondary'}">${esc(p.Status)}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editProductRow('${esc(p.ProductCode)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${esc(p.ProductCode)}')"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        });
        $('#product-tbody').html(tbody);
        if ($.fn.DataTable.isDataTable('#product-table')) $('#product-table').DataTable().destroy();
        $('#product-table').DataTable({ pageLength: 10 });
        $('#product-select-all').prop('checked', false);
        updateBulkDeleteState();
      }).withFailureHandler(errHandler).getProductsWithStock(sessionToken);
    }

    function toggleAllProductCheckboxes(source) {
      $('.product-row-check').prop('checked', source.checked);
      updateBulkDeleteState();
    }

    function updateBulkDeleteState() {
      let checked = $('.product-row-check:checked').length;
      $('#bulk-delete-count').text(checked);
      $('#btn-bulk-delete-product').prop('disabled', checked === 0);
      $('#product-select-all').prop('checked', checked > 0 && checked === $('.product-row-check').length);
    }

    function bulkDeleteSelectedProducts() {
      let codes = $('.product-row-check:checked').map(function() { return this.value; }).get();
      if (!codes.length) return;
      Swal.fire({
        title: 'Hapus ' + codes.length + ' produk terpilih?', icon: 'warning',
        showCancelButton: true, confirmButtonText: 'Ya, Hapus Semua'
      }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            fetchProductsTable();
          }).withFailureHandler(errHandler).bulkDeleteProducts(codes, sessionToken);
        }
      });
    }

    function editProductRow(code) {
      let p = productsCache.find(x => x.ProductCode === code);
      if (!p) return Swal.fire('Gagal', 'Data produk tidak ditemukan, coba klik Refresh Data.', 'error');
      openProductModal(p);
    }

    function openProductModal(p) {
      const isEdit = !!p;
      let selectedUnits = isEdit ? String(p.ApplicableUnit || '').split(',').map(u => u.trim()) : [];
      google.script.run.withSuccessHandler(function(categories) {
        let activeCats = categories.filter(c => c.Status === 'Active');
        let catOptions = activeCats.map(c => `<option value="${c.CategoryName}" ${isEdit && p.Category===c.CategoryName?'selected':''}>${c.CategoryName}</option>`).join('')
          || `<option value="">-- Belum ada kategori, tambahkan di menu Kategori & Pembayaran --</option>`;
        // Unit/Outlet Berlaku (ApplicableUnit) dimuat dinamis dari master
        // Applicable_Units (bisa ditambah sendiri lewat menu Kategori &
        // Metode Pembayaran), bukan lagi 4 opsi hardcode (Entrance/Ride/
        // Resto/General) - supaya unit baru (mis. Teknisi/Kolam/Dapur/
        // Cleaning) langsung muncul di sini begitu ditambahkan.
        google.script.run.withSuccessHandler(function(applicableUnits) {
          applicableUnitsCache = applicableUnits;
          let activeUnits = applicableUnits.filter(u => u.Status === 'Active');
          // Kalau produk yang diedit punya unit yang sudah tidak aktif/tidak
          // ada lagi di master, tetap tampilkan sebagai opsi terpilih supaya
          // nilainya tidak diam-diam hilang saat form dibuka.
          let unitKeys = activeUnits.map(u => u.UnitKey);
          selectedUnits.forEach(su => {
            if (su && unitKeys.indexOf(su) === -1) {
              let inactive = applicableUnits.find(u => u.UnitKey === su);
              activeUnits = activeUnits.concat([{ UnitKey: su, UnitLabel: inactive ? inactive.UnitLabel : su }]);
            }
          });
          let outletChecks = activeUnits.map(o => `
              <div class="form-check form-check-inline">
                <input class="form-check-input applicable-cb" type="checkbox" value="${esc(o.UnitKey)}" id="app-${esc(o.UnitKey)}" ${selectedUnits.indexOf(o.UnitKey)!==-1?'checked':''}>
                <label class="form-check-label" for="app-${esc(o.UnitKey)}">${esc(o.UnitLabel || o.UnitKey)}</label>
              </div>`).join('')
            || '<div class="text-muted small">Belum ada unit, tambahkan di menu Kategori & Metode Pembayaran &gt; Unit/Outlet Berlaku.</div>';
          // Tipe Barang (untuk modul Warehouse) sekarang master data sendiri
          // (sheet Product_Types, diatur di menu Kategori & Metode Pembayaran)
          // - dropdown-nya dimuat dinamis di sini, bukan lagi 4 opsi hardcode.
          google.script.run.withSuccessHandler(function(productTypes) {
            let activeTypes = productTypes.filter(t => t.Status === 'Active');
            // Kalau produk yang diedit punya ItemType yang sudah tidak aktif/
            // tidak ada lagi di master, tetap tampilkan sebagai opsi terpilih
            // supaya nilainya tidak diam-diam berubah saat form dibuka.
            let typeNames = activeTypes.map(t => t.TypeName);
            if (isEdit && p.ItemType && typeNames.indexOf(p.ItemType) === -1) {
              activeTypes = activeTypes.concat([{ TypeName: p.ItemType }]);
            }
            let itemTypeOptions = activeTypes.map(t => `<option value="${esc(t.TypeName)}" ${isEdit && p.ItemType===t.TypeName?'selected':''}>${esc(t.TypeName)}</option>`).join('')
              || `<option value="Lainnya">Lainnya</option>`;
            // Kandidat "Acuan Stok": produk LAIN (bukan diri sendiri) yang
            // memakai stok sendiri (bukan "Tidak Pakai Stok") dan belum
            // punya Acuan Stok sendiri (mencegah rantai bertingkat).
            let stockRefCandidates = productsCache.filter(pr =>
              (!isEdit || pr.ProductCode !== p.ProductCode) &&
              String(pr.UsesStock || 'Ya').trim() !== 'Tidak' &&
              !String(pr.StockRefCode || '').trim());
            let stockRefOptions = stockRefCandidates.map(pr =>
              `<option value="${esc(pr.ProductCode)}" ${isEdit && p.StockRefCode===pr.ProductCode?'selected':''}>${esc(pr.ProductCode)} - ${esc(pr.ProductName)}</option>`).join('');
            renderProductModal_(isEdit, p, catOptions, outletChecks, itemTypeOptions, stockRefOptions);
          }).withFailureHandler(errHandler).getProductTypes();
        }).withFailureHandler(errHandler).getApplicableUnits();
      }).withFailureHandler(errHandler).getCategories();
    }

    function renderProductModal_(isEdit, p, catOptions, outletChecks, itemTypeOptions, stockRefOptions) {
        Swal.fire({
          title: isEdit ? 'Edit Produk' : 'Tambah Produk Baru',
          width: 480,
          html: `
            <input id="swal-code" class="swal2-input" placeholder="Kode Barang" value="${isEdit?p.ProductCode:''}" ${isEdit?'disabled':''}>
            <input id="swal-name" class="swal2-input" placeholder="Nama Produk" value="${isEdit?p.ProductName:''}">
            <input id="swal-variant" class="swal2-input" placeholder="Varian (opsional)" value="${isEdit?p.Variant:''}">
            <select id="swal-category" class="swal2-select" style="width:100%">${catOptions}</select>
            <div class="text-start mt-2 mb-2">
              <label class="form-label small fw-bold mb-1">Outlet Penjualan (boleh pilih lebih dari satu)</label>
              <div>${outletChecks}</div>
              <div class="form-text">Contoh: produk F&B bisa dicentang "Resto" + "Loket Wahana" sekaligus jika dijual di dua kasir itu.</div>
            </div>
            <div class="text-start mt-2 mb-2">
              <label class="form-label small fw-bold mb-1">Tipe Barang (untuk modul Warehouse)</label>
              <select id="swal-itemtype" class="swal2-select" style="width:100%">${itemTypeOptions}</select>
              <div class="form-text">Daftar tipe bisa ditambah/edit/hapus sendiri di menu Kategori &amp; Metode Pembayaran &gt; Tipe Produk.</div>
            </div>
            <input id="swal-unit" class="swal2-input" placeholder="Satuan (Pcs/Tiket/Cup/Porsi)" value="${isEdit?p.Unit:''}">
            <input id="swal-buyprice" class="swal2-input" type="number" placeholder="Harga Beli (Rp)" value="${isEdit?p.BuyPrice:''}" oninput="updateRpPreview(this,'preview-buyprice')">
            <div id="preview-buyprice" class="text-muted small text-start mb-2" style="margin-left:1.8em;">${fmtRp(isEdit?p.BuyPrice:0)}</div>
            <input id="swal-sellprice" class="swal2-input" type="number" placeholder="Harga Jual (Rp)" value="${isEdit?p.SellPrice:''}" oninput="updateRpPreview(this,'preview-sellprice')">
            <div id="preview-sellprice" class="text-muted small text-start mb-2" style="margin-left:1.8em;">${fmtRp(isEdit?p.SellPrice:0)}</div>
            <div class="text-start mt-2 mb-2">
              <label class="form-label small fw-bold mb-1">Harga Fleksibel</label>
              <div class="form-check form-switch">

    // sendiri). Kalau Acuan Stok dipilih, toggle "Pakai Stok" otomatis
    // dikunci ke posisi aktif (stoknya memang tetap dipotong, cuma lewat
    // produk acuan) supaya tidak membingungkan/tidak bisa dimatikan manual.
    function toggleInitialStockField() {
      let cb = document.getElementById('swal-usesstock');
      let field = document.getElementById('swal-initialstock');
      let refSel = document.getElementById('swal-stockrefcode');
      let hasRef = !!(refSel && refSel.value);
      if (cb) {
        if (hasRef) { cb.checked = true; cb.disabled = true; } else { cb.disabled = false; }
      }
      if (!field) return;
      field.style.display = (cb && cb.checked && !hasRef) ? '' : 'none';
    }
