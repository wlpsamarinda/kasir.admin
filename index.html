          </div>
          <div id="menuconfig-body"><p class="text-muted small mb-0">Memuat...</p></div>
        </div>`);
      loadMenuConfigForm();
    }

    function loadMenuConfigForm() {
      google.script.run.withSuccessHandler(function(res) {
        if (!res || !res.success) { $('#menuconfig-body').html('<p class="text-danger small mb-0">Gagal memuat: ' + esc(res ? res.message : 'Tidak ada respon dari server') + '</p>'); return; }
        let cfg = res.config;
        let groups = {}, order = [];
        Object.keys(cfg).forEach(key => {
          let g = cfg[key].group || 'Lainnya';
          if (!groups[g]) { groups[g] = []; order.push(g); }
          groups[g].push(key);
        });
        let html = '';
        order.forEach(g => {
          html += `<h6 class="text-muted text-uppercase small mt-3 mb-2">${esc(g)}</h6>
            <div class="table-responsive mb-2"><table class="table table-sm align-middle">
              <thead><tr><th style="width:50px">Ikon</th><th style="min-width:180px">Nama Class Ikon</th><th>Nama Menu</th></tr></thead><tbody>`;
          groups[g].forEach(key => {
            let item = cfg[key];
            let hasIcon = item.icon !== undefined && item.icon !== null && item.icon !== '';
            html += `<tr data-key="${key}">
              <td class="text-center">${hasIcon ? `<i class="fa-solid ${esc(item.icon)} menuconfig-icon-preview" style="font-size:1.1rem"></i>` : '<span class="text-muted">-</span>'}</td>
              <td>${hasIcon ? `<input type="text" class="form-control form-control-sm menuconfig-icon-input" value="${esc(item.icon)}" oninput="updateMenuConfigIconPreview(this)">` : '<span class="text-muted">-</span>'}</td>
              <td><input type="text" class="form-control form-control-sm menuconfig-label-input" value="${esc(item.label)}"></td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        });
        $('#menuconfig-body').html(html);
      }).withFailureHandler(function(err) { $('#menuconfig-body').html('<p class="text-danger small mb-0">Gagal memuat: ' + esc(err.message || err) + '</p>'); }).getMenuConfig(sessionToken);
    }

    function updateMenuConfigIconPreview(inputEl) {
      let tr = $(inputEl).closest('tr');
      let val = ($(inputEl).val() || '').trim() || 'fa-circle';
      tr.find('.menuconfig-icon-preview').attr('class', 'fa-solid ' + val + ' menuconfig-icon-preview').css('font-size', '1.1rem');
    }

    function saveMenuConfigForm() {
      let overrides = {};
      $('#menuconfig-body tr[data-key]').each(function() {
        let tr = $(this);
        let key = tr.data('key');
        let entry = { label: tr.find('.menuconfig-label-input').val() };
        let iconInput = tr.find('.menuconfig-icon-input');
        if (iconInput.length) entry.icon = iconInput.val();
        overrides[key] = entry;
      });
      Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      google.script.run.withSuccessHandler(function(res) {
        Swal.close();
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadMenuConfig(function() { renderSidebar(); setActiveNav('menuconfig'); });
      }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).saveMenuConfig(overrides, sessionToken);
    }

    function resetMenuConfigForm() {
      Swal.fire({ title: 'Kembalikan semua nama & ikon menu ke default?', text: 'Semua kustomisasi nama & ikon menu/submenu yang pernah disimpan akan dihapus.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Reset' }).then(r => {
        if (!r.isConfirmed) return;
        google.script.run.withSuccessHandler(function(res) {
          if (!res.success) return Swal.fire('Gagal', res.message, 'error');
          Toast.fire({ icon: 'success', title: res.message });
          loadMenuConfig(function() { renderSidebar(); setActiveNav('menuconfig'); loadMenuConfigForm(); });
        }).withFailureHandler(errHandler).resetMenuConfig(sessionToken);
      });
    }

    let currentSalesFormUnit = 'Entrance';
    function switchSalesFormTab(ev, unit) {
      if (ev) ev.preventDefault();
      currentSalesFormUnit = unit;
      $('#salesform-unit-tabs .nav-link').removeClass('active');
      $('#salesform-unit-tabs .nav-link[data-unit="' + unit + '"]').addClass('active');
      loadSalesFormConfigPanel(unit);
    }

    function loadSalesFormConfigPanel(unit) {
      $('#salesform-config-body').html('<p class="text-muted small mb-0">Memuat...</p>');
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) { $('#salesform-config-body').html('<p class="text-danger small mb-0">Gagal memuat: ' + esc(res.message) + '</p>'); return; }
        let cfg = res.config;
        let fields = SALES_FORM_STOCK_KEYS.slice();
        if (res.hasSerial) fields = fields.concat(['SerialStart', 'SerialEnd']);
        let rows = fields.map(function(k) {
          let f = cfg[k];
          return `<tr data-field="${k}">
            <td>${SALES_FORM_FIELD_LABELS[k]}</td>
            <td class="text-center"><input type="checkbox" class="form-check-input salesform-show" ${f.show?'checked':''}></td>
            <td class="text-center"><input type="checkbox" class="form-check-input salesform-edit" ${f.editable?'checked':''} ${f.show?'':'disabled'}></td>
          </tr>`;
        }).join('');
        $('#salesform-config-body').html(`
          <div class="table-responsive">
          <table class="table table-sm align-middle mb-2">
            <thead><tr><th>Field</th><th class="text-center" style="width:110px">Tampilkan</th><th class="text-center" style="width:160px">Bisa Diedit Kasir</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          </div>
          ${!res.hasSerial ? '<p class="text-muted small mb-2"><i class="fa-solid fa-circle-info me-1"></i>Kasir unit ini belum punya kolom Nomor Seri di database, jadi field seri belum bisa diaktifkan di sini.</p>' : ''}
          <p class="text-muted small mb-2"><i class="fa-solid fa-circle-info me-1"></i>Pengaturan di atas adalah template umum untuk seluruh outlet ini. Untuk produk tertentu yang "Tidak Pakai Stok", semua field Stok/Seri tetap tidak akan tampil apa pun pengaturan di sini - dan untuk produk yang "Tidak Pakai Nomor Seri", field Nomor Seri tetap tersembunyi. Atur kedua opsi tersebut per produk di menu Master Produk.</p>
          <button class="btn btn-primary btn-sm" onclick="saveSalesFormConfigPanel()"><i class="fa-solid fa-save me-2"></i>Simpan Pengaturan Form</button>`);
        $('#salesform-config-body .salesform-show').on('change', function() {
          let row = $(this).closest('tr');
          let editChk = row.find('.salesform-edit');
          editChk.prop('disabled', !this.checked);
          if (!this.checked) editChk.prop('checked', false);
        });
      }).withFailureHandler(errHandler).getSalesFormConfig(unit);
    }

    function saveSalesFormConfigPanel() {
      let unit = currentSalesFormUnit;
      let payload = {};
      $('#salesform-config-body tbody tr').each(function() {
        let field = $(this).data('field');
        let show = $(this).find('.salesform-show').is(':checked');
        let editable = $(this).find('.salesform-edit').is(':checked');
        payload[field] = { show: show, editable: editable };
      });
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
      }).withFailureHandler(errHandler).saveSalesFormConfig(unit, payload, sessionToken);
    }

    function loadDbInfoBox() {
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) { $('#db-info-box').text('Gagal memuat info database: ' + res.message); return; }
        let c = res.counts || {};
        $('#db-info-box').html(`
          Nama: <strong>${esc(res.name)}</strong><br>
          Baris data — Loket Masuk: ${esc(c.Entrance_Sales)}, Loket Wahana: ${esc(c.Ride_Sales)}, Resto: ${esc(c.Resto_Sales)}, Produk: ${esc(c.Products)}<br>
          Dijalankan sebagai akun: ${esc(res.executingAs)}`);
      }).withFailureHandler(errHandler).getDatabaseInfo(sessionToken);
    }

    function switchDatabase() {
      let val = $('#db-switch-input').val().trim();
      if (!val) return Swal.fire('Perhatian', 'Tempel link atau ID spreadsheet terlebih dahulu.', 'warning');
      Swal.fire({
        title: 'Sambungkan ke spreadsheet ini?',
        text: 'Aplikasi akan mulai membaca & menulis ke spreadsheet yang Anda tempel di atas, mulai sekarang.',
        icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Sambungkan'
      }).then(r => {
        if (r.isConfirmed) {
          Swal.fire({ title: 'Menyambungkan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          google.script.run.withSuccessHandler(res => {
            Swal.close();
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Swal.fire('Berhasil', res.message, 'success');
            $('#db-switch-input').val('');
            loadDbInfoBox();
          }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).setDatabaseId(val, sessionToken);
        }
      });
    }

    const DB_DIAG_SEVERITY_BADGE = { high: 'db-pill-danger', medium: 'db-pill-warn', low: 'db-pill-neutral' };

    function runDbDiagnostic() {
      $('#db-diag-run-btn').prop('disabled', true);
      $('#db-diag-result').html('<p class="text-muted small mb-0"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memeriksa database...</p>');
      google.script.run.withSuccessHandler(function(res) {
        $('#db-diag-run-btn').prop('disabled', false);
        if (!res.success) { $('#db-diag-result').html('<p class="text-danger small mb-0">Gagal menjalankan diagnostic: ' + esc(res.message) + '</p>'); return; }
        renderDbDiagResult(res.issues, res.summary, res.inventory);
      }).withFailureHandler(function(err) { $('#db-diag-run-btn').prop('disabled', false); errHandler(err); }).runDatabaseDiagnostic(sessionToken);
    }

    function renderSheetInventoryTable(inventory) {
      if (!inventory || !inventory.length) return '';
      let rows = inventory.map(function(s) {
        let statusBadge = s.status === 'OK' ? '<span class="db-pill db-pill-ok">OK</span>' : '<span class="db-pill db-pill-danger">Missing</span>';
        let missingCols = '<span class="text-muted">-</span>';
        if (s.status === 'OK' && s.headerStatus !== 'OK' && s.headerStatus !== '-') {
          missingCols = '<span class="db-pill db-pill-warn">' + esc(s.headerStatus) + '</span>';
        }
        return '<tr><td>' + esc(s.name) + '</td><td>' + statusBadge + '</td><td>' + (s.status === 'OK' ? s.rowCount : '-') + '</td><td>' + missingCols + '</td></tr>';
      }).join('');
      return '<div class="table-responsive mb-3"><table class="db-diag-table mb-0">' +
        '<thead><tr><th>Sheet</th><th>Status</th><th>Rows</th><th>Kolom Hilang</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>';
    }

    function renderDbDiagResult(issues, summary, inventory) {
      let inventoryHtml = '<h6 class="mb-2">Daftar Sheet di Database (' + inventory.length + ' sheet seharusnya ada)</h6>' + renderSheetInventoryTable(inventory);

      if (!issues.length) {
        $('#db-diag-result').html(inventoryHtml + '<div class="alert alert-success mb-0"><i class="fa-solid fa-circle-check me-2"></i>Tidak ditemukan masalah pada database. Semua sheet, kolom, dan data master sudah sesuai.</div>');
        return;
      }
      let rows = issues.map(function(iss) {
        let badge = DB_DIAG_SEVERITY_BADGE[iss.severity] || 'db-pill-neutral';
        let fixBadge = iss.autoFixable
          ? '<span class="db-pill db-pill-ok">Bisa diperbaiki otomatis</span>'
          : '<span class="db-pill db-pill-neutral">Perlu tinjauan manual</span>';
        let extra = '';
        if (iss.category === 'duplicate_file' && iss.detail) {
          extra = '<ul class="small mb-0 mt-1">' + iss.detail.map(function(f) {
            return '<li>' + (f.connected ? '<strong>[Tersambung sekarang]</strong> ' : '') + '<a href="' + esc(f.url) + '" target="_blank">' + esc(f.url) + '</a></li>';
          }).join('') + '</ul>';
        }
        if ((iss.category === 'duplicate_row' || iss.category === 'duplicate_row_review') && iss.detail) {
          extra = '<ul class="small mb-0 mt-1">' + iss.detail.duplicates.map(function(d) {
            return '<li>' + esc(iss.detail.idCol) + ' = ' + esc(d.value) + ' &rarr; baris ' + d.rowNumbers.join(', ') + '</li>';
          }).join('') + '</ul>';
        }
        if (iss.category === 'missing_warehouse_seed' && iss.detail) {
          extra = '<ul class="small mb-0 mt-1">' + iss.detail.missing.map(function(w) {
            return '<li>' + esc(w[0]) + ' - ' + esc(w[1]) + '</li>';
          }).join('') + '</ul>';
        }
        return '<div class="db-issue-item">' +
          '<div class="d-flex justify-content-between align-items-start gap-2">' +
          '<div><span class="db-pill ' + badge + ' me-2">' + esc(iss.severity) + '</span><strong>' + esc(iss.title) + '</strong></div>' +
          fixBadge +
          '</div>' +
          '<div class="small text-muted mt-1">' + esc(iss.description) + '</div>' + extra +
          '</div>';
      }).join('');
      $('#db-diag-result').html(
        inventoryHtml +
        '<h6 class="mb-2">Masalah Ditemukan</h6>' +
        '<div class="small text-muted mb-2">' + summary.total + ' masalah ditemukan &mdash; ' + summary.autoFixable + ' bisa diperbaiki otomatis, ' + summary.needsReview + ' perlu tinjauan manual.</div>' + rows
      );
    }

    function repairDbAuto() {
      Swal.fire({
        title: 'Perbaiki masalah database sekarang?',
        html: 'Sheet/kolom yang hilang akan dibuat, data gudang wajib yang belum ada akan ditambahkan, dan baris data master yang dobel akan dihapus (baris pertama tiap ID dipertahankan). Data transaksi/akun dobel & spreadsheet ganda TIDAK akan dihapus otomatis.',
        icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Perbaiki Sekarang'
      }).then(function(r) {
        if (!r.isConfirmed) return;
        Swal.fire({ title: 'Memperbaiki database...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        google.script.run.withSuccessHandler(function(res) {
          Swal.close();
          if (!res.success) return Swal.fire('Gagal', res.message, 'error');
          Swal.fire('Selesai', res.fixedCount + ' perbaikan berhasil dijalankan.', 'success');
          renderDbDiagResult(res.remainingIssues, {
            total: res.remainingIssues.length,
            autoFixable: res.remainingIssues.filter(i => i.autoFixable).length,
            needsReview: res.remainingIssues.filter(i => !i.autoFixable).length
          }, res.inventory);
          loadDbInfoBox();
        }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).repairDatabaseAuto(sessionToken);
      });
    }

    function loadSettingsForm() {
      google.script.run.withSuccessHandler(function(s) {
        $('#settings-form').html(`
          <div class="mb-2"><label class="form-label small">Nama Aplikasi</label><input id="set-appname" class="form-control" value="${s.APP_NAME||''}"></div>
          <div class="mb-2"><label class="form-label small">Nama Perusahaan</label><input id="set-company" class="form-control" value="${s.COMPANY_NAME||''}"></div>
          <div class="mb-2"><label class="form-label small">Alamat</label><input id="set-address" class="form-control" value="${s.ADDRESS||''}"></div>
          <div class="mb-2"><label class="form-label small">Telepon</label><input id="set-phone" class="form-control" value="${s.PHONE||''}"></div>
          <div class="mb-2"><label class="form-label small">Email</label><input id="set-email" class="form-control" value="${s.EMAIL||''}"></div>
          <div class="mb-2"><label class="form-label small">Timezone</label><input id="set-timezone" class="form-control" value="${s.TIMEZONE||''}"></div>`);
        if (s.LOGO_URL) { $('#logo-preview').attr('src', s.LOGO_URL).show(); }

        let enforceStock = s.ENABLE_STOCK_VALIDATION === 'Yes';
        let showPayment = s.SHOW_PAYMENT_METHOD_IN_SALES === 'Yes';
        let lockSaldoAwal = (s.LOCK_MANUAL_SALDO_AWAL || 'Yes') !== 'No';
        $('#feature-settings-form').html(`
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="feat-stock-validation" ${enforceStock?'checked':''}>
            <label class="form-check-label" for="feat-stock-validation">Tolak input penjualan jika stok kurang</label>
            <div class="form-text">Nonaktif (default) = kasir tetap bisa input penjualan walau stok 0/minus, stok bisa disusulkan lewat Manajemen Stok.</div>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="feat-show-payment" ${showPayment?'checked':''}>
            <label class="form-check-label" for="feat-show-payment">Tampilkan metode pembayaran di form Input Penjualan</label>
            <div class="form-text">Nonaktif (default) = metode pembayaran tidak ditanyakan saat input penjualan; uang yang diterima kasir dicatat terpisah lewat menu Penerimaan Uang untuk rekap harian.</div>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="feat-lock-saldo-awal" ${lockSaldoAwal?'checked':''}>
            <label class="form-check-label" for="feat-lock-saldo-awal">Kunci penginputan Saldo Awal manual (Admin Keuangan)</label>
            <div class="form-text">Aktif (default) = Admin Keuangan <strong>tidak bisa</strong> mengetik manual Saldo Awal Brangkas/Rekening di menu Saldo &amp; Kas - nilainya otomatis terisi dari Saldo Akhir hari sebelumnya. Nonaktifkan sementara kalau Owner perlu mengizinkan Admin Keuangan menginput Saldo Awal secara manual (mis. koreksi data atau input pertama kali).</div>
          </div>`);
      }).withFailureHandler(errHandler).getSystemSettings();
    }

    function saveSettings() {
      let payload = {
        APP_NAME: $('#set-appname').val(), COMPANY_NAME: $('#set-company').val(),
        ADDRESS: $('#set-address').val(), PHONE: $('#set-phone').val(),
        EMAIL: $('#set-email').val(), TIMEZONE: $('#set-timezone').val(),
        ENABLE_STOCK_VALIDATION: $('#feat-stock-validation').is(':checked') ? 'Yes' : 'No',
        SHOW_PAYMENT_METHOD_IN_SALES: $('#feat-show-payment').is(':checked') ? 'Yes' : 'No',
        LOCK_MANUAL_SALDO_AWAL: $('#feat-lock-saldo-awal').is(':checked') ? 'Yes' : 'No'
      };
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
      }).withFailureHandler(errHandler).saveSystemSettings(payload, sessionToken);
    }

    function uploadLogoFile() {
      let fileInput = document.getElementById('logo-input');
      if (!fileInput.files.length) return Swal.fire('Perhatian', 'Pilih file logo terlebih dahulu.', 'warning');
      let file = fileInput.files[0];
      let allowedTypes = ['image/png', 'image/jpeg', 'image/jpg'];
      if (allowedTypes.indexOf(file.type) === -1) {
        return Swal.fire('Format Tidak Didukung', 'Logo harus berformat PNG atau JPG.', 'warning');
      }
      if (file.size > 45000) {
        return Swal.fire('Ukuran Terlalu Besar', 'Gunakan file PNG/JPG berukuran di bawah ±40KB agar tersimpan dengan baik.', 'warning');
      }
      let reader = new FileReader();
      reader.onload = function() {
        let base64 = reader.result.split(',')[1];
        Swal.fire({ title: 'Mengunggah logo...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        google.script.run.withSuccessHandler(res => {
          Swal.close();
          if (!res.success) return Swal.fire('Gagal', res.message, 'error');
          $('#logo-preview').attr('src', res.url).show();
          applyLogo(res.url);
          Toast.fire({ icon: 'success', title: 'Logo berhasil diperbarui' });
        }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).uploadLogo(base64, file.type, file.name, sessionToken);
      };
      reader.readAsDataURL(file);
    }

    function openDatabaseLink() {
      google.script.run.withSuccessHandler(res => {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        window.open(res.url, '_blank');
      }).withFailureHandler(errHandler).getDatabaseInfo(sessionToken);
    }

    function doBackup() {
      Swal.fire({ title: 'Membuat backup...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      google.script.run.withSuccessHandler(res => {
        Swal.close();
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Swal.fire('Berhasil', res.message, 'success');
      }).withFailureHandler(errHandler).triggerManualBackup(sessionToken);
    }
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW gagal', e); }); });
  }
</script>
</body>
</html>
