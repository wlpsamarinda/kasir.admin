              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small mb-1">Jumlah (Rp)</label>
              <input type="number" min="1" id="fmu-amount" class="form-control form-control-sm" placeholder="Jumlah">
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">Keterangan (opsional)</label>
              <input type="text" id="fmu-notes" class="form-control form-control-sm" placeholder="mis. Setor tunai ke rekening PT">
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary btn-sm w-100" onclick="submitFinanceMutation()"><i class="fa-solid fa-right-left me-2"></i>Catat Mutasi</button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0 text-muted">Riwayat Mutasi Saldo</h6>
            <div class="d-flex flex-wrap gap-1">
              <button class="btn btn-sm btn-outline-secondary fmu-quick" data-quick="today" onclick="setFinanceMutationQuickRange('today')">Hari Ini</button>
              <button class="btn btn-sm btn-outline-secondary fmu-quick" data-quick="month" onclick="setFinanceMutationQuickRange('month')">Bulan Ini</button>
              <button class="btn btn-sm btn-outline-secondary fmu-quick" data-quick="year" onclick="setFinanceMutationQuickRange('year')">Tahun Ini</button>
              <button class="btn btn-sm btn-outline-secondary fmu-quick" data-quick="all" onclick="setFinanceMutationQuickRange('all')">Semua</button>
            </div>
          </div>
          <div class="d-flex flex-wrap align-items-end gap-2 mb-2">
            <div>
              <label class="form-label small mb-1">Dari Tanggal</label>
              <input type="date" id="fmu-hist-start" class="form-control form-control-sm" max="${todayStr()}" value="${todayStr()}">
            </div>
            <div>
              <label class="form-label small mb-1">Sampai Tanggal</label>
              <input type="date" id="fmu-hist-end" class="form-control form-control-sm" max="${todayStr()}" value="${todayStr()}">
            </div>
            <button class="btn btn-sm btn-primary" onclick="setFinanceMutationQuickRange(null)"><i class="fa-solid fa-magnifying-glass me-1"></i>Tampilkan</button>
          </div>
          <div class="table-responsive" style="max-height:40vh;overflow-y:auto" id="fmu-history-wrap">
            <div class="text-center text-muted py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat riwayat...</div>
          </div>
        </div>`);
      loadFinanceBalanceForm();
      loadFinanceBalanceHistory();
      syncFinanceMutationTo_();
      setFinanceMutationQuickRange('today');
    }

    // Dari/Ke Mutasi Saldo hanya ada 2 bucket (Brangkas/Rekening) - begitu
    // "Dari" dipilih, "Ke" otomatis jadi bucket satunya (tidak bisa sama).
    function syncFinanceMutationTo_() {
      let from = $('#fmu-from').val();
      let to = (from === 'Brangkas') ? 'Rekening' : 'Brangkas';
      let toLabel = (to === 'Brangkas') ? 'Brangkas' : 'Rekening PT';
      $('#fmu-to').html(`<option value="${to}">${toLabel}</option>`);
    }

    function submitFinanceMutation() {
      let dateStr = $('#fmu-date').val();
      let fromBucket = $('#fmu-from').val();
      let toBucket = $('#fmu-to').val();
      let amount = $('#fmu-amount').val();
      let notes = $('#fmu-notes').val();
      if (!dateStr) return Swal.fire('Perhatian', 'Pilih tanggal mutasi.', 'warning');
      if (!amount || Number(amount) <= 0) return Swal.fire('Perhatian', 'Isi jumlah mutasi dengan benar.', 'warning');
      let fromLabel = fromBucket === 'Brangkas' ? 'Brangkas' : 'Rekening PT';
      let toLabel = toBucket === 'Brangkas' ? 'Brangkas' : 'Rekening PT';
      Swal.fire({
        title: 'Catat mutasi saldo ini?',
        html: 'Pindahkan <strong>' + fmtRp(amount) + '</strong> dari <strong>' + fromLabel + '</strong> ke <strong>' + toLabel + '</strong> tanggal ' + fmtDate(dateStr) + '.',
        icon: 'question', showCancelButton: true, confirmButtonText: 'Catat'
      }).then(r => {
        if (!r.isConfirmed) return;
        google.script.run.withSuccessHandler(res => {
          if (!res.success) return Swal.fire('Gagal', res.message, 'error');
          Toast.fire({ icon: 'success', title: res.message });
          $('#fmu-amount').val(''); $('#fmu-notes').val('');
          loadFinanceMutationHistory();
          // Kalau tanggal mutasi = tanggal yang sedang dibuka di form Saldo
          // Awal & Akhir, muat ulang supaya Saldo Akhir Aktual/Estimasi yang
          // ditampilkan langsung ikut ter-update.
          if (dateStr === financeBalanceDate) loadFinanceBalanceForm();
          loadFinanceBalanceHistory();
        }).withFailureHandler(errHandler).addFinanceMutation({ Date: dateStr, FromBucket: fromBucket, ToBucket: toBucket, Amount: amount, Notes: notes }, sessionToken);
      });
    }

    function setFinanceMutationQuickRange(quick) {
      let today = todayStr();
      if (quick === 'today') {
        $('#fmu-hist-start').val(today); $('#fmu-hist-end').val(today);
      } else if (quick === 'month') {
        let d = new Date();
        $('#fmu-hist-start').val(new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10));
        $('#fmu-hist-end').val(today);
      } else if (quick === 'year') {
        let d = new Date();
        $('#fmu-hist-start').val(new Date(d.getFullYear(), 0, 1).toISOString().slice(0, 10));
        $('#fmu-hist-end').val(today);
      } else if (quick === 'all') {
        $('#fmu-hist-start').val(''); $('#fmu-hist-end').val('');
      }
      $('.fmu-quick').removeClass('active btn-primary').addClass('btn-outline-secondary');
      if (quick) $('.fmu-quick[data-quick="' + quick + '"]').removeClass('btn-outline-secondary').addClass('active btn-primary');
      loadFinanceMutationHistory();
    }

    function loadFinanceMutationHistory() {
      let startDate = $('#fmu-hist-start').val() || '';
      let endDate = $('#fmu-hist-end').val() || '';
      $('#fmu-history-wrap').html('<div class="text-center text-muted py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat riwayat...</div>');
      google.script.run.withSuccessHandler(res => {
        if (!res) return $('#fmu-history-wrap').html('<p class="text-danger small text-center mb-0">Tidak ada respon dari server, coba lagi.</p>');
        if (!res.success) return $('#fmu-history-wrap').html('<p class="text-danger small text-center mb-0">Gagal memuat: ' + esc(res.message) + '</p>');
        let rows = res.history.map(m => `<tr>
            <td class="text-nowrap">${fmtDate(m.Date)}</td>
            <td>${esc(m.FromBucket === 'Rekening' ? 'Rekening PT' : m.FromBucket)}</td>
            <td class="text-center"><i class="fa-solid fa-arrow-right text-muted"></i></td>
            <td>${esc(m.ToBucket === 'Rekening' ? 'Rekening PT' : m.ToBucket)}</td>
            <td class="text-end">${fmtRp(m.Amount)}</td>
            <td>${esc(m.Notes || '-')}</td>
            <td>${esc(m.CreatedBy || '-')}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteFinanceMutationRow('${esc(m.MutationID)}','${esc(m.Date)}')" title="Hapus"><i class="fa-solid fa-trash"></i></button></td>
          </tr>`).join('');
        let note = (res.totalMatching > res.history.length)
          ? `<p class="text-muted small mt-2 mb-0">Menampilkan ${res.history.length} dari ${res.totalMatching} mutasi pada rentang ini (terbaru dulu).</p>` : '';
        $('#fmu-history-wrap').html(`<table class="table table-striped table-sm w-100 mb-0">
            <thead><tr><th>Tanggal</th><th>Dari</th><th></th><th>Ke</th><th class="text-end">Jumlah</th><th>Keterangan</th><th>Oleh</th><th>Aksi</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="8" class="text-center text-muted">Tidak ada mutasi saldo pada rentang tanggal ini</td></tr>'}</tbody>
          </table>${note}`);
      }).withFailureHandler(errHandler).getFinanceMutationHistory(startDate, endDate, sessionToken);
    }

    function deleteFinanceMutationRow(mutationId, dateStr) {
      Swal.fire({ title: 'Hapus mutasi saldo ini?', text: 'Saldo Akhir Brangkas/Rekening tanggal ' + fmtDate(dateStr) + ' akan dihitung ulang tanpa mutasi ini.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (!r.isConfirmed) return;
        google.script.run.withSuccessHandler(res => {
          if (!res.success) return Swal.fire('Gagal', res.message, 'error');
          Toast.fire({ icon: 'success', title: res.message });
          loadFinanceMutationHistory();
          if (dateStr === financeBalanceDate) loadFinanceBalanceForm();
          loadFinanceBalanceHistory();
        }).withFailureHandler(errHandler).deleteFinanceMutation(mutationId, sessionToken);
      });
    }

    let financeBalanceHistoryCache = [];

    function loadFinanceBalanceHistory() {
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        financeBalanceHistoryCache = res.data || [];
        let rows = financeBalanceHistoryCache.map(b => `<tr>
          <td>${fmtDate(b.Date)}</td>
          <td class="text-end">${fmtRp(b.SaldoAwalBrangkas)}</td>
          <td class="text-end">${fmtRp(b.SaldoAwalRekening)}</td>
          <td class="text-end">${fmtRp(b.SaldoTHR)}</td>
          <td class="text-end">${b.SaldoAkhirBrangkasAktual === '' || b.SaldoAkhirBrangkasAktual === undefined ? '<span class="text-muted">Otomatis</span>' : fmtRp(b.SaldoAkhirBrangkasAktual)}</td>
          <td class="text-end">${b.SaldoAkhirRekeningAktual === '' || b.SaldoAkhirRekeningAktual === undefined ? '<span class="text-muted">Otomatis</span>' : fmtRp(b.SaldoAkhirRekeningAktual)}</td>
          <td>${esc(b.CreatedBy || '-')}</td>
          <td>${b.UpdatedAt ? new Date(b.UpdatedAt).toLocaleString('id-ID') : '-'}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editFinanceBalanceRow('${esc(b.Date)}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteFinanceBalanceRow('${esc(b.BalanceID)}','${esc(b.Date)}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`).join('');
        $('#fin-bal-history-tbody').html(rows);
        let sel = '#fin-bal-history-table';
        if ($.fn.DataTable.isDataTable(sel)) $(sel).DataTable().destroy();
        $(sel).DataTable({ pageLength: 10, order: [[0, 'desc']], columnDefs: [{ orderable: false, targets: -1 }], language: { emptyTable: 'Belum ada riwayat saldo yang diinput' } });
      }).withFailureHandler(errHandler).getFinanceBalanceHistory(sessionToken);
    }

    // Edit: arahkan form Saldo Awal & Akhir di atas ke tanggal baris yang
    // dipilih (form sama dipakai untuk tambah maupun edit - simpan ulang
    // otomatis meng-update baris tanggal tersebut, bukan membuat baris baru).
    function editFinanceBalanceRow(dateStr) {
      $('#fin-bal-date').val(dateStr);
      onFinanceBalanceDateChange();
      let card = document.getElementById('fin-bal-date');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      Toast.fire({ icon: 'info', title: 'Form Saldo diarahkan ke tanggal ' + fmtDate(dateStr) });
    }

    function deleteFinanceBalanceRow(balanceId, dateStr) {
      Swal.fire({ title: 'Hapus Data Saldo?', text: 'Data saldo tanggal ' + fmtDate(dateStr) + ' akan dihapus permanen.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus' }).then(r => {
        if (r.isConfirmed) {
          google.script.run.withSuccessHandler(res => {
            if (!res.success) return Swal.fire('Gagal', res.message, 'error');
            Toast.fire({ icon: 'success', title: res.message });
            loadFinanceBalanceHistory();
            if (financeBalanceDate === dateStr) loadFinanceBalanceForm();
          }).withFailureHandler(errHandler).deleteFinanceBalance(balanceId, sessionToken);
        }
      });
    }

    function onFinanceBalanceDateChange() {
      financeBalanceDate = $('#fin-bal-date').val();
      loadFinanceBalanceForm();
    }

    // Komponen arus kas (dari kasir & pengeluaran) hari yang sedang dibuka -
    // dipakai recalcFinanceBalanceDisplay_() untuk menghitung Saldo Akhir
    // Brangkas/Rekening (Estimasi) secara langsung setiap Saldo Awal diketik,
    // tanpa perlu round-trip ke server lagi.
    let financeBalanceFlow = { cashBersih: 0, totalNonCash: 0, totalExpBrangkas: 0, totalExpRekening: 0, mutasiNetBrangkas: 0, mutasiNetRekening: 0 };

    function recalcFinanceBalanceDisplay_() {
      let awalBrangkas = Number($('#fin-saldo-awal-brangkas').val()) || 0;
      let awalRekening = Number($('#fin-saldo-awal-rekening').val()) || 0;
      $('#fin-total-saldo-awal').text(fmtRp(awalBrangkas + awalRekening));

      let akhirBrangkasEstimasi = awalBrangkas + financeBalanceFlow.cashBersih - financeBalanceFlow.totalExpBrangkas + financeBalanceFlow.mutasiNetBrangkas;
      let akhirRekeningEstimasi = awalRekening + financeBalanceFlow.totalNonCash - financeBalanceFlow.totalExpRekening + financeBalanceFlow.mutasiNetRekening;
      $('#fin-saldo-akhir-brangkas-estimasi').text(fmtRp(akhirBrangkasEstimasi));
      $('#fin-saldo-akhir-rekening-estimasi').text(fmtRp(akhirRekeningEstimasi));
      $('#fin-total-saldo-akhir-estimasi').text(fmtRp(akhirBrangkasEstimasi + akhirRekeningEstimasi));
      $('#fin-saldo-akhir-brangkas').attr('placeholder', 'Otomatis: ' + fmtRp(akhirBrangkasEstimasi));
      $('#fin-saldo-akhir-rekening').attr('placeholder', 'Otomatis: ' + fmtRp(akhirRekeningEstimasi));

      // Info kecil kalau ada Mutasi Saldo di tanggal ini, supaya jelas
      // kenapa Saldo Akhir Estimasi tidak cuma dari kas masuk/pengeluaran.
      let netB = financeBalanceFlow.mutasiNetBrangkas, netR = financeBalanceFlow.mutasiNetRekening;
      if (netB !== 0 || netR !== 0) {
        $('#fin-mutasi-net-info').show().html(
          '<div class="alert alert-info small py-2 px-3 mb-0"><i class="fa-solid fa-circle-info me-1"></i>Mutasi Saldo tanggal ini: Brangkas ' +
          (netB >= 0 ? '+' : '') + fmtRp(netB) + ', Rekening PT ' + (netR >= 0 ? '+' : '') + fmtRp(netR) + '</div>'
        );
      } else {
        $('#fin-mutasi-net-info').hide().html('');
      }
    }

    function loadFinanceBalanceForm() {
      google.script.run.withSuccessHandler(function(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        let d = res.data;
        $('#fin-saldo-awal-brangkas').val(d.SaldoAwalBrangkas || 0);
        $('#fin-saldo-awal-rekening').val(d.SaldoAwalRekening || 0);
        $('#fin-saldo-thr').val(d.SaldoTHR || 0);
        $('#fin-saldo-akhir-brangkas').val(d.SaldoAkhirBrangkasAktual === '' || d.SaldoAkhirBrangkasAktual === undefined ? '' : d.SaldoAkhirBrangkasAktual);
        $('#fin-saldo-akhir-rekening').val(d.SaldoAkhirRekeningAktual === '' || d.SaldoAkhirRekeningAktual === undefined ? '' : d.SaldoAkhirRekeningAktual);
        $('#fin-catatan').val(d.CatatanTambahan || '');

        // Saldo Awal terkunci (default) - Admin Keuangan tidak bisa mengetik
        // manual, nilainya otomatis ikut Saldo Akhir hari sebelumnya (server
        // tetap memaksa ini juga di saveFinanceBalance walau field dibuat
        // read-only di sini, supaya benar-benar tidak bisa "dibobol" lewat
        // devtools). Owner bisa membuka kunci ini di Profil Aplikasi & Fitur.
        let locked = !!d.LockManualSaldoAwal;
        $('#fin-saldo-awal-brangkas, #fin-saldo-awal-rekening').prop('readonly', locked).toggleClass('bg-light', locked);
        let lockNote = locked
          ? '<i class="fa-solid fa-lock text-secondary me-1"></i>Saldo Awal terkunci - otomatis mengikuti Saldo Akhir hari sebelumnya. Hubungi Owner (Profil Aplikasi &amp; Fitur) untuk membuka kunci ini.'
          : '<i class="fa-solid fa-lock-open text-warning me-1"></i>Saldo Awal sedang TIDAK terkunci - bisa diisi manual (mode ini dibuka oleh Owner).';
        $('#fin-bal-saved-note').html((d.isSaved
          ? '<i class="fa-solid fa-circle-check text-success me-1"></i>Data saldo tanggal ini sudah tersimpan.'
          : '<i class="fa-solid fa-circle-exclamation text-warning me-1"></i>Belum tersimpan - Saldo Awal disarankan otomatis dari Saldo Akhir hari sebelumnya.')
          + '<br>' + lockNote);
        renderFinanceDebtRows('hutang', safeJsonParse_(d.HutangJSON));
        renderFinanceDebtRows('piutang', safeJsonParse_(d.PiutangJSON));
        financeBalanceFlow = {
          cashBersih: Number(d.FlowCashBersih) || 0, totalNonCash: Number(d.FlowNonCash) || 0,
          totalExpBrangkas: Number(d.FlowExpBrangkas) || 0, totalExpRekening: Number(d.FlowExpRekening) || 0,
          mutasiNetBrangkas: Number(d.FlowMutasiNetBrangkas) || 0, mutasiNetRekening: Number(d.FlowMutasiNetRekening) || 0
        };
        recalcFinanceBalanceDisplay_();
      }).withFailureHandler(errHandler).getFinanceBalance(financeBalanceDate, sessionToken);
    }

    function safeJsonParse_(s) { try { return JSON.parse(s || '[]'); } catch (e) { return []; } }

    function renderFinanceDebtRows(kind, items) {
      let html = (items || []).map((it, idx) => `
        <div class="input-group input-group-sm mb-1" data-idx="${idx}">
          <input type="text" class="form-control fin-debt-name" value="${esc(it.name || '')}" placeholder="Nama/Keterangan">
          <input type="number" class="form-control fin-debt-amount" value="${Number(it.amount) || 0}" placeholder="Jumlah">
          <button class="btn btn-outline-danger" onclick="$(this).closest('[data-idx]').remove()"><i class="fa-solid fa-trash"></i></button>
        </div>`).join('');
      $('#fin-' + kind + '-list').html(html);
    }

    function addFinanceDebtRow(kind) {
      let wrap = $('#fin-' + kind + '-list');
      let idx = wrap.children().length;
      wrap.append(`
        <div class="input-group input-group-sm mb-1" data-idx="${idx}">
          <input type="text" class="form-control fin-debt-name" placeholder="Nama/Keterangan">
          <input type="number" class="form-control fin-debt-amount" placeholder="Jumlah">
          <button class="btn btn-outline-danger" onclick="$(this).closest('[data-idx]').remove()"><i class="fa-solid fa-trash"></i></button>
        </div>`);
    }

    function collectFinanceDebtRows(kind) {
      let items = [];
      $('#fin-' + kind + '-list [data-idx]').each(function() {
        let name = $(this).find('.fin-debt-name').val();
        let amount = Number($(this).find('.fin-debt-amount').val()) || 0;
        if (name) items.push({ name: name, amount: amount });
      });
      return items;
    }

    function saveFinanceBalanceForm() {
      let payload = {
        Date: financeBalanceDate,
        SaldoAwalBrangkas: Number($('#fin-saldo-awal-brangkas').val()) || 0,
        SaldoAwalRekening: Number($('#fin-saldo-awal-rekening').val()) || 0,
        SaldoTHR: Number($('#fin-saldo-thr').val()) || 0,
        SaldoAkhirBrangkasAktual: $('#fin-saldo-akhir-brangkas').val(),
        SaldoAkhirRekeningAktual: $('#fin-saldo-akhir-rekening').val(),
        CatatanTambahan: $('#fin-catatan').val(),
        HutangJSON: JSON.stringify(collectFinanceDebtRows('hutang')),
        PiutangJSON: JSON.stringify(collectFinanceDebtRows('piutang'))
      };
      Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      google.script.run.withSuccessHandler(function(res) {
        Swal.close();
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        Toast.fire({ icon: 'success', title: res.message });
        loadFinanceBalanceForm();
        loadFinanceBalanceHistory();
      }).withFailureHandler(function(err) { Swal.close(); errHandler(err); }).saveFinanceBalance(payload, sessionToken);
    }

    // ================= ADMIN KEUANGAN: PENGELUARAN HARIAN (detail) =================
    // Master data (Kode Akun / Status Pembayaran / Pos Penggunaan) di-cache
    // di client supaya dropdown form cepat & tidak perlu round-trip
    // tambahan tiap kali modal dibuka.
    let financeExpenseCache = [];
    let financeCoaCache = [];
    let financeStatusCache = [];
    let financePosCache = [];
    // Mode tampilan Pengeluaran Harian: 'day' (tanggal tertentu - default,
    // sama seperti sebelumnya), 'today', 'month', 'year', atau 'range'
    // (rentang tanggal bebas dari-sampai).
    let financeExpenseFilterMode = 'day';
    let financeExpenseRangeStart = todayStr();
    let financeExpenseRangeEnd = todayStr();

    function loadFinanceMasterDropdownsThen_(cb) {
      google.script.run.withSuccessHandler(function(coaRes) {
        financeCoaCache = (coaRes.success ? coaRes.data : []).filter(c => c.Status === 'Active' && c.Type === 'Pengeluaran');
        google.script.run.withSuccessHandler(function(statusRes) {
          financeStatusCache = (statusRes.success ? statusRes.data : []).filter(s => s.Status === 'Active');
          google.script.run.withSuccessHandler(function(posRes) {
            financePosCache = (posRes.success ? posRes.data : []).filter(p => p.Status === 'Active');
            cb();
          }).withFailureHandler(errHandler).getFinancePosPenggunaanList(sessionToken);
        }).withFailureHandler(errHandler).getFinancePaymentStatusList(sessionToken);
      }).withFailureHandler(errHandler).getFinanceCOA(sessionToken);
    }

    function renderFinanceExpensesView(area) {
      area.html(`
        <h2 class="fw-bold mb-1">Admin Keuangan</h2>
        <p class="text-muted mb-4">Pengeluaran Harian</p>
        <div class="card p-3 shadow-sm mb-3">
          <div class="d-flex flex-wrap gap-2 align-items-end">
            <div><label class="form-label small mb-1">Tampilkan</label>
              <select id="fin-exp-mode" class="form-select" onchange="onFinanceExpenseFilterModeChange()">
                <option value="day">Tanggal Tertentu</option>
                <option value="today">Hari Ini</option>
                <option value="month">Bulan Ini</option>
                <option value="year">Tahun Ini</option>
                <option value="range">Rentang Tanggal</option>
              </select>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-end" id="fin-exp-date-controls"></div>
            <button class="btn btn-primary" onclick="openFinanceExpenseGrid()"><i class="fa-solid fa-table-list me-2"></i>Tambah Pengeluaran</button>
            <button class="btn btn-outline-primary" onclick="loadFinanceExpenses()"><i class="fa-solid fa-rotate me-2"></i>Refresh Data</button>
            <div class="vr d-none d-md-block"></div>
            <button class="btn btn-outline-danger" onclick="exportFinanceExpenses('pdf')"><i class="fa-solid fa-file-pdf me-2"></i>Export PDF</button>
            <button class="btn btn-outline-success" onclick="exportFinanceExpenses('xlsx')"><i class="fa-solid fa-file-excel me-2"></i>Export Excel</button>
            <button class="btn btn-outline-secondary" onclick="downloadFinanceExpenseTemplate()"><i class="fa-solid fa-download me-2"></i>Template Import</button>
            <button class="btn btn-outline-secondary" onclick="document.getElementById('fin-exp-import-file').click()"><i class="fa-solid fa-upload me-2"></i>Import Excel</button>
            <input type="file" id="fin-exp-import-file" accept=".xlsx,.xls" class="d-none" onchange="handleFinanceExpenseImport(event)">
            <div class="ms-auto fw-bold" id="fin-exp-total-badge"></div>
          </div>
        </div>
        <div class="card p-3 shadow-sm">
          <div class="table-responsive"><table class="table table-sm table-striped w-100" id="fin-exp-table">
            <thead><tr>
              <th>Tanggal</th><th>Supplier</th><th>Belanja/Pengeluaran</th><th class="text-end">Harga</th>
              <th class="text-end">Qty</th><th>Sat</th><th class="text-end">Total</th><th>Status Pembayaran</th>
              <th>Pos Biaya</th><th>Pos Penggunaan</th><th>Aksi</th>
            </tr></thead>
            <tbody id="fin-exp-tbody"><tr><td colspan="11" class="text-center text-muted">Memuat...</td></tr></tbody>
          </table></div>
        </div>`);
      $('#fin-exp-mode').val(financeExpenseFilterMode);
      renderFinanceExpenseDateControls_();
      loadFinanceExpenses();
    }

    // Bangun ulang input tanggal di toolbar Pengeluaran Harian sesuai mode
    // yang sedang dipilih (tanggal tertentu / rentang bebas), atau kosong
    // untuk mode otomatis (Hari Ini/Bulan Ini/Tahun Ini yang tidak perlu
    // input tambahan).
    function renderFinanceExpenseDateControls_() {
      let html = '';
      if (financeExpenseFilterMode === 'day') {
        html = `<div><label class="form-label small mb-1">Tanggal</label><input type="date" id="fin-bal-date" class="form-control" value="${financeBalanceDate}" onchange="onFinanceExpenseDateChange()"></div>`;
      } else if (financeExpenseFilterMode === 'range') {
        html = `
          <div><label class="form-label small mb-1">Dari</label><input type="date" id="fin-exp-range-start" class="form-control" value="${financeExpenseRangeStart}" onchange="onFinanceExpenseRangeChange()"></div>
          <div><label class="form-label small mb-1">Sampai</label><input type="date" id="fin-exp-range-end" class="form-control" value="${financeExpenseRangeEnd}" onchange="onFinanceExpenseRangeChange()"></div>`;
      }
      $('#fin-exp-date-controls').html(html);
    }

    function onFinanceExpenseFilterModeChange() {
      financeExpenseFilterMode = $('#fin-exp-mode').val();
      renderFinanceExpenseDateControls_();
      loadFinanceExpenses();
    }

    function onFinanceExpenseRangeChange() {
      let start = $('#fin-exp-range-start').val();
      let end = $('#fin-exp-range-end').val();
      if (start && end && start > end) {
        Toast.fire({ icon: 'warning', title: 'Tanggal "Dari" tidak boleh melebihi "Sampai"' });
        return;
      }
      financeExpenseRangeStart = start;
      financeExpenseRangeEnd = end;
      loadFinanceExpenses();
    }

    // Hitung rentang tanggal aktual (start/end, format yyyy-MM-dd) & label
    // tampilan berdasarkan mode filter yang sedang aktif. 'day' tetap pakai
    // financeBalanceDate (dipakai getFinanceExpenses tanggal tunggal, sama
    // seperti perilaku sebelumnya) - mode lain pakai getFinanceExpensesRange.
    function computeFinanceExpenseRange_() {
      let now = new Date();
      if (financeExpenseFilterMode === 'today') {
        let t = todayStr();
        return { start: t, end: t, label: 'Hari Ini (' + fmtDate(t) + ')' };
      }
      if (financeExpenseFilterMode === 'month') {
        let y = now.getFullYear(), m = now.getMonth();
        let start = y + '-' + pad2_(m + 1) + '-01';
        let lastDay = new Date(y, m + 1, 0).getDate();
        let end = y + '-' + pad2_(m + 1) + '-' + pad2_(lastDay);
        return { start: start, end: end, label: 'Bulan Ini (' + fmtDate(start) + ' - ' + fmtDate(end) + ')' };
      }
      if (financeExpenseFilterMode === 'year') {
        let y = now.getFullYear();
        let start = y + '-01-01', end = y + '-12-31';
        return { start: start, end: end, label: 'Tahun ' + y };
      }
      if (financeExpenseFilterMode === 'range') {
        return { start: financeExpenseRangeStart, end: financeExpenseRangeEnd, label: 'Rentang ' + fmtDate(financeExpenseRangeStart) + ' - ' + fmtDate(financeExpenseRangeEnd) };
      }
      return { start: financeBalanceDate, end: financeBalanceDate, label: fmtDate(financeBalanceDate) };
    }

    // Warna badge Status Pembayaran: Belum Lunas = merah, Lunas dari
    // Brangkas = hijau, Lunas dari Rekening PT = orange (supaya beda jelas
    // dengan hijau Brangkas walau sama-sama "Lunas").
    function financeExpenseBadgeClass_(e) {
      if (e.Category === 'BelumLunas') return 'bg-danger';
      if (e.Category === 'RekeningPT') return 'badge-orange';
      if (e.Category === 'Brangkas') return 'bg-success';
      return 'bg-success';
    }

    // ===== Export Pengeluaran Harian (periode yang sedang ditampilkan) =====
    function exportFinanceExpenses(format) {
      if (!financeExpenseCache.length) return Swal.fire('Perhatian', 'Tidak ada data pengeluaran untuk diexport pada periode ini.', 'warning');
      let rangeInfo = computeFinanceExpenseRange_();
      const headers = ['Tanggal', 'Supplier', 'Belanja/Pengeluaran', 'Harga', 'Qty', 'Sat', 'Total', 'Status Pembayaran', 'Pos Biaya', 'Pos Penggunaan'];
      const rows = financeExpenseCache.map(e => [fmtDate(e.Date), e.Supplier || '-', e.Description, fmtRp(e.UnitPrice), e.Qty || 1, e.Unit || '-', fmtRp(e.Amount), e.StatusPembayaran || e.Category, e.COAName || '-', e.PosPenggunaan || '-']);
      let fileSuffix = rangeInfo.start === rangeInfo.end ? rangeInfo.start : (rangeInfo.start + '_sd_' + rangeInfo.end);
      let fileBase = 'PengeluaranHarian_' + fileSuffix;
      if (format === 'pdf') exportToPdf(fileBase + '.pdf', 'Pengeluaran Harian', 'Periode: ' + rangeInfo.label, [{ headers, rows }]);
      else exportToXlsx(fileBase + '.xlsx', 'Pengeluaran Harian', headers, rows);
      Toast.fire({ icon: 'success', title: 'File berhasil diunduh' });
    }

    function downloadFinanceExpenseTemplate() {
      let wsData = [
        ["Tanggal (yyyy-mm-dd)", "Supplier", "Belanja/Pengeluaran", "Harga Satuan", "Qty", "Satuan", "Status Pembayaran (harus sama persis dgn Master Keuangan)", "Kode Akun (Pos Biaya)", "Pos Penggunaan"],
        [todayStr(), "Toko Contoh", "Beli Oli Mesin Wahana", 50000, 2, "Ltr", "Lunas - Brangkas", "5102", "Maintenance / Teknisi"]
      ];
      let ws = XLSX.utils.aoa_to_sheet(wsData);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template Pengeluaran");
      XLSX.writeFile(wb, "Template_Import_Pengeluaran_Harian.xlsx");
    }

    function handleFinanceExpenseImport(event) {
      let file = event.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(e) {
        try {
          let data = new Uint8Array(e.target.result);
          let workbook = XLSX.read(data, { type: 'array' });
          let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          let rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          if (!rows.length) { Swal.fire('Perhatian', 'File kosong atau format tidak sesuai template.', 'warning'); return; }

          function toDateInput_(v) {
            if (v instanceof Date) return toDateStr_(v);
            if (typeof v === 'number') { let d = XLSX.SSF.parse_date_code(v); return d ? (d.y + '-' + pad2_(d.m) + '-' + pad2_(d.d)) : '';}
            return String(v || '').trim();
          }

          let mapped = rows.map(r => ({
            date: toDateInput_(r['Tanggal (yyyy-mm-dd)'] || r['Tanggal']),
            supplier: String(r['Supplier'] || '').trim(),
            description: String(r['Belanja/Pengeluaran'] || '').trim(),
            unitPrice: r['Harga Satuan'] || 0,
            qty: r['Qty'] || 1,
            unit: String(r['Satuan'] || '-').trim(),
            statusPembayaran: String(r['Status Pembayaran (harus sama persis dgn Master Keuangan)'] || r['Status Pembayaran'] || '').trim(),
            coaCode: String(r['Kode Akun (Pos Biaya)'] || r['Kode Akun'] || '').trim(),
            posPenggunaan: String(r['Pos Penggunaan'] || '').trim()
          })).filter(r => r.date && r.description);

          if (!mapped.length) { Swal.fire('Perhatian', 'Tidak ada baris valid (pastikan kolom Tanggal & Belanja/Pengeluaran terisi).', 'warning'); return; }

          Swal.fire({
            title: 'Konfirmasi Import', text: `Ditemukan ${mapped.length} baris pengeluaran. Lanjutkan import ke sistem?`,
            icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Import'
          }).then(r => {
            if (!r.isConfirmed) return;
            Swal.fire({ title: 'Mengimpor data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run.withSuccessHandler(res => {
              Swal.close();
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              let msg = `Berhasil mengimpor ${res.inserted} baris pengeluaran.`;
              if (res.errors.length) msg += ` ${res.errors.length} baris dilewati (lihat detail di bawah).`;
              Swal.fire({ title: 'Import Selesai', html: msg + (res.errors.length ? '<div class="text-start small mt-2" style="max-height:150px;overflow:auto;">' + res.errors.map(e=>esc(e)).join('<br>') + '</div>' : ''), icon: 'success' });
              loadFinanceExpenses();
            }).withFailureHandler(errHandler).bulkImportFinanceExpenses(mapped, sessionToken);
          });
        } catch (err) {
          Swal.fire('Gagal', 'File tidak dapat dibaca: ' + err.message, 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function onFinanceExpenseDateChange() {
      financeBalanceDate = $('#fin-bal-date').val();
      loadFinanceExpenses();
    }

    function loadFinanceExpenses() {
      let rangeInfo = computeFinanceExpenseRange_();
      if (financeExpenseFilterMode === 'range' && (!rangeInfo.start || !rangeInfo.end)) {
        $('#fin-exp-tbody').html('<tr><td colspan="11" class="text-center text-muted">Pilih tanggal "Dari" &amp; "Sampai" terlebih dahulu.</td></tr>');
        $('#fin-exp-total-badge').text('');
        return;
      }
      function handleResult_(res) {
        if (!res.success) return Swal.fire('Gagal', res.message, 'error');
        // Urutkan berdasarkan tanggal (lama -> baru) - relevan terutama untuk
        // mode Bulan Ini/Tahun Ini/Rentang yang mengembalikan banyak tanggal
        // sekaligus (server tidak mengurutkan hasil filternya).
        financeExpenseCache = (res.data || []).slice().sort((a, b) => new Date(a.Date) - new Date(b.Date));
        let total = 0;
        let rows = financeExpenseCache.map(e => {
          total += Number(e.Amount) || 0;
          let statusBadge = financeExpenseBadgeClass_(e);
          return `<tr>
            <td>${fmtDate(e.Date)}</td>
            <td>${esc(e.Supplier || '-')}</td>
            <td>${esc(e.Description)}</td>
            <td class="text-end">${fmtRp(e.UnitPrice)}</td>
            <td class="text-end">${esc(e.Qty || 1)}</td>
            <td>${esc(e.Unit || '-')}</td>
            <td class="text-end fw-semibold">${fmtRp(e.Amount)}</td>
            <td><span class="badge ${statusBadge}">${esc(e.StatusPembayaran || FINANCE_CAT_LABEL[e.Category] || e.Category)}</span></td>
            <td>${esc(e.COAName || '-')}</td>
            <td>${esc(e.PosPenggunaan || '-')}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-1" onclick="editFinanceExpenseRow('${esc(e.ExpenseID)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteFinanceExpenseRow('${esc(e.ExpenseID)}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('');
        $('#fin-exp-tbody').html(rows);
        $('#fin-exp-total-badge').text('Total (' + rangeInfo.label + '): ' + fmtRp(total));
        let sel = '#fin-exp-table';
        if ($.fn.DataTable.isDataTable(sel)) $(sel).DataTable().destroy();
        $(sel).DataTable({ pageLength: 10, order: [], language: { emptyTable: 'Belum ada pengeluaran untuk periode ini' } });
      }
      if (financeExpenseFilterMode === 'day') {
        google.script.run.withSuccessHandler(handleResult_).withFailureHandler(errHandler).getFinanceExpenses(rangeInfo.start, sessionToken);
      } else {
        google.script.run.withSuccessHandler(handleResult_).withFailureHandler(errHandler).getFinanceExpensesRange(rangeInfo.start, rangeInfo.end, sessionToken);
      }
    }

    function editFinanceExpenseRow(id) {
      let e = financeExpenseCache.find(x => x.ExpenseID === id);
      if (!e) return Swal.fire('Gagal', 'Data tidak ditemukan, coba Refresh Data.', 'error');
      openFinanceExpenseModal(e);
    }

    function openFinanceExpenseModal(e) {
      const isEdit = !!e;
      loadFinanceMasterDropdownsThen_(function() {
        if (!financeStatusCache.length || !financeCoaCache.length) {
          return Swal.fire('Perhatian', 'Master Status Pembayaran / Pos Biaya (Kode Akun) belum diatur. Buka menu Admin Keuangan &rsaquo; Master Keuangan terlebih dahulu.', 'warning');
        }
        let statusOptions = financeStatusCache.map(s => `<option value="${esc(s.StatusName)}" ${isEdit && e.StatusPembayaran===s.StatusName?'selected':''}>${esc(s.StatusName)}</option>`).join('');
        let coaOptions = financeCoaCache.map(c => `<option value="${esc(c.COACode)}" ${isEdit && e.COACode===c.COACode?'selected':''}>${esc(c.COACode)} - ${esc(c.COAName)}</option>`).join('');
        let posOptions = '<option value="">-</option>' + financePosCache.map(p => `<option value="${esc(p.PosName)}" ${isEdit && e.PosPenggunaan===p.PosName?'selected':''}>${esc(p.PosName)}</option>`).join('');

        Swal.fire({
          title: isEdit ? 'Edit Pengeluaran' : 'Tambah Pengeluaran Harian',
          width: 620,
          html: `
            <div class="text-start">
              <div class="row g-2">
                <div class="col-md-6"><label class="form-label small mb-1">Tanggal</label><input id="swal-fe-date" type="date" class="form-control" value="${isEdit ? e.Date : financeBalanceDate}"></div>
                <div class="col-md-6"><label class="form-label small mb-1">Suplayer</label><input id="swal-fe-supplier" class="form-control" value="${isEdit ? esc(e.Supplier || '') : ''}" placeholder="Nama suplayer/toko"></div>
                <div class="col-12"><label class="form-label small mb-1">Belanja / Pengeluaran</label><input id="swal-fe-desc" class="form-control" value="${isEdit ? esc(e.Description) : ''}" placeholder="Mis. Beli Oli Mesin Wahana"></div>
                <div class="col-md-4"><label class="form-label small mb-1">Harga (satuan)</label><input id="swal-fe-harga" type="number" class="form-control" value="${isEdit ? e.UnitPrice : ''}" oninput="updateFeTotalPreview()"></div>
                <div class="col-md-4"><label class="form-label small mb-1">Qty</label><input id="swal-fe-qty" type="number" class="form-control" value="${isEdit ? e.Qty : 1}" oninput="updateFeTotalPreview()"></div>
                <div class="col-md-4"><label class="form-label small mb-1">Sat</label><input id="swal-fe-sat" class="form-control" value="${isEdit ? esc(e.Unit || '') : ''}" placeholder="pcs/box/ltr"></div>
                <div class="col-12"><div class="small text-muted">Total Harga: <strong id="fe-total-preview">${fmtRp(isEdit ? e.Amount : 0)}</strong></div></div>
                <div class="col-md-6"><label class="form-label small mb-1">Status Pembayaran</label><select id="swal-fe-status" class="form-select">${statusOptions}</select></div>
                <div class="col-md-6"><label class="form-label small mb-1">Pos Biaya (Kode Akun)</label><select id="swal-fe-coa" class="form-select">${coaOptions}</select></div>
                <div class="col-12"><label class="form-label small mb-1">Pos Penggunaan / Kegiatan</label><select id="swal-fe-pos" class="form-select">${posOptions}</select></div>
              </div>
            </div>`,
          confirmButtonText: 'Simpan', showCancelButton: true, focusConfirm: false,
          didOpen: () => {
            window.updateFeTotalPreview();
            // Select2 supaya Pos Biaya (Kode Akun) & Pos Penggunaan bisa
            // dicari lewat ketik (bukan cuma scroll) - jumlah kode/nama COA
            // dan Pos Penggunaan bisa banyak sehingga select biasa merepotkan.
            $('#swal-fe-coa').select2({ width: '100%', dropdownParent: $(Swal.getPopup()), placeholder: 'Cari Kode/Nama Akun...' });
            $('#swal-fe-pos').select2({ width: '100%', dropdownParent: $(Swal.getPopup()), placeholder: 'Cari Pos Penggunaan...', allowClear: true });
          },
          preConfirm: () => {
            let desc = document.getElementById('swal-fe-desc').value;
            let status = document.getElementById('swal-fe-status').value;
            let coa = document.getElementById('swal-fe-coa').value;
            if (!desc) { Swal.showValidationMessage('Belanja / Pengeluaran wajib diisi'); return false; }
            if (!status) { Swal.showValidationMessage('Status Pembayaran wajib dipilih'); return false; }
            return {
              isEdit: isEdit, ExpenseID: isEdit ? e.ExpenseID : null,
              Date: document.getElementById('swal-fe-date').value,
              Supplier: document.getElementById('swal-fe-supplier').value,
              Description: desc,
              UnitPrice: document.getElementById('swal-fe-harga').value,
              Qty: document.getElementById('swal-fe-qty').value,
              Unit: document.getElementById('swal-fe-sat').value,
              StatusPembayaran: status,
              COACode: coa,
              PosPenggunaan: document.getElementById('swal-fe-pos').value
            };
          }
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler(res => {
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              Toast.fire({ icon: 'success', title: res.message });
              loadFinanceExpenses();
            }).withFailureHandler(errHandler).saveFinanceExpense(result.value, sessionToken);
          }
        });
      });
    }

    // ================= PENGELUARAN HARIAN: INPUT MODEL DATA GRID (BANYAK BARIS) =================
    // Admin mengisi banyak baris sekaligus lalu klik "Simpan Semua" sekali.
    // Baris yang masih kosong diabaikan. Disimpan lewat bulkImportFinanceExpenses
    // (jalur validasi yang sama dengan Import Excel).
    const FE_GRID_INITIAL_ROWS = 5;
    let feGridRowSeq = 0;

    function feGridDefaultDate_() {
      return (financeExpenseFilterMode === 'day' && financeBalanceDate) ? financeBalanceDate : todayStr();
    }

    function feGridRowHtml_(d) {
      d = d || {};
      const n = ++feGridRowSeq;
      const statusOpts = '<option value="">— Pilih —</option>' + financeStatusCache.map(s => `<option value="${esc(s.StatusName)}" ${d.status === s.StatusName ? 'selected' : ''}>${esc(s.StatusName)}</option>`).join('');
      const coaOpts = '<option value="">— Pilih —</option>' + financeCoaCache.map(c => `<option value="${esc(c.COACode)}" ${String(d.coa || '') === String(c.COACode) ? 'selected' : ''}>${esc(c.COACode)} - ${esc(c.COAName)}</option>`).join('');
      const posOpts = '<option value="">—</option>' + financePosCache.map(p => `<option value="${esc(p.PosName)}" ${d.pos === p.PosName ? 'selected' : ''}>${esc(p.PosName)}</option>`).join('');
      return `<tr class="fe-row" data-rid="${n}">
        <td class="fe-no text-center fw-bold align-middle"></td>
        <td style="min-width:150px"><input type="date" class="form-control fe-date" data-col="date" value="${esc(d.date || feGridDefaultDate_())}"></td>
        <td style="min-width:170px"><input class="form-control fe-supplier" data-col="supplier" placeholder="Suplayer/toko" value="${esc(d.supplier || '')}"></td>
        <td style="min-width:240px"><input class="form-control fe-desc" data-col="desc" placeholder="Belanja / pengeluaran" value="${esc(d.desc || '')}"></td>
        <td style="min-width:130px"><input type="number" inputmode="decimal" min="0" step="any" class="form-control text-end fe-harga" data-col="harga" placeholder="0" value="${esc(d.harga || '')}"></td>
        <td style="min-width:80px"><input type="number" inputmode="decimal" min="0" step="any" class="form-control text-end fe-qty" data-col="qty" value="${esc(d.qty || 1)}"></td>
        <td style="min-width:90px"><input class="form-control fe-sat" data-col="sat" placeholder="pcs" value="${esc(d.sat || '')}"></td>
        <td class="text-end fw-semibold align-middle fe-total" style="min-width:120px">Rp 0</td>
        <td style="min-width:170px"><select class="form-select fe-status" data-col="status">${statusOpts}</select></td>
        <td style="min-width:230px"><select class="form-select fe-coa" data-col="coa">${coaOpts}</select></td>
        <td style="min-width:200px"><select class="form-select fe-pos" data-col="pos">${posOpts}</select></td>
        <td class="text-nowrap align-middle">
          <button type="button" class="btn btn-sm btn-outline-secondary fe-dup" title="Gandakan baris"><i class="fa-solid fa-copy"></i></button>
          <button type="button" class="btn btn-sm btn-outline-danger fe-del" title="Hapus baris"><i class="fa-solid fa-xmark"></i></button>
        </td>
      </tr>`;
    }

    function feGridInitRow_($tr) {
      const $m = $('#fe-grid-modal');
      $tr.find('.fe-coa').select2({ width: '100%', dropdownParent: $m, placeholder: '— Pilih —' });
      $tr.find('.fe-pos').select2({ width: '100%', dropdownParent: $m, placeholder: '—', allowClear: true });
      feGridCalcRow_($tr);
    }

    function feGridAddRow_(d, focusCol) {
      const $tr = $(feGridRowHtml_(d));
      $('#fe-grid-body').append($tr);
      feGridInitRow_($tr);
      feGridRenumber_();
      if (focusCol) $tr.find('[data-col="' + focusCol + '"]').first().trigger('focus');
      return $tr;
    }

    function feGridRenumber_() {
      $('#fe-grid-body .fe-row').each(function(i) { $(this).find('.fe-no').text(i + 1); });
    }

    function feGridCalcRow_($tr) {
      const t = (Number($tr.find('.fe-harga').val()) || 0) * (Number($tr.find('.fe-qty').val()) || 0);
      $tr.find('.fe-total').text(fmtRp(t));
      feGridCalcAll_();
    }

    function feGridCalcAll_() {
      let sum = 0, filled = 0;
      $('#fe-grid-body .fe-row').each(function() {
        const $tr = $(this);
        if (feGridRowIsEmpty_($tr)) return;
        filled++;
        sum += (Number($tr.find('.fe-harga').val()) || 0) * (Number($tr.find('.fe-qty').val()) || 0);
      });
      $('#fe-grid-sum').text(fmtRp(sum));
      $('#fe-grid-count').text(filled);
    }

    // Baris dianggap kosong bila Belanja, Harga, Suplayer & Sat belum diisi
    // (Tanggal/Qty/Status/Akun bisa terisi otomatis dari default).
    function feGridRowIsEmpty_($tr) {
      return !String($tr.find('.fe-desc').val()).trim() && !String($tr.find('.fe-harga').val()).trim()
        && !String($tr.find('.fe-supplier').val()).trim() && !String($tr.find('.fe-sat').val()).trim();
    }

    // Baris baru mewarisi Tanggal, Suplayer, Status Pembayaran, Pos Biaya & Pos Penggunaan dari baris terakhir
    function feGridInheritFromLast_() {
      const $last = $('#fe-grid-body .fe-row:last');
      if (!$last.length) return {};
      const r = feGridReadRow_($last);
      return { date: r.date, supplier: r.supplier, status: r.status, coa: r.coa, pos: r.pos };
    }

    function feGridSave_() {
      const items = [];   // { $tr, no, payload }
      const problems = [];
      $('#fe-grid-body .fe-row').each(function(i) {
        const $tr = $(this);
        $tr.find('.is-invalid').removeClass('is-invalid');
        if (feGridRowIsEmpty_($tr)) return;
        const r = feGridReadRow_($tr);
        const bad = [];
        if (!r.date) { bad.push('Tanggal'); $tr.find('.fe-date').addClass('is-invalid'); }
        if (!String(r.desc).trim()) { bad.push('Belanja/Pengeluaran'); $tr.find('.fe-desc').addClass('is-invalid'); }
        if (!r.status) { bad.push('Status Pembayaran'); $tr.find('.fe-status').addClass('is-invalid'); }
        if (!r.coa) { bad.push('Pos Biaya'); $tr.find('.fe-coa').addClass('is-invalid').next('.select2').find('.select2-selection').css('border-color', '#dc3545'); }
        if (bad.length) { problems.push('Baris ' + (i + 1) + ': ' + bad.join(', ') + ' belum diisi'); return; }
        items.push({
          $tr: $tr,
          payload: {
            date: r.date, supplier: String(r.supplier).trim(), description: String(r.desc).trim(),
            unitPrice: Number(r.harga) || 0, qty: r.qty === '' ? 1 : (Number(r.qty) || 0), unit: String(r.sat).trim() || '-',
            statusPembayaran: r.status, coaCode: r.coa, posPenggunaan: r.pos || ''
          }
        });
      });
      if (problems.length) {
        return Swal.fire({ title: 'Data belum lengkap', html: '<div class="text-start small">' + problems.map(esc).join('<br>') + '</div>', icon: 'warning' });
      }
      if (!items.length) return Swal.fire('Perhatian', 'Belum ada data yang diisi.', 'info');

      const total = items.reduce((a, it) => a + it.payload.unitPrice * it.payload.qty, 0);
      Swal.fire({
        title: 'Simpan ' + items.length + ' pengeluaran?', html: 'Total: <strong>' + fmtRp(total) + '</strong>',
        icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Simpan Semua', cancelButtonText: 'Periksa lagi'
      }).then(c => {
        if (!c.isConfirmed) return;
        const $btn = $('#fe-grid-save').prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...');
        const restore = () => $btn.prop('disabled', false).html('<i class="fa-solid fa-floppy-disk me-1"></i>Simpan Semua');
        google.script.run.withSuccessHandler(res => {
          restore();
          if (!res || !res.success) return Swal.fire('Gagal', (res && res.message) || 'Gagal menyimpan', 'error');
          // Server memberi nomor "Baris N" = indeks kiriman + 2; cocokkan ke baris grid yang gagal
          const failed = {};
          (res.errors || []).forEach(m => { const mm = /^Baris (\d+):/.exec(m); if (mm) failed[Number(mm[1]) - 2] = true; });
          const errs = (res.errors || []).map(m => m.replace(/^Baris (\d+):/, (x, n) => 'Baris kiriman ke-' + (Number(n) - 1) + ':'));
          items.forEach((it, idx) => { if (!failed[idx]) it.$tr.remove(); });
          feGridRenumber_(); feGridCalcAll_();
          loadFinanceExpenses();
          if (!(res.errors || []).length) {
            Toast.fire({ icon: 'success', title: res.inserted + ' pengeluaran berhasil disimpan' });
            feGridClose_(true);
          } else {
            if (!$('#fe-grid-body .fe-row').length) feGridAddRow_();
            Swal.fire({ title: 'Sebagian tersimpan', html: res.inserted + ' baris tersimpan. Baris berikut gagal dan tetap ada di tabel:<div class="text-start small mt-2" style="max-height:150px;overflow:auto;">' + errs.map(esc).join('<br>') + '</div>', icon: 'warning' });
          }
        }).withFailureHandler(err => { restore(); errHandler(err); }).bulkImportFinanceExpenses(items.map(it => it.payload), sessionToken);
      });
    }

    function exportFinanceMaster(kind, format) {
      let title, headers, rows, fileBase;
      if (kind === 'coa') {
        if (!financeCoaCache.length) return Swal.fire('Perhatian', 'Belum ada data Kode Akun.', 'warning');
        title = 'Master Kode Akun (COA)'; fileBase = 'MasterKodeAkun';
        headers = ['Kode', 'Nama Akun', 'Tipe', 'Status'];
        rows = financeCoaCache.map(c => [c.COACode, c.COAName, c.Type, c.Status]);
      } else if (kind === 'status') {
        if (!financeStatusCache.length) return Swal.fire('Perhatian', 'Belum ada data Status Pembayaran.', 'warning');
        title = 'Master Status Pembayaran'; fileBase = 'MasterStatusPembayaran';
        headers = ['Nama Status', 'Bucket / Sumber Dana', 'Status'];
        rows = financeStatusCache.map(s => [s.StatusName, FINANCE_CAT_LABEL[s.Bucket] || s.Bucket, s.Status]);
      } else {
        if (!financePosCache.length) return Swal.fire('Perhatian', 'Belum ada data Pos Penggunaan.', 'warning');
        title = 'Master Pos Penggunaan'; fileBase = 'MasterPosPenggunaan';
        headers = ['Nama Pos Penggunaan', 'Status'];
        rows = financePosCache.map(p => [p.PosName, p.Status]);
      }
      if (format === 'pdf') exportToPdf(fileBase + '.pdf', title, null, [{ headers, rows }]);
      else exportToXlsx(fileBase + '.xlsx', title, headers, rows);
      Toast.fire({ icon: 'success', title: 'File berhasil diunduh' });
    }

    function downloadCoaTemplate() {
      let ws = XLSX.utils.aoa_to_sheet([
        ["Kode Akun", "Nama Akun", "Tipe (Pengeluaran/Pendapatan)", "Status (Active/Inactive)"],
        ["5106", "Contoh Biaya Kebersihan", "Pengeluaran", "Active"]
      ]);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template COA");
      XLSX.writeFile(wb, "Template_Import_Kode_Akun.xlsx");

    function handleCoaImport(event) {
      let file = event.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(e) {
        try {
          let workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          let rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
          if (!rows.length) { Swal.fire('Perhatian', 'File kosong atau format tidak sesuai template.', 'warning'); return; }
          let mapped = rows.map(r => ({
            coaCode: String(r['Kode Akun'] || '').trim(),
            coaName: String(r['Nama Akun'] || '').trim(),
            type: String(r['Tipe (Pengeluaran/Pendapatan)'] || r['Tipe'] || 'Pengeluaran').trim(),
            status: String(r['Status (Active/Inactive)'] || r['Status'] || 'Active').trim()
          })).filter(r => r.coaCode && r.coaName);
          if (!mapped.length) { Swal.fire('Perhatian', 'Tidak ada baris valid (Kode Akun & Nama Akun wajib terisi).', 'warning'); return; }
          Swal.fire({ title: 'Konfirmasi Import', text: `Ditemukan ${mapped.length} baris Kode Akun. Lanjutkan?`, icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Import' }).then(r => {
            if (!r.isConfirmed) return;
            Swal.fire({ title: 'Mengimpor data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run.withSuccessHandler(res => {
              Swal.close();
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              Swal.fire('Import Selesai', `Berhasil: ${res.inserted} baru, ${res.updated} diperbarui.` + (res.errors.length ? ` ${res.errors.length} baris dilewati.` : ''), 'success');
              fetchCoaTable();
            }).withFailureHandler(errHandler).bulkImportFinanceCOA(mapped, sessionToken);
          });
        } catch (err) { Swal.fire('Gagal', 'File tidak dapat dibaca: ' + err.message, 'error'); }
        finally { event.target.value = ''; }
      };
      reader.readAsArrayBuffer(file);
    }

            posName: String(r['Nama Pos Penggunaan'] || '').trim(),
            status: String(r['Status (Active/Inactive)'] || r['Status'] || 'Active').trim()
          })).filter(r => r.posName);
          if (!mapped.length) { Swal.fire('Perhatian', 'Tidak ada baris valid (Nama Pos Penggunaan wajib terisi).', 'warning'); return; }
          Swal.fire({ title: 'Konfirmasi Import', text: `Ditemukan ${mapped.length} baris Pos Penggunaan. Lanjutkan?`, icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Import' }).then(r => {
            if (!r.isConfirmed) return;
            Swal.fire({ title: 'Mengimpor data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run.withSuccessHandler(res => {
              Swal.close();
              if (!res.success) return Swal.fire('Gagal', res.message, 'error');
              Swal.fire('Import Selesai', `Berhasil: ${res.inserted} baru, ${res.updated} diperbarui.` + (res.errors.length ? ` ${res.errors.length} baris dilewati.` : ''), 'success');
              fetchPosTable();
            }).withFailureHandler(errHandler).bulkImportFinancePosPenggunaan(mapped, sessionToken);
          });
        } catch (err) { Swal.fire('Gagal', 'File tidak dapat dibaca: ' + err.message, 'error'); }
        finally { event.target.value = ''; }
      };
      reader.readAsArrayBuffer(file);
    }

    // ================= ADMIN KEUANGAN: REPORT HARIAN =================
    let financeReportDate = todayStr();
    let financeReportData = null;
    let finRepChartOutlet = null, finRepChartPayment = null, finRepChartExpense = null, finRepChartCategory = null;

    // ================= ADMIN KEUANGAN: PENGATURAN ISI REPORT (PDF/XLSX) =================
    // Memungkinkan Admin Keuangan memilih bagian mana saja yang ingin
    // ditampilkan di file PDF/XLSX yang diunduh ATAU dikirim lewat email -
    // mulai dari cuma Grafik saja, atau kombinasi bagian tertentu (mis. Total
    // Penjualan per Kasir, Total Penjualan per Kategori, Total Penerimaan
    // Kasir, Total Pengeluaran), sampai SEMUA bagian seperti sebelumnya
    // (default). Pilihan ini dipakai bareng oleh downloadFinanceReportPdf(),
    // downloadFinanceReportXlsx(), dan sendFinanceReportEmailNow_() karena
    // ketiganya sama-sama memanggil buildFinanceReportPdfSections_() /
    // buildFinanceReportXlsxSheets_() / collectFinanceReportChartImages_().
    const FIN_REPORT_SECTION_DEFS = [
      { key: 'chart', label: 'Grafik (Pendapatan per Outlet, Tunai vs Non Tunai, Pengeluaran, Kategori)' },
      { key: 'saldo', label: 'Saldo Awal & Akhir (Brangkas / Rekening / THR)' },
      { key: 'entrance', label: 'Pendapatan Kasir Loket Masuk' },
      { key: 'ride', label: 'Pendapatan Kasir Loket Wahana' },
      { key: 'resto', label: 'Pendapatan Kasir Resto' },
      { key: 'category', label: 'Total Penjualan per Kategori (Semua Outlet)' },
      { key: 'kasirPenerimaan', label: 'Total Penjualan / Penerimaan per Kasir' },
      { key: 'expBrangkas', label: 'Total Pengeluaran dari Brangkas' },
      { key: 'expRekening', label: 'Total Pengeluaran dari Rekening PT' },
      { key: 'ringkasan', label: 'Ringkasan Akhir (Total Pendapatan, Pengeluaran, Saldo Bersih, dll)' }
    ];
    // Default: SEMUA aktif - sama persis seperti tampilan report yang sudah
    // ada saat ini, supaya tidak berubah kalau admin tidak mengubah apapun.
    let financeReportSections = {};
    FIN_REPORT_SECTION_DEFS.forEach(d => { financeReportSections[d.key] = true; });
    // PERBAIKAN: opsi tambahan (bukan bagian on/off, tapi filter isi tabel)
    // untuk menyembunyikan produk yang TIDAK ada penjualan (Qty 0) di tabel
    // Pendapatan Kasir Loket Masuk/Wahana/Resto pada PDF/XLSX - supaya isi
    // laporan tidak terlalu panjang & boros kertas kalau Master Produk-nya
    // banyak. Default: OFF (tampilkan semua produk, sama seperti sebelumnya).
    financeReportSections.hideZeroQty = false;
    // PERBAIKAN: opsi terpisah khusus untuk Laporan WA (tombol "Salin Format
    // WA") - menyembunyikan baris produk Qty 0 di teks WA (Pendapatan Kasir
    // Loket Masuk/Wahana/Resto). Sengaja dibuat toggle TERPISAH dari
    // hideZeroQty (yang untuk PDF/XLSX) supaya admin bisa atur masing-masing
    // format laporan secara independen. Total/subtotal Qty di teks WA tetap
    // dihitung dari SEMUA data (tidak terpengaruh toggle ini). Default: OFF.
    financeReportSections.hideZeroQtyWa = false;
    // PERBAIKAN: ukuran kertas PDF yang bisa diatur - A4 Landscape (default,
    // sama seperti sebelumnya) atau A4 Potrait (lebih hemat kertas/jumlah
    // halaman untuk laporan yang tabelnya tidak terlalu banyak kolom).
    // Dipakai bareng oleh Report Admin Keuangan & Report Semua Kasir.
    financeReportSections.orientation = 'landscape';

    // Hilangkan baris produk dengan Qty 0 dari sebuah daftar `lines`, HANYA
    // kalau opsi "Sembunyikan produk tanpa penjualan" aktif. Dipakai bareng
    // oleh Report Admin Keuangan (Report harian) & Report Semua Kasir.
    function finFilterZeroQty_(lines) {
      return financeReportSections.hideZeroQty ? (lines || []).filter(l => Number(l.qty) > 0) : (lines || []);
    }

    // Sama seperti finFilterZeroQty_() di atas, tapi khusus dipakai oleh
    // buildFinanceWaText() (tombol "Salin Format WA") dan mengikuti toggle
    // hideZeroQtyWa yang terpisah dari toggle PDF/XLSX.
    function finFilterZeroQtyWa_(lines) {
      return financeReportSections.hideZeroQtyWa ? (lines || []).filter(l => Number(l.qty) > 0) : (lines || []);
    }

        + '<label class="form-check-label small fw-bold" for="fin-sec-hidezero-wa">Sembunyikan produk yang TIDAK ada penjualan (Qty 0) di tabel Pendapatan Kasir Loket Masuk / Wahana / Resto (untuk Laporan WA)</label>'

        + `<div class="form-check"><input class="form-check-input" type="radio" name="fin-sec-orient" id="fin-sec-orient-portrait" value="portrait" ${financeReportSections.orientation === 'portrait' ? 'checked' : ''}><label class="form-check-label small" for="fin-sec-orient-portrait">A4 Potrait (hemat kertas)</label></div>`
        + `<div class="form-check"><input class="form-check-input" type="radio" name="fin-sec-orient" id="fin-sec-orient-landscape" value="landscape" ${financeReportSections.orientation !== 'portrait' ? 'checked' : ''}><label class="form-check-label small" for="fin-sec-orient-landscape">A4 Landscape</label></div>`
        + '</div>'
        + '<div class="form-text small">Potrait cocok kalau bagian yang dipilih tidak terlalu banyak/lebar (jumlah halaman lebih sedikit). Landscape lebih lega untuk tabel dengan banyak kolom atau banyak grafik sekaligus.</div>'
        + '</div>';
      Swal.fire({
        title: 'Atur Isi Laporan (PDF/XLSX)',
        html: html,
        showCancelButton: true,
        confirmButtonText: 'Simpan',
        cancelButtonText: 'Batal',
        focusConfirm: false,
        didOpen: () => {
          document.getElementById('fin-sec-all').onclick = () => { document.querySelectorAll('.fin-sec-chk').forEach(c => c.checked = true); };
          document.getElementById('fin-sec-none').onclick = () => { document.querySelectorAll('.fin-sec-chk').forEach(c => c.checked = false); };
        },
        preConfirm: () => {
          let checked = Array.from(document.querySelectorAll('.fin-sec-chk')).filter(c => c.checked).map(c => c.value);
          if (!checked.length) { Swal.showValidationMessage('Pilih minimal satu bagian laporan'); return false; }
          let orientEl = document.querySelector('input[name="fin-sec-orient"]:checked');
          return { checked: checked, hideZeroQty: document.getElementById('fin-sec-hidezero').checked, hideZeroQtyWa: document.getElementById('fin-sec-hidezero-wa').checked, orientation: orientEl ? orientEl.value : 'landscape' };
        }
      }).then(result => {
        if (result.isConfirmed) {
          FIN_REPORT_SECTION_DEFS.forEach(d => { financeReportSections[d.key] = result.value.checked.includes(d.key); });
          financeReportSections.hideZeroQty = !!result.value.hideZeroQty;
          financeReportSections.hideZeroQtyWa = !!result.value.hideZeroQtyWa;
          financeReportSections.orientation = result.value.orientation === 'portrait' ? 'portrait' : 'landscape';
          Toast.fire({ icon: 'success', title: 'Pengaturan isi laporan disimpan' });
        }
      });
    }

    function finUnitTable_(title, unitData) {
      let rows = unitData.lines.map(l => `<tr><td>${esc(l.productName)}${l.variant ? ' <span class="text-muted">(' + esc(l.variant) + ')</span>' : ''}</td><td class="text-end">${fmtRp(l.unitPrice)}</td><td class="text-end">${l.qty}</td><td class="text-end">${fmtRp(l.total)}</td></tr>`).join('');
      // PERBAIKAN: Subtotal Qty (jumlah unit terjual) ditampilkan berdampingan
      // dengan Subtotal Total (Rp) - dihitung dari SELURUH baris (tidak
      // terpengaruh filter "Sembunyikan produk Qty 0") supaya angkanya tetap
      // akurat & konsisten dengan Total Pendapatan Kotor.
      let qtyVal = (typeof unitData.totalQty === 'number') ? unitData.totalQty : unitData.lines.reduce((t, l) => t + (Number(l.qty) || 0), 0);
      return `
        <h6 class="fw-bold mt-3">${esc(title)}</h6>
        <div class="table-responsive"><table class="table table-sm table-striped mb-1">
          <thead><tr><th>Produk</th><th class="text-end">Harga</th><th class="text-end">Qty</th><th class="text-end">Total</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <div class="text-end fw-bold small">Subtotal Qty ${esc(title)}: ${qtyVal} &nbsp;|&nbsp; Subtotal ${esc(title)}: ${fmtRp(unitData.total)}</div>`;
    }

    // Grafik Pendapatan Per Kategori (SEMUA outlet digabung: Kasir Loket
    // Masuk, Kasir Loket Wahana, Kasir Resto) - ditampilkan di HEADER report,
    // tepat di bawah baris grafik "Pendapatan per Outlet".
    function renderFinanceCategoryChartSection_() {
      return `
        <div class="row g-3 mb-3">
          <div class="col-12"><div class="p-3 border rounded"><h6 class="fw-bold small mb-2">Pendapatan per Kategori (Semua Outlet)</h6><div style="position:relative; height:260px;"><canvas id="fin-rep-chart-category"></canvas></div></div></div>
        </div>`;
    }

    // Rekapan Pendapatan Per Kategori (tabel) - SEMUA outlet digabung,
    // ditampilkan tepat di bawah tabel "Pendapatan Kasir Resto".
    function finCategoryTableSection_(categoryBreakdown) {
      categoryBreakdown = categoryBreakdown || { lines: [], total: 0 };
      let rows = categoryBreakdown.lines.map(l => `<tr><td>${esc(l.category)}</td><td class="text-end">${l.qty}</td><td class="text-end">${fmtRp(l.total)}</td></tr>`).join('')
        || '<tr><td colspan="3" class="text-muted text-center">Tidak ada data penjualan</td></tr>';
      return `
        <h6 class="fw-bold mt-3">Rekapan Pendapatan Per Kategori (Semua Outlet)</h6>
        <div class="table-responsive"><table class="table table-sm table-striped mb-1">
          <thead><tr><th>Kategori</th><th class="text-end">Qty</th><th class="text-end">Total</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="fw-bold border-top"><td>Total</td><td class="text-end">${categoryBreakdown.lines.reduce((t,l)=>t+l.qty,0)}</td><td class="text-end">${fmtRp(categoryBreakdown.total)}</td></tr></tfoot>
        </table></div>`;
    }

    function finKasirTable_(kasir) {
      let rows = (kasir.lines || []).map(l => `<tr><td>${esc(l.cashierName)}</td><td>${esc(l.posisi)}</td><td class="text-end">${fmtRp(l.tunai)}</td><td class="text-end">${fmtRp(l.nonTunai)}</td><td class="text-end fw-bold">${fmtRp(l.jumlah)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="text-muted text-center">Tidak ada data penerimaan kasir</td></tr>';
      return `
        <h6 class="fw-bold mt-3">Total Penerimaan dari Kasir</h6>
        <div class="table-responsive"><table class="table table-sm table-striped mb-1">
          <thead><tr><th>Nama Kasir</th><th>Posisi</th><th class="text-end">Total Uang Tunai</th><th class="text-end">Total Penerimaan QRIS+Transfer+Debit+Kredit</th><th class="text-end">Jumlah</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="fw-bold border-top"><td colspan="2">Total</td><td class="text-end">${fmtRp(kasir.totalTunai)}</td><td class="text-end">${fmtRp(kasir.totalNonTunai)}</td><td class="text-end">${fmtRp(kasir.totalJumlah)}</td></tr></tfoot>
        </table></div>`;
    }

    function renderFinanceReportChartsSection_() {
      return `
        <div class="row g-3 mb-3">

      if (!chartData || !document.getElementById('fin-rep-chart-outlet')) return;
      if (finRepChartOutlet) finRepChartOutlet.destroy();
      finRepChartOutlet = new Chart(document.getElementById('fin-rep-chart-outlet'), {
        type: 'bar',
        data: { labels: chartData.outletLabels, datasets: [{ label: 'Pendapatan', data: chartData.outletValues, backgroundColor: ['#0284c7', '#f59e0b', '#16a34a'] }] },
        // animation:false supaya canvas.toDataURL() saat export (PDF/XLSX/
        // email) selalu menangkap grafik yang sudah tergambar penuh.
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } } }
      });
      if (finRepChartPayment) finRepChartPayment.destroy();
      finRepChartPayment = new Chart(document.getElementById('fin-rep-chart-payment'), {
        type: 'doughnut',
        data: { labels: chartData.paymentLabels, datasets: [{ data: chartData.paymentValues, backgroundColor: ['#0284c7', '#8b5cf6'] }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false }
      });
      if (finRepChartExpense) finRepChartExpense.destroy();
      finRepChartExpense = new Chart(document.getElementById('fin-rep-chart-expense'), {
        type: 'doughnut',
        data: { labels: chartData.expenseLabels, datasets: [{ data: chartData.expenseValues, backgroundColor: ['#dc3545', '#f59e0b'] }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false }
      });
      if (finRepChartCategory) finRepChartCategory.destroy();
      let categoryCanvas = document.getElementById('fin-rep-chart-category');
      if (categoryCanvas) {
        finRepChartCategory = new Chart(categoryCanvas, {
          type: 'bar',
          data: { labels: chartData.categoryLabels || [], datasets: [{ label: 'Pendapatan', data: chartData.categoryValues || [], backgroundColor: '#16a34a' }] },
          options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', animation: false, plugins: { legend: { display: false } } }
        });
      }
